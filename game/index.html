<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Watson Dog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0a0c; overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #e8e4e0; }
  canvas { display: block; touch-action: none; }
  body.touch { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .panel { touch-action: pan-y; }
  /* Phone controls: only shown on touch screens */
  #touch { display: none; }
  body.touch #touch { display: block; }
  .tbtn { position: fixed; border-radius: 50%; border: 2px solid rgba(208,138,69,.8); background: rgba(30,20,16,.6);
    color: #f2e6c8; font: 700 11px system-ui, sans-serif; letter-spacing: .04em; display: flex; flex-direction: column;
    align-items: center; justify-content: center; touch-action: none; -webkit-tap-highlight-color: transparent; padding: 0; }
  .tbtn small { font-weight: 400; font-size: 9px; opacity: .8; }
  .tbtn.off { opacity: .35; }
  .tbtn.cool { background: rgba(10,8,8,.75); }
  .tbtn:active { background: rgba(208,138,69,.5); }
  #tChomp { width: 86px; height: 86px; right: calc(22px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); font-size: 14px; }
  #tRoll  { width: 64px; height: 64px; right: calc(120px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); }
  #tZoom  { width: 54px; height: 54px; right: calc(118px + env(safe-area-inset-right)); bottom: calc(96px + env(safe-area-inset-bottom)); }
  #tBark  { width: 54px; height: 54px; right: calc(56px + env(safe-area-inset-right)); bottom: calc(124px + env(safe-area-inset-bottom)); }
  #tTreat { width: 54px; height: 54px; right: calc(4px + env(safe-area-inset-right)); bottom: calc(124px + env(safe-area-inset-bottom)); }
  #tRest  { display: none; width: auto; height: 44px; border-radius: 22px; padding: 0 20px; left: calc(16px + env(safe-area-inset-left));
    bottom: calc(190px + env(safe-area-inset-bottom)); font-size: 14px; background: rgba(158,42,43,.85); }
  #tRest.show, #tFred.show { display: flex; }
  #tFred  { display: none; width: auto; height: 44px; border-radius: 22px; padding: 0 20px; left: calc(16px + env(safe-area-inset-left));
    bottom: calc(244px + env(safe-area-inset-bottom)); font-size: 14px; background: rgba(224,120,30,.85); }
  #tPause { width: 40px; height: 40px; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); font-size: 14px; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .7); }
  .overlay.open { display: flex; }
  .panel { background: #1a1517; border: 1px solid #4a3236; border-radius: 10px; padding: 20px 24px;
    width: min(640px, 92vw); max-height: 88vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .panel h1 { margin: 0 0 6px; font-size: 26px; font-family: Georgia, 'Times New Roman', serif; font-weight: normal; }
  .panel h2 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #a08a8c; }
  .panel p { color: #c4b8b6; line-height: 1.5; margin: 6px 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 6px; background: #241d20; margin-bottom: 6px; }
  .row .info { flex: 1; }
  .row .name { font-weight: 600; }
  .row .desc { font-size: 13px; color: #a89c9c; }
  .row .val { font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; font-weight: 600; }
  button { font: inherit; background: #9e2a2b; color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: #b83334; }
  button:disabled { background: #352b2d; color: #7d7072; cursor: default; }
  .xp { color: #f2c94c; font-weight: 600; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  kbd { background: #2c2427; border: 1px solid #54424a; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  .title { font-size: 34px !important; line-height: 1.15; color: #f0d9c8; }
  .died { font-family: Georgia, 'Times New Roman', serif; font-size: 64px; color: #b3191c; letter-spacing: .12em; margin: 0 0 10px; }
  #death .panel { background: none; border: 0; box-shadow: none; text-align: center; }
  #title { background: radial-gradient(ellipse at center, rgba(20,12,8,.55) 0%, rgba(8,6,6,.92) 75%); cursor: pointer; }
  .logo { display: flex; flex-direction: column; align-items: center; user-select: none; }
  #logoDog { width: min(360px, 70vw); height: auto; margin-bottom: -18px; }
  .logo-text { font-family: 'Luckiest Guy', Impact, 'Arial Black', sans-serif; font-size: clamp(64px, 13vw, 132px); line-height: .9;
    color: #d08a45; -webkit-text-stroke: 4px #3a2210; paint-order: stroke fill; letter-spacing: .03em;
    text-shadow: 0 7px 0 #3a2210, 0 14px 30px rgba(0,0,0,.6); transform: rotate(-3deg); text-align: center; }
  .logo-text span { display: block; color: #c0392b; font-size: .82em; margin-top: 4px; }
  .press { margin-top: 34px; font-family: 'Luckiest Guy', Impact, sans-serif; font-size: 20px; letter-spacing: .14em;
    color: #f2e6c8; opacity: .8; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .2; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="touch">
  <button class="tbtn" id="tChomp">CHOMP</button>
  <button class="tbtn" id="tRoll">ROLL</button>
  <button class="tbtn" id="tZoom">ZOOM<small></small></button>
  <button class="tbtn" id="tBark">BARK<small></small></button>
  <button class="tbtn" id="tTreat">TREAT<small></small></button>
  <button class="tbtn" id="tRest">Rest at the doghouse</button>
  <button class="tbtn" id="tFred">Shop with Fred</button>
  <button class="tbtn" id="tPause">II</button>
</div>

<div class="overlay open" id="title">
  <div class="logo">
    <canvas id="logoDog" width="720" height="440"></canvas>
    <div class="logo-text">Watson<span>Dog</span></div>
    <div class="press">press any key</div>
  </div>
</div>

<div class="overlay" id="shop">
  <div class="panel">
    <div class="top"><h1 id="shopTitle">Watson's Doghouse</h1><span class="xp" id="shopXp"></span></div>
    <p id="shopSub"></p>
    <div id="shopBody"></div>
    <p style="margin-top:14px"><button id="closeShop">Leave</button></p>
  </div>
</div>

<div class="overlay" id="win">
  <div class="panel" style="text-align:center">
    <h1 class="title">The pollution is lifting!</h1>
    <p>All four tainted townspeople are back to their old selves, and Jackie is safe. Good boy, Watson.</p>
    <p style="margin-top:16px"><button id="keepPlaying">Keep playing</button></p>
  </div>
</div>

<div class="overlay" id="death">
  <div class="panel">
    <div class="died">KNOCKED OUT</div>
    <p id="deathMsg"></p>
    <p style="margin-top:18px"><button id="respawn">Back to the doghouse (R)</button></p>
  </div>
</div>

<script>
// ---------- Setup ----------
const TW = 64, TH = 32;        // isometric tile size in pixels
const MAP = 40;                // map is MAP x MAP tiles
const CENTER = MAP / 2;
const SAFE_R = 2.5;            // radius of the safe area around the doghouse (tiles)
const MAX_ENEMIES = 30;
const LOCK_RANGE = 7;          // how far away auto lock-on reaches (tiles)

const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');   // swapped briefly to draw the title-screen logo
let W, H;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let VIEW = 1;   // < 1 zooms out on small (phone) screens
function resize() {
  VIEW = clamp(Math.min(innerWidth, innerHeight * 1.6) / 950, 0.62, 1);
  W = canvas.width = Math.round(innerWidth / VIEW); H = canvas.height = Math.round(innerHeight / VIEW);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
}
addEventListener('resize', resize);
resize();

const distC = (x, y) => Math.hypot(x - CENTER, y - CENTER);

// ---------- Game data (tweak these to balance the game) ----------
const WEAPONS = [
  { name: 'Puppy Teeth',   dmg: 10, cost: 0,    color: '#ffffff', type: 'bite',      desc: 'Just your own chompers' },
  { name: 'Fetch Stick',   dmg: 18, cost: 40,   color: '#8a5a2e', type: 'stick',     desc: 'A really good stick' },
  { name: 'Iron Bone',     dmg: 28, cost: 150,  color: '#c8ccd4', type: 'bone',      desc: 'Heavy, shiny, and great for bonking' },
  { name: 'Razor Frisbee', dmg: 44, cost: 450,  color: '#2ec4b6', type: 'frisbee',   desc: 'A frisbee with a serrated edge' },
  { name: 'Inferno Bone',  dmg: 68, cost: 1200, color: '#ff7a3a', type: 'flamebone', desc: 'A legendary bone that never stops burning' },
];

const SKILLS = [
  { id: 'strike',   key: '1', name: 'Chomp',     cost: 0,   cd: 0.75, sta: 20, lock: 0.35, desc: 'Chomp or swing your fetch gear toward the mouse (click) or at the locked-on enemy (1 / J).' },
  { id: 'whirl',    key: '2', name: 'Zoomies',   cost: 80,  cd: 4,    sta: 35, lock: 0.5,  desc: 'Tear around in a circle, hitting everyone nearby for 1.3x gear damage.' },
  { id: 'fireball', key: '3', name: 'Mega Bark', cost: 200, cd: 1.6,  sta: 25, lock: 0.4,  desc: 'A bark so loud it flies. Blasts an area for 35 damage (scales with Bark Power).' },
];
const CRIT_MULT = 2;   // damage bonus for hitting an enemy right after it attacks
const ROLL_STA = 22;
const RUN_MULT = 1.75, RUN_STA = 22;   // run speed multiplier, stamina per second while running

// Stats you raise when you level up.
const STATS = [
  { id: 'vig', name: 'Vigor',     desc: '+12 max HP' },
  { id: 'end', name: 'Endurance', desc: '+10 max stamina' },
  { id: 'str', name: 'Jaw Strength', desc: '+7% chomp and gear damage' },
  { id: 'arc', name: 'Bark Power',   desc: '+10% Mega Bark damage' },
];
const levelCost = lvl => Math.floor(30 * 1.16 ** (lvl - 1));

// Regular enemies: friendly plant folk turned mean by pollution.
// windup = seconds of warning before the hit, reach = size of the red danger circle,
// staggers = whether your hits interrupt their attack. s = drawing scale, look = how they're drawn.
const ENEMY_TYPES = [
  { name: 'Sproutling',       lvl: 1,  hp: 20,  dmg: 20, speed: 1.6, xp: 6,   r: 0.26, h: 30, s: 1,    look: 'sprout',    color: '#8fbf4f', minDist: 0,  windup: 0.55, reach: 0.45, recover: 0.7, staggers: true,  aggro: 5 },
  { name: 'Thornbush',        lvl: 3,  hp: 50,  dmg: 28, speed: 2.1, xp: 20,  r: 0.3,  h: 32, s: 1,    look: 'thorn',     color: '#3f6e2e', minDist: 8,  windup: 0.45, reach: 0.6,  recover: 0.55, staggers: true, aggro: 6 },
  { name: 'Toxic Toadstool',  lvl: 6,  hp: 100, dmg: 42, speed: 1.8, xp: 60,  r: 0.34, h: 46, s: 1.1,  look: 'toadstool', color: '#8e3b9e', minDist: 13, windup: 0.7,  reach: 0.85, recover: 0.8, staggers: false, aggro: 6.5 },
  { name: 'Smog Oak',         lvl: 10, hp: 220, dmg: 70, speed: 1.3, xp: 180, r: 0.45, h: 72, s: 1.1,  look: 'oak',       color: '#6b4a2e', minDist: 18, windup: 1.0,  reach: 1.1,  recover: 1.2, staggers: false, aggro: 7 },
];

// Bosses: townspeople tainted by the pollution, one per zone. Beaten bosses stay beaten.
// ox/oy = where they wait (tiles from the doghouse), combo = hits chained per attack.
const BOSSES = [
  { name: 'Tainted Paperboy',     lvl: 5,  hp: 160,  dmg: 26, speed: 2.6, xp: 150,  r: 0.32, h: 44, s: 1.1,  look: 'paperboy',   color: '#b14cff', ox: -5,  oy: -5,  combo: 2, windup: 0.5,  reach: 0.65, recover: 0.6, aggro: 6 },
  { name: 'Tainted Mail Carrier', lvl: 9,  hp: 380,  dmg: 36, speed: 2.4, xp: 400,  r: 0.38, h: 56, s: 1.35, look: 'mailman',    color: '#b14cff', ox: 8,   oy: -8,  combo: 2, windup: 0.55, reach: 0.8,  recover: 0.7, aggro: 6 },
  { name: 'Tainted Gardener',     lvl: 14, hp: 700,  dmg: 50, speed: 2.1, xp: 900,  r: 0.42, h: 64, s: 1.5,  look: 'gardener',   color: '#b14cff', ox: -11, oy: 11,  combo: 3, windup: 0.7,  reach: 1.0,  recover: 0.8, aggro: 6.5 },
  { name: 'Tainted Dog Catcher',  lvl: 20, hp: 1200, dmg: 75, speed: 1.9, xp: 2000, r: 0.5,  h: 76, s: 1.8,  look: 'dogcatcher', color: '#b14cff', ox: 15,  oy: 15,  combo: 3, windup: 0.9,  reach: 1.3,  recover: 1.0, aggro: 7 },
];

const ZONES = [
  { name: "Watson's Doghouse", maxD: SAFE_R },
  { name: 'The Park',          maxD: 8 },
  { name: 'The Suburbs',       maxD: 13 },
  { name: 'Downtown',          maxD: 18 },
  { name: 'The Pound District', maxD: Infinity },
];
const zoneAt = (x, y) => ZONES.find(z => distC(x, y) < z.maxD);

// ---------- State ----------
const player = {
  x: CENTER, y: CENTER + 1.6, r: 0.3, h: 42, speed: 3.4,
  level: 1, stats: { vig: 0, end: 0, str: 0, arc: 0 },
  hp: 80, sta: 80, staDelay: 0,
  xp: 0, weapon: 0, skills: new Set(['strike']),
  flasks: 3, maxFlasks: 3, drink: 0,
  face: { x: 1, y: 0 }, flash: 0, swing: 0, swingMax: 0.28, dead: false,
  aimT: 0, walk: 0, moving: false, running: false, whirl: 0,
  roll: null, hitstun: 0, grace: 0, attackLock: 0,
};
const maxHp = () => 80 + 12 * player.stats.vig;
const maxSta = () => 80 + 10 * player.stats.end;
const weaponDmg = () => Math.round(WEAPONS[player.weapon].dmg * (1 + 0.07 * player.stats.str));
const fireballDmg = () => Math.round(35 * (1 + 0.1 * player.stats.arc));

const cooldowns = { strike: 0, whirl: 0, fireball: 0 };
let enemies = [], projectiles = [], effects = [], floaters = [];
let target = null, bloodstain = null, won = false;
const defeated = new Set();   // names of bosses already beaten
const JACKIE = { x: CENTER + 1.4, y: CENTER - 0.2 };
const FRED = { x: CENTER - 1.9, y: CENTER + 0.7 };   // Fred the cat's shop, beside the doghouse
const nearFred = () => Math.hypot(player.x - FRED.x, player.y - FRED.y) < 1.7;
let shopMode = 'rest';
let spawnTimer = 0, kills = 0, time = 0;
const cam = { x: 0, y: 0 };
let paused = true;

// ---------- Coordinates ----------
// World is in tiles; screen is isometric pixels centred on the camera.
function toScreen(x, y) {
  return { x: (x - y) * TW / 2 - cam.x + W / 2, y: (x + y) * TH / 2 - cam.y + H / 2 };
}

function toWorld(sx, sy) {
  const rx = sx - W / 2 + cam.x, ry = sy - H / 2 + cam.y;
  return { x: (rx / (TW / 2) + ry / (TH / 2)) / 2, y: (ry / (TH / 2) - rx / (TW / 2)) / 2 };
}

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || k === 'tab' || k.startsWith('arrow')) e.preventDefault();
  if (overlay('title').classList.contains('open')) { if (!e.repeat) closeOverlays(); return; }
  if (k === 'b') { toggleShop('rest'); return; }
  if (k === 'e') { toggleShop('fred'); return; }
  if (k === 'escape') { if (paused) closeOverlays(); else openOverlay('title'); return; }
  if (k === 'r' && player.dead) { respawn(); return; }
  if (paused || e.repeat) return;
  if (k === '1' || k === 'j') useSkill('strike');
  if (k === '2') useSkill('whirl');
  if (k === '3') useSkill('fireball');
  if (k === 'q') drinkFlask();
  if (k === ' ') startRoll();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
const mouse = { x: 0, y: 0 };
const joy = { id: null, ox: 0, oy: 0, dx: 0, dy: 0, mag: 0 };   // on-screen joystick (phones)
const JOY_R = 60;
let isTouch = matchMedia('(pointer: coarse)').matches;
function enableTouch() {
  isTouch = true;
  document.body.classList.add('touch');
  document.querySelector('.press').textContent = 'tap to start';
}
if (isTouch) enableTouch();
canvas.addEventListener('pointermove', e => {
  mouse.x = e.clientX / VIEW; mouse.y = e.clientY / VIEW;
  if (e.pointerId === joy.id) {
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
    const m = Math.hypot(dx, dy);
    if (m > JOY_R) { joy.ox += dx * (1 - JOY_R / m); joy.oy += dy * (1 - JOY_R / m); dx *= JOY_R / m; dy *= JOY_R / m; }   // base follows your thumb
    joy.dx = dx / JOY_R; joy.dy = dy / JOY_R; joy.mag = Math.min(1, m / JOY_R);
  }
});
canvas.addEventListener('pointerdown', e => {
  mouse.x = e.clientX / VIEW; mouse.y = e.clientY / VIEW;
  if (e.pointerType === 'touch') {
    if (!isTouch) enableTouch();
    if (e.clientX < innerWidth * 0.5) {   // left half: joystick
      if (joy.id === null) Object.assign(joy, { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0, mag: 0 });
    } else if (!paused) useSkill('strike', mouseDir());   // tap the right side: chomp toward the tap
    return;
  }
  if (e.button === 0 && !paused) useSkill('strike', mouseDir());
});
const endJoy = e => { if (e.pointerId === joy.id) Object.assign(joy, { id: null, dx: 0, dy: 0, mag: 0 }); };
canvas.addEventListener('pointerup', endJoy);
canvas.addEventListener('pointercancel', endJoy);

// Phone buttons
const tb = id => document.getElementById(id);
function touchButton(id, fn) {
  tb(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (!paused || id === 'tPause') fn(); });
}
touchButton('tChomp', () => useSkill('strike'));
touchButton('tRoll', () => startRoll());
touchButton('tZoom', () => useSkill('whirl'));
touchButton('tBark', () => useSkill('fireball'));
touchButton('tTreat', () => drinkFlask());
touchButton('tRest', () => toggleShop('rest'));
touchButton('tFred', () => toggleShop('fred'));
touchButton('tPause', () => openOverlay('title'));
function updateTouchButtons() {
  if (!isTouch) return;
  const p = player, set = (id, off, cool, sub) => {
    const el = tb(id); el.classList.toggle('off', off); el.classList.toggle('cool', cool);
    if (sub !== undefined) el.querySelector('small').textContent = sub;
  };
  set('tChomp', false, cooldowns.strike > 0);
  set('tRoll', p.sta <= 0, false);
  set('tZoom', !p.skills.has('whirl'), cooldowns.whirl > 0, p.skills.has('whirl') ? '' : '80 XP');
  set('tBark', !p.skills.has('fireball'), cooldowns.fireball > 0, p.skills.has('fireball') ? '' : '200 XP');
  set('tTreat', p.flasks <= 0, p.drink > 0, `${p.flasks}/${p.maxFlasks}`);
  tb('tRest').classList.toggle('show', !paused && !p.dead && distC(p.x, p.y) < SAFE_R);
  tb('tFred').classList.toggle('show', !paused && !p.dead && nearFred());
}
// Direction from the player to the mouse cursor, in world space.
function mouseDir() {
  const m = toWorld(mouse.x, mouse.y), dx = m.x - player.x, dy = m.y - player.y, d = Math.hypot(dx, dy);
  return d > 0.01 ? { x: dx / d, y: dy / d } : player.face;
}
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---------- Overlays ----------
const overlay = id => document.getElementById(id);
function openOverlay(id) {
  if (player.dead && id !== 'death') return;
  ['title', 'shop', 'death', 'win'].forEach(o => overlay(o).classList.toggle('open', o === id));
  paused = true;
  if (id === 'title') titleOpenedAt = performance.now();
  if (id === 'shop') {
    renderShop();
    if (shopMode === 'rest') { tut.shop++; floatText(JACKIE.x, JACKIE.y, 'Good boy, Watson!', '#ffffff', 1.6); }
    else { tut.fred++; floatText(FRED.x, FRED.y, FRED_LINES[Math.floor(Math.random() * FRED_LINES.length)], '#ffd7a8', 1.8); }
  }
}
function closeOverlays() {
  if (player.dead) return;
  ['title', 'shop', 'win'].forEach(o => overlay(o).classList.remove('open'));
  paused = false;
  for (const k in keys) keys[k] = false;
}
// mode 'rest': level up at the doghouse. mode 'fred': buy gear, tricks and treats from Fred.
function toggleShop(mode) {
  if (overlay('shop').classList.contains('open')) { closeOverlays(); return; }
  if (paused) return;
  if (mode === 'rest' && distC(player.x, player.y) >= SAFE_R) { floatText(player.x, player.y, 'Head back to the doghouse to rest', '#c4b8b6', 1.4); return; }
  if (mode === 'fred' && !nearFred()) { floatText(player.x, player.y, 'Fred the cat trades by the doghouse', '#c4b8b6', 1.4); return; }
  shopMode = mode;
  openOverlay('shop');
}
const FRED_LINES = ['Meow. Let\'s trade.', 'Fresh sticks! Barely chewed.', 'Mrrp. XP only, no IOUs.', 'Bones? I\'ve got bones.', 'Purr... what\'ll it be, pup?'];
let titleOpenedAt = 0;
// Ignore the tap that opened the pause screen so it doesn't immediately close it again.
overlay('title').onclick = () => { if (performance.now() - titleOpenedAt > 350) closeOverlays(); };
overlay('closeShop').onclick = closeOverlays;
overlay('respawn').onclick = respawn;
overlay('keepPlaying').onclick = closeOverlays;

const flaskCost = () => 120 * 2 ** (player.maxFlasks - 3);

function renderShop() {
  const p = player;
  overlay('shopXp').textContent = `${p.xp} XP`;
  const body = overlay('shopBody');
  body.innerHTML = '';
  const section = t => { const h = document.createElement('h2'); h.textContent = t; body.appendChild(h); };
  const row = (name, desc, label, enabled, onBuy, val) => {
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `<div class="info"><div class="name">${name}</div><div class="desc">${desc}</div></div>` +
      (val !== undefined ? `<div class="val">${val}</div>` : '');
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.disabled = !enabled;
    btn.onclick = () => { onBuy(); renderShop(); };
    div.appendChild(btn);
    return div;
  };

  const fred = shopMode === 'fred';
  overlay('shopTitle').textContent = fred ? "Fred's Wares" : "Watson's Doghouse";
  overlay('shopSub').textContent = fred
    ? 'An orange cat on a crate full of treasures. Fred takes XP, and only XP.'
    : 'Rest up and spend XP to grow stronger. Jackie gives you a scratch behind the ears.';
  if (fred) { renderFredWares(section, row); return; }

  const cost = levelCost(p.level);
  section(`Level up: Level ${p.level} → ${p.level + 1} costs ${cost} XP`);
  STATS.forEach(s => {
    body.appendChild(row(s.name, s.desc, `+1 (${cost} XP)`, p.xp >= cost, () => {
      p.xp -= cost; p.level++; p.stats[s.id]++;
      if (s.id === 'vig') p.hp += 12;
      if (s.id === 'end') p.sta += 10;
    }, p.stats[s.id]));
  });
}

function renderFredWares(section, row) {
  const p = player, body = overlay('shopBody');
  section('Fetch gear (held in your mouth)');
  WEAPONS.forEach((w, i) => {
    if (i === 0) return;
    const owned = p.weapon >= i;
    body.appendChild(row(w.name, `${w.desc}. ${w.dmg} base damage per hit`,
      owned ? (p.weapon === i ? 'Equipped' : 'Outclassed') : `${w.cost} XP`,
      !owned && p.xp >= w.cost,
      () => { p.xp -= w.cost; p.weapon = i; }));
  });

  section('Tricks');
  SKILLS.forEach(s => {
    if (s.cost === 0) return;
    const owned = p.skills.has(s.id);
    body.appendChild(row(`${s.name} <kbd>${s.key}</kbd>`, `${s.desc} (${s.sta} stamina, ${s.cd}s cooldown)`,
      owned ? 'Learned' : `${s.cost} XP`,
      !owned && p.xp >= s.cost,
      () => { p.xp -= s.cost; p.skills.add(s.id); }));
  });

  section('Treats');
  const fc = flaskCost();
  const maxed = p.maxFlasks >= 8;
  body.appendChild(row('Golden Biscuit', `Carry one more healing biscuit (you have ${p.maxFlasks})`,
    maxed ? 'Max' : `${fc} XP`, !maxed && p.xp >= fc,
    () => { p.xp -= fc; p.maxFlasks++; p.flasks = p.maxFlasks; }));
}

// ---------- Spawning ----------
function pickType(d) {
  const allowed = ENEMY_TYPES.filter(t => d >= t.minDist);
  // Mostly the toughest type for the zone, sometimes an easier one.
  return Math.random() < 0.7 ? allowed[allowed.length - 1] : allowed[Math.floor(Math.random() * allowed.length)];
}
function spawnEnemy() {
  for (let tries = 0; tries < 30; tries++) {
    const x = rand(1, MAP - 1), y = rand(1, MAP - 1);
    const d = distC(x, y);
    if (d < SAFE_R + 2.5) continue;
    if (Math.hypot(x - player.x, y - player.y) < 9) continue;
    enemies.push(makeEnemy(pickType(d), x, y));
    return;
  }
}
function makeEnemy(t, x, y) {
  return { ...t, x, y, homeX: x, homeY: y, maxHp: t.hp,
    state: 'idle', t: 0, tMax: 1, comboLeft: (t.combo || 1) - 1, tx: x, ty: y, wanderT: rand(0, 3), atkCd: 0, flash: 0, kx: 0, ky: 0,
    walk: rand(0, 6), moving: false, fx: 1, fy: 0, seed: rand(0, 6) };
}
const plantCount = () => enemies.filter(e => !e.boss).length;
function populate() {
  enemies = [];
  for (const b of BOSSES) if (!defeated.has(b.name)) enemies.push(makeEnemy({ ...b, boss: true, staggers: false }, CENTER + b.ox, CENTER + b.oy));
  for (let i = 0; i < MAX_ENEMIES; i++) spawnEnemy();
}
populate();

// ---------- Player actions ----------
const canAct = () => !player.dead && !player.roll && player.hitstun <= 0 && player.drink <= 0 && player.attackLock <= 0;

function spendSta(n) {
  if (player.sta <= 0) return false;   // like Souls: any stamina left lets you act
  player.sta = Math.max(0, player.sta - n);
  player.staDelay = 0.6;
  return true;
}

function moveDir() {
  let ix = 0, iy = 0;
  if (keys.a || keys.arrowleft) ix--;
  if (keys.d || keys.arrowright) ix++;
  if (keys.w || keys.arrowup) iy--;
  if (keys.s || keys.arrowdown) iy++;
  if (!ix && !iy && joy.mag > 0.2) { ix = joy.dx; iy = joy.dy; }
  if (!ix && !iy) return null;
  // Keys are screen directions; convert to world directions.
  const wx = ix / TW + iy / TH, wy = iy / TH - ix / TW, l = Math.hypot(wx, wy);
  return { x: wx / l, y: wy / l };
}

function startRoll() {
  if (!canAct() || !spendSta(ROLL_STA)) return;
  const d = moveDir() || player.face;
  player.roll = { t: 0.4, x: d.x, y: d.y };
  tut.rolls++;
}
const invulnerable = () => (player.roll && player.roll.t > 0.08 && player.roll.t < 0.36) || player.grace > 0;

function drinkFlask() {
  if (!canAct() || player.flasks <= 0) return;
  player.flasks--;
  player.drink = 0.8;   // you're stuck eating for a moment, so pick your timing
  tut.ate++;
}

// aim: a world direction (mouse attacks), or omitted to aim at the locked-on enemy.
function useSkill(id, aim) {
  if (!canAct() || !player.skills.has(id) || cooldowns[id] > 0) return;
  const s = SKILLS.find(s => s.id === id);
  if (!spendSta(s.sta)) return;
  const p = player;
  if (aim) { p.face = aim; p.aimT = 0.5; } else { p.aimT = 0; faceTarget(); }
  cooldowns[id] = s.cd;
  tut[id]++;
  p.attackLock = s.lock;   // you're committed until the swing finishes
  if (id === 'strike') {
    const range = 1.3, ang = Math.atan2(p.face.y, p.face.x);
    p.swing = p.swingMax;
    effects.push({ type: 'arc', x: p.x, y: p.y, ang, range, t: 0.15, max: 0.15, color: WEAPONS[p.weapon].color });
    for (const e of enemies) {
      const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
      if (d > range + e.r) continue;
      let diff = Math.abs(Math.atan2(dy, dx) - ang);
      if (diff > Math.PI) diff = 2 * Math.PI - diff;
      if (diff < Math.PI / 3 || d < 0.4) hurtEnemy(e, weaponDmg());
    }
  } else if (id === 'whirl') {
    const range = 1.9;
    p.whirl = 0.4;
    effects.push({ type: 'ring', x: p.x, y: p.y, range, t: 0.3, max: 0.3, color: '#9fd4ff' });
    for (const e of enemies)
      if (Math.hypot(e.x - p.x, e.y - p.y) < range + e.r) hurtEnemy(e, Math.round(weaponDmg() * 1.3));
  } else if (id === 'fireball') {
    projectiles.push({ x: p.x + p.face.x * 0.4, y: p.y + p.face.y * 0.4, vx: p.face.x * 8, vy: p.face.y * 8, life: 1.3 });
  }
}

// ---------- Combat ----------
function explode(x, y) {
  const range = 1.2;
  effects.push({ type: 'ring', x, y, range, t: 0.35, max: 0.35, color: '#9fd4ff', fill: true });
  floatText(x, y, 'WOOF!', '#cfe8ff', 0.7);
  for (const e of enemies) if (Math.hypot(e.x - x, e.y - y) < range + e.r) hurtEnemy(e, fireballDmg(), x, y);
}

function hurtEnemy(e, dmg, fromX = player.x, fromY = player.y) {
  if (e.hp <= 0) return;
  const crit = e.state === 'recover' && e.punishable;
  if (crit) { dmg = Math.round(dmg * CRIT_MULT); tut.crits++; }
  e.hp -= dmg;
  e.flash = 0.12;
  if (e.state === 'windup' && e.staggers) { e.state = 'recover'; e.t = 0.45; e.punishable = false; e.comboLeft = (e.combo || 1) - 1; }
  else if (e.state === 'idle' || e.state === 'return') e.state = 'chase';
  const dx = e.x - fromX, dy = e.y - fromY, d = Math.hypot(dx, dy) || 1;
  const kb = e.staggers ? 2.5 : 0.6;
  e.kx += dx / d * kb; e.ky += dy / d * kb;
  floatText(e.x, e.y, crit ? `${dmg} CRITICAL` : dmg, crit ? '#ffd25a' : '#fff', crit ? 1.1 : 0.8);
  if (e.hp <= 0) {
    player.xp += e.xp;
    kills++;
    floatText(e.x, e.y, `+${e.xp} XP`, '#f2c94c', 1.2);
    effects.push({ type: 'ring', x: e.x, y: e.y, range: e.r * 2, t: 0.3, max: 0.3, color: e.color, fill: true });
    if (e.boss) {
      defeated.add(e.name);
      floatText(e.x, e.y - 0.5, 'POLLUTION CLEARED', '#e3b8ff', 2.5);
      effects.push({ type: 'ring', x: e.x, y: e.y, range: 3, t: 1, max: 1, color: '#e3b8ff', fill: true });
      if (defeated.size === BOSSES.length && !won) { won = true; setTimeout(() => openOverlay('win'), 1200); }
    }
  }
}

function hurtPlayer(dmg, fromX, fromY) {
  const p = player;
  if (invulnerable()) { floatText(p.x, p.y, 'dodged', '#9fd4ff', 0.6); return; }
  p.hp -= dmg;
  p.flash = 0.15;
  p.hitstun = 0.3;
  p.grace = 0.35;
  p.drink = 0;   // getting hit interrupts eating (the biscuit is wasted)
  const dx = p.x - fromX, dy = p.y - fromY, d = Math.hypot(dx, dy) || 1;
  p.x = clamp(p.x + dx / d * 0.35, 0.3, MAP - 0.3);
  p.y = clamp(p.y + dy / d * 0.35, 0.3, MAP - 0.3);
  floatText(p.x, p.y, `-${dmg}`, '#ff6b6b');
  if (p.hp <= 0) die();
}

function die() {
  const p = player;
  p.hp = 0;
  p.dead = true;
  const lostOld = bloodstain ? bloodstain.xp : 0;
  bloodstain = p.xp > 0 ? { x: p.x, y: p.y, xp: p.xp } : null;
  p.xp = 0;
  let msg = bloodstain
    ? `Your ${bloodstain.xp} XP lies where you fell, marked by a glowing bone. Reach it before you're knocked out again.`
    : 'You had no XP to lose.';
  if (lostOld) msg += ` The ${lostOld} XP you dropped last time is lost forever.`;
  overlay('deathMsg').textContent = msg;
  openOverlay('death');
}

function respawn() {
  if (!player.dead) return;
  Object.assign(player, { dead: false, x: CENTER, y: CENTER + 1.6, hp: maxHp(), sta: maxSta(),
    flasks: player.maxFlasks, roll: null, hitstun: 0, drink: 0, grace: 0, attackLock: 0, aimT: 0, swing: 0, whirl: 0 });
  populate();   // every monster comes back when you die
  projectiles = []; effects = []; floaters = []; target = null;
  overlay('death').classList.remove('open');
  paused = false;
  floatText(JACKIE.x, JACKIE.y, 'Watson! Are you okay?', '#ffffff', 2);
}

function floatText(x, y, text, color, life = 0.8) {
  floaters.push({ x, y, z: 30, text: String(text), color, t: life, max: life, dx: rand(-6, 6) });
}

// Lock on to the nearest enemy, but don't flicker between two that are about equally close.
function updateTarget() {
  const p = player;
  let best = null, bestD = LOCK_RANGE;
  for (const e of enemies) {
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d < bestD) { best = e; bestD = d; }
  }
  if (target && target.hp > 0 && enemies.includes(target)) {
    const cur = Math.hypot(target.x - p.x, target.y - p.y);
    if (cur < LOCK_RANGE + 1 && (!best || cur < bestD + 0.6)) return;
  }
  target = best;
}

function faceTarget() {
  const p = player;
  updateTarget();
  if (target) {
    const dx = target.x - p.x, dy = target.y - p.y, d = Math.hypot(dx, dy) || 1;
    p.face = { x: dx / d, y: dy / d };
  }
}

// ---------- Update ----------
function update(dt) {
  const p = player;

  // Face the locked-on enemy, unless you just attacked toward the mouse.
  const md = moveDir();
  p.aimT = Math.max(0, p.aimT - dt);
  if (p.aimT > 0) updateTarget(); else faceTarget();
  if (!target && md && !p.roll && p.aimT <= 0) p.face = md;

  // Movement
  const ox = p.x, oy = p.y;
  p.running = false;
  if (p.roll) {
    p.roll.t -= dt;
    p.x += p.roll.x * 7 * dt; p.y += p.roll.y * 7 * dt;
    if (p.roll.t <= 0) p.roll = null;
  } else if (md && p.hitstun <= 0) {
    let spd = p.speed * (p.drink > 0 ? 0.35 : p.attackLock > 0 ? 0.3 : 1);
    if ((keys.shift || joy.mag > 0.92) && p.sta > 0 && p.drink <= 0 && p.attackLock <= 0) {   // phones: push the stick all the way
      p.running = true;
      tut.ran += dt;
      spd *= RUN_MULT;
      p.sta = Math.max(0, p.sta - RUN_STA * dt);
      p.staDelay = 0.5;
      if (!target && p.aimT <= 0) p.face = md;
    }
    p.x += md.x * spd * dt; p.y += md.y * spd * dt;
  }
  p.x = clamp(p.x, 0.3, MAP - 0.3); p.y = clamp(p.y, 0.3, MAP - 0.3);
  const moved = Math.hypot(p.x - ox, p.y - oy);
  tut.moved += moved;
  tut.playT += dt;
  p.moving = moved > 0.0005 && !p.roll;
  p.walk += moved * 9;
  p.whirl = Math.max(0, p.whirl - dt);

  for (const k in cooldowns) cooldowns[k] = Math.max(0, cooldowns[k] - dt);
  p.flash = Math.max(0, p.flash - dt);
  p.swing = Math.max(0, p.swing - dt);
  p.hitstun = Math.max(0, p.hitstun - dt);
  p.attackLock = Math.max(0, p.attackLock - dt);
  p.grace = Math.max(0, p.grace - dt);
  if (p.drink > 0) {
    p.drink -= dt;
    if (p.drink <= 0) {
      const amt = Math.round(maxHp() * 0.5);
      p.hp = Math.min(maxHp(), p.hp + amt);
      floatText(p.x, p.y, `+${amt}`, '#7dff9a');
      effects.push({ type: 'ring', x: p.x, y: p.y, range: 0.8, t: 0.4, max: 0.4, color: '#f2c94c' });
    }
  }

  // Stamina regenerates after a short pause.
  p.staDelay -= dt;
  if (p.staDelay <= 0 && !p.roll) p.sta = Math.min(maxSta(), p.sta + 40 * dt);

  // The doghouse heals you and refills your biscuits. No other natural healing.
  const atHome = distC(p.x, p.y) < SAFE_R;
  if (atHome) { p.hp = Math.min(maxHp(), p.hp + maxHp() * 0.25 * dt); p.flasks = p.maxFlasks; }

  // Recover your lost XP.
  if (bloodstain && Math.hypot(bloodstain.x - p.x, bloodstain.y - p.y) < 0.6) {
    p.xp += bloodstain.xp;
    floatText(p.x, p.y, `Recovered ${bloodstain.xp} XP`, '#f2c94c', 1.6);
    bloodstain = null;
  }

  // Enemies
  for (const e of enemies) {
    e.flash = Math.max(0, e.flash - dt);
    e.atkCd = Math.max(0, e.atkCd - dt);
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 0.001;
    const playerSafe = distC(p.x, p.y) < SAFE_R + 0.3;
    const strikeDist = e.r + p.r + e.reach;

    if ((e.state === 'idle' || e.state === 'return') && !playerSafe && d < e.aggro) e.state = 'chase';
    if (e.state === 'chase' && (playerSafe || d > e.aggro * 1.8)) e.state = 'return';
    // Bosses won't leave their own patch of town.
    if (e.boss && e.state === 'chase' && Math.hypot(e.x - e.homeX, e.y - e.homeY) > 9) e.state = 'return';

    let mx = 0, my = 0, spd = e.speed;
    if (e.state === 'chase') {
      if (d < strikeDist * 0.85 && e.atkCd <= 0) { e.state = 'windup'; e.t = e.tMax = e.windup; }
      else if (d > e.r + p.r + 0.1) { mx = dx / d; my = dy / d; }
    } else if (e.state === 'windup') {
      e.t -= dt;
      if (e.t <= 0) {
        effects.push({ type: 'ring', x: e.x, y: e.y, range: e.r + e.reach, t: 0.25, max: 0.25, color: '#ff4040', fill: true });
        if (d < strikeDist) hurtPlayer(e.dmg, e.x, e.y);
        if (e.comboLeft > 0) {
          // Chain straight into another, faster attack. No opening between combo hits.
          e.comboLeft--;
          e.state = 'windup'; e.t = e.tMax = e.windup * 0.65;
        } else {
          e.comboLeft = (e.combo || 1) - 1;
          e.state = 'recover'; e.t = e.recover; e.punishable = true;
        }
      }
    } else if (e.state === 'recover') {
      e.t -= dt;
      if (e.t <= 0) { e.state = 'chase'; e.atkCd = rand(0.2, 0.9); }
    } else if (e.state === 'return') {
      const hx = e.homeX - e.x, hy = e.homeY - e.y, hd = Math.hypot(hx, hy);
      if (hd < 0.3) { e.state = 'idle'; e.hp = e.maxHp; } else { mx = hx / hd; my = hy / hd; }
    } else {
      e.wanderT -= dt;
      if (e.wanderT <= 0) { e.tx = e.homeX + rand(-2, 2); e.ty = e.homeY + rand(-2, 2); e.wanderT = rand(2, 5); }
      const tx = e.tx - e.x, ty = e.ty - e.y, td = Math.hypot(tx, ty);
      if (td > 0.1) { mx = tx / td; my = ty / td; spd *= 0.4; }
    }
    e.x += (mx * spd + e.kx) * dt;
    e.y += (my * spd + e.ky) * dt;
    e.kx *= 0.85; e.ky *= 0.85;
    // Animation: walk cycle and which way they're facing.
    e.moving = mx || my;
    e.walk += Math.hypot(mx, my) * spd * dt * 9;
    if (e.state === 'chase' || e.state === 'windup' || e.state === 'recover') { e.fx = dx / d; e.fy = dy / d; }
    else if (e.moving) { e.fx = mx; e.fy = my; }

    // Keep enemies on the map and away from the doghouse.
    e.x = clamp(e.x, 0.3, MAP - 0.3); e.y = clamp(e.y, 0.3, MAP - 0.3);
    const cd = distC(e.x, e.y), minD = SAFE_R + e.r;
    if (cd < minD) { e.x = CENTER + (e.x - CENTER) / cd * minD; e.y = CENTER + (e.y - CENTER) / cd * minD; }
    if (p.dead) break;
  }
  // Push overlapping enemies apart.
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (d > 0 && d < min) {
      const push = (min - d) / 2;
      a.x -= dx / d * push; a.y -= dy / d * push;
      b.x += dx / d * push; b.y += dy / d * push;
    }
  }

  // Projectiles
  for (const pr of projectiles) {
    pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.life -= dt;
    const hit = enemies.some(e => e.hp > 0 && Math.hypot(e.x - pr.x, e.y - pr.y) < e.r + 0.15);
    if (hit || pr.life <= 0 || pr.x < 0 || pr.y < 0 || pr.x > MAP || pr.y > MAP) { explode(pr.x, pr.y); pr.life = -1; }
  }
  projectiles = projectiles.filter(pr => pr.life > 0);
  enemies = enemies.filter(e => e.hp > 0);
  if (target && target.hp <= 0) target = null;

  // Slowly bring monsters back over time.
  spawnTimer -= dt;
  if (spawnTimer <= 0 && plantCount() < MAX_ENEMIES) { spawnEnemy(); spawnTimer = 8; }

  for (const f of effects) f.t -= dt;
  effects = effects.filter(f => f.t > 0);
  for (const f of floaters) { f.t -= dt; f.z += 40 * dt; }
  floaters = floaters.filter(f => f.t > 0);
}

// ---------- Drawing ----------
function tileColor(i, j) {
  const d = distC(i + 0.5, j + 0.5);
  const n = ((i * 73856093) ^ (j * 19349663)) & 7;   // cheap per-tile variation
  const shade = (n - 3.5) * 2 - ((i + j) % 2) * 4;
  let r, g, b;
  if (d < SAFE_R)  [r, g, b] = [128, 104, 72];    // Watson's yard
  else if (d < 8)  [r, g, b] = [56, 112, 52];     // the park
  else if (d < 13) [r, g, b] = [96, 128, 70];     // suburban lawns
  else if (d < 18) [r, g, b] = [116, 116, 122];   // downtown pavement
  else             [r, g, b] = [70, 62, 66];      // the pound district
  // Pollution: tiles get a sickly purple tint the farther you are from home.
  const smog = clamp((d - 5) / 22, 0, 0.4);
  r = lerp(r, 92, smog); g = lerp(g, 64, smog); b = lerp(b, 110, smog);
  return `rgb(${Math.round(r + shade)},${Math.round(g + shade)},${Math.round(b + shade)})`;
}

function drawTiles() {
  for (let i = 0; i < MAP; i++) for (let j = 0; j < MAP; j++) {
    const a = toScreen(i, j);
    if (a.x < -TW || a.x > W + TW || a.y < -TH * 2 || a.y > H + TH) continue;
    const b = toScreen(i + 1, j), c = toScreen(i + 1, j + 1), d = toScreen(i, j + 1);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
    ctx.closePath();
    ctx.fillStyle = tileColor(i, j);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.14)';
    ctx.stroke();
  }
}

function groundEllipse(x, y, r) {
  const s = toScreen(x, y);
  ctx.beginPath();
  ctx.ellipse(s.x, s.y, r * TW * 0.707, r * TH * 0.707, 0, 0, Math.PI * 2);
}

function shadow(x, y, r) {
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  groundEllipse(x, y, r);
  ctx.fill();
}

function drawTelegraph(e) {
  // Red danger circle that fills up as the attack is about to land.
  const prog = 1 - e.t / e.tMax;
  const R = e.r + e.reach;
  ctx.strokeStyle = 'rgba(255,60,60,.8)';
  ctx.lineWidth = 2;
  groundEllipse(e.x, e.y, R); ctx.stroke();
  ctx.fillStyle = `rgba(255,40,40,${0.15 + prog * 0.3})`;
  groundEllipse(e.x, e.y, R * prog); ctx.fill();
  ctx.lineWidth = 1;
}

// ---------- Character art ----------
// Characters are drawn from simple shapes in a local space: origin between the feet,
// facing right, about 40 units tall at scale 1. They're mirrored when facing left.
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
function mix(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const lighten = (c, t) => mix(c, '#ffffff', t), darken = (c, t) => mix(c, '#000000', t);

// While drawing a character, P() turns its colours white (hit flash) or red (winding up).
let paintMode = null;
const P = c => paintMode === 'flash' ? '#ffffff' : paintMode === 'tint' ? mix(c, '#ff3a2a', 0.55) : c;
function fill(c) { ctx.fillStyle = P(c); ctx.fill(); }
const lerp = (a, b, t) => a + (b - a) * t;

// Which way a world-space facing vector points on screen.
function screenFacing(fx, fy) { return { flip: fx - fy < 0, back: fx + fy < -0.35 }; }

// ----- Watson -----
// Things Watson carries in his mouth. Drawn with the mouth at the origin, pointing forward (+x).
function drawBone(x0, x1, c) {
  ctx.beginPath(); ctx.roundRect(x0, -1.6, x1 - x0, 3.2, 1.2); fill(c);
  for (const x of [x0, x1]) for (const y of [-1.8, 1.8]) { ctx.beginPath(); ctx.arc(x, y, 2.3, 0, Math.PI * 2); fill(c); }
}
function drawDogItem(type, color, biting) {
  if (type === 'bite') {
    if (!biting) return;
    ctx.beginPath();   // a big flash of teeth
    for (let i = 0; i < 4; i++) { ctx.moveTo(-2 + i * 2.5, -2); ctx.lineTo(-0.8 + i * 2.5, 1.5); ctx.lineTo(0.4 + i * 2.5, -2); }
    fill('#ffffff');
  } else if (type === 'stick') {
    ctx.beginPath(); ctx.roundRect(-11, -1.4, 26, 2.8, 1.4); fill(color);
    ctx.save(); ctx.translate(8, -1); ctx.rotate(-0.7); ctx.beginPath(); ctx.roundRect(0, -0.8, 6, 1.6, 0.8); fill(color); ctx.restore();
  } else if (type === 'bone') {
    drawBone(-9, 13, color);
  } else if (type === 'frisbee') {
    ctx.beginPath(); ctx.ellipse(8, 0, 9, 3.2, 0, 0, Math.PI * 2); fill(color);
    ctx.beginPath(); ctx.ellipse(8, -0.6, 6, 1.8, 0, 0, Math.PI * 2); fill(lighten(color, 0.35));
    for (const x of [-1, 3, 8, 13, 17]) { ctx.beginPath(); ctx.moveTo(x - 1.3, 2.4); ctx.lineTo(x, 5); ctx.lineTo(x + 1.3, 2.4); fill('#d9dde2'); }
  } else if (type === 'flamebone') {
    ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = 12;
    drawBone(-9, 13, color);
    ctx.shadowBlur = 0;
    for (let i = 0; i < 4; i++) {
      const x = -8 + i * 6.5, f = Math.sin(time * 14 + i * 2) * 1.5;
      ctx.beginPath(); ctx.moveTo(x - 2, -2); ctx.quadraticCurveTo(x, -9 + f, x + 2, -2); fill('#ffd25a');
    }
  }
}

// o: { flip, walk, moving, running, attack (0..1 while attacking, else -1), item, color, eating }
const DOG_SCALE = 1.3;
function drawDog(sx, sy, o) {
  const fur = '#8b5a2b', light = '#c99a62', dark = '#5e3b1c';
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(o.flip ? -DOG_SCALE : DOG_SCALE, DOG_SCALE);
  const sw = o.moving ? Math.sin(o.walk) * (o.running ? 0.9 : 0.6) : 0;
  const bob = o.moving ? Math.abs(Math.cos(o.walk)) * (o.running ? 2.2 : 1.3) : Math.sin(time * 2.5) * 0.4;
  const by = -15 - bob;
  const leg = (x, a, c) => {
    ctx.save(); ctx.translate(x, by + 3); ctx.rotate(a);
    ctx.beginPath(); ctx.roundRect(-1.9, -1, 3.8, 13 + bob, 1.9); fill(c);
    ctx.beginPath(); ctx.ellipse(0.8, 12 + bob, 2.6, 1.6, 0, 0, Math.PI * 2); fill(darken(c, 0.15));
    ctx.restore();
  };

  // Tail wags faster when moving.
  const wag = Math.sin(time * (o.moving ? 16 : 9)) * 0.45;
  ctx.save(); ctx.translate(-11.5, by - 3); ctx.rotate(-0.9 + wag);
  ctx.beginPath(); ctx.roundRect(-1.7, -11, 3.4, 12, 1.7); fill(fur);
  ctx.beginPath(); ctx.arc(0, -10.5, 1.8, 0, Math.PI * 2); fill(light);
  ctx.restore();

  leg(-8, sw, dark); leg(9, -sw, dark);                     // far legs
  ctx.beginPath(); ctx.ellipse(0, by, 13.5, 7, 0, 0, Math.PI * 2); fill(fur);
  ctx.beginPath(); ctx.ellipse(1, by + 3.2, 9.5, 3.4, 0, 0, Math.PI * 2); fill(light);
  ctx.beginPath(); ctx.ellipse(-3, by - 3, 5, 2.5, 0.2, 0, Math.PI * 2); fill(darken(fur, 0.12));   // saddle patch
  leg(-5.5, -sw, fur); leg(11, sw, fur);                    // near legs

  // Head lunges and tosses during an attack.
  let tilt = 0, lunge = 0;
  if (o.attack >= 0) {
    const t = o.attack;
    tilt = t < 0.3 ? lerp(0, -0.55, t / 0.3) : lerp(-0.55, 0.4, Math.min(1, (t - 0.3) / 0.5));
    lunge = Math.sin(t * Math.PI) * 5;
  }
  if (o.eating) tilt = 0.25 + Math.sin(time * 18) * 0.12;
  ctx.save();
  ctx.translate(10 + lunge, by - 5);
  ctx.rotate(tilt);
  ctx.beginPath(); ctx.ellipse(0, 0, 5, 6, 0.3, 0, Math.PI * 2); fill(fur);                   // neck
  ctx.beginPath(); ctx.roundRect(-3.5, 1, 7, 2.6, 1.2); fill('#c0392b');                       // collar
  ctx.beginPath(); ctx.arc(1.5, 4.6, 1.4, 0, Math.PI * 2); fill('#f2c94c');                    // tag
  ctx.beginPath(); ctx.arc(3, -5.5, 6.2, 0, Math.PI * 2); fill(fur);                           // head
  ctx.beginPath(); ctx.ellipse(8.8, -3.2, 5.2, 3.3, 0.1, 0, Math.PI * 2); fill(light);       // snout
  ctx.beginPath(); ctx.ellipse(13.4, -4.3, 1.9, 1.5, 0, 0, Math.PI * 2); fill('#1a1210');     // nose
  ctx.beginPath(); ctx.arc(4.8, -7.4, 1.3, 0, Math.PI * 2); fill('#1a1210');                  // eye
  ctx.beginPath(); ctx.arc(5.2, -7.9, 0.45, 0, Math.PI * 2); fill('#ffffff');
  ctx.beginPath(); ctx.ellipse(3.6, -9.3, 2, 0.7, -0.2, 0, Math.PI * 2); fill(dark);         // eyebrow
  const flop = Math.sin(time * 6 + o.walk) * (o.moving ? 0.25 : 0.08);
  ctx.save(); ctx.translate(0.5, -9.5); ctx.rotate(0.35 + flop);                               // floppy ear
  ctx.beginPath(); ctx.moveTo(-1.5, 0); ctx.quadraticCurveTo(-5, 4, -3.5, 10); ctx.quadraticCurveTo(0, 9, 2.2, 1); ctx.closePath(); fill(dark);
  ctx.restore();
  ctx.save(); ctx.translate(10, -1);
  if (o.eating) {
    ctx.beginPath(); ctx.roundRect(-1, -2, 6, 4, 1.2); fill('#e8b04a');
  } else {
    let ia = 0;
    if (o.attack >= 0) ia = o.attack < 0.3 ? -0.5 : lerp(-0.5, 0.45, Math.min(1, (o.attack - 0.3) / 0.5));
    ctx.rotate(ia);
    drawDogItem(o.item, o.color, o.attack >= 0);
  }
  ctx.restore();
  ctx.restore();
  ctx.restore();
}

// ----- Townspeople -----
function drawPersonItem(type) {
  if (type === 'newspaper') {
    ctx.beginPath(); ctx.roundRect(-2.2, -2, 4.4, 15, 2); fill('#e8e4d8');
    ctx.beginPath(); ctx.rect(-2.2, 4, 4.4, 1); fill('#9a968a');
    ctx.beginPath(); ctx.rect(-2.2, 8, 4.4, 1); fill('#9a968a');
  } else if (type === 'parcel') {
    ctx.beginPath(); ctx.rect(-5, 0, 10, 8); fill('#b07a45');
    ctx.beginPath(); ctx.rect(-0.8, 0, 1.6, 8); fill('#e0c890');
  } else if (type === 'rake') {
    ctx.beginPath(); ctx.roundRect(-1, -4, 2, 30, 1); fill('#8a6a3a');
    ctx.beginPath(); ctx.rect(-6, 25, 12, 2); fill('#8a8f96');
    for (let x = -5.5; x <= 5.5; x += 2.75) { ctx.beginPath(); ctx.rect(x - 0.4, 27, 0.8, 4); fill('#8a8f96'); }
  } else if (type === 'net') {
    ctx.beginPath(); ctx.roundRect(-1, -4, 2, 30, 1); fill('#5a5e66');
    ctx.beginPath(); ctx.ellipse(0, 32, 7, 6, 0, 0, Math.PI * 2);
    ctx.globalAlpha *= 0.35; fill('#d0d0d0'); ctx.globalAlpha /= 0.35;
    ctx.strokeStyle = P('#3a3e46'); ctx.lineWidth = 1.5; ctx.stroke(); ctx.lineWidth = 1;
  }
}

// o: { s, flip, back, walk, moving, armA (item-arm angle), look, seed }
function drawPerson(sx, sy, o) {
  const L = LOOKS[o.look];
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(o.flip ? -o.s : o.s, o.s);
  const sw = o.moving ? Math.sin(o.walk) : 0;
  const bob = o.moving ? Math.abs(Math.cos(o.walk)) * 1.3 : Math.sin(time * 2.2 + (o.seed || 0)) * 0.5;
  const tw = 7 * L.wide, hipY = -14, shY = -26 - bob * 0.5;
  const limb = (x, y, a, len, w, c, end) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.beginPath(); ctx.roundRect(-w, -w, w * 2, len + w, w); fill(c);
    if (end) { ctx.translate(0, len); end(); }
    ctx.restore();
  };
  const shoe = () => { ctx.beginPath(); ctx.ellipse(1.2, 0.5, 3.2 * L.wide, 1.8, 0, 0, Math.PI * 2); fill(L.shoes); };
  const hand = () => { ctx.beginPath(); ctx.arc(0, 0.5, 2.1 * L.wide, 0, Math.PI * 2); fill(L.skin); };

  limb(-2, shY + 2, 0.35 - sw * 0.5, 10, 2 * L.wide, darken(L.sleeve, 0.2), hand);              // far arm
  limb(-1.5, hipY - bob, -sw * 0.55, 13 + bob, 2.4 * L.wide, darken(L.legs, 0.2), shoe);        // far leg
  limb(1.5, hipY - bob, sw * 0.55, 13 + bob, 2.4 * L.wide, L.legs, shoe);                        // near leg

  // Torso
  ctx.beginPath(); ctx.roundRect(-tw, shY, tw * 2, hipY - shY + 2 - bob, 3 * L.wide); fill(L.body);
  if (L.belly) { ctx.beginPath(); ctx.ellipse(tw * 0.35, hipY - 5 - bob, tw * 0.85, 6.5, 0, 0, Math.PI * 2); fill(lighten(L.body, 0.08)); }
  if (L.stripe) { ctx.beginPath(); ctx.rect(-tw, shY + 6, tw * 2, 2.2); fill(L.stripe); }
  if (L.overalls) { ctx.beginPath(); ctx.roundRect(-tw + 1.5, shY + 3, tw * 2 - 3, hipY - shY - 1 - bob, 2); fill(L.overalls); }
  if (L.badge && !o.back) { ctx.beginPath(); ctx.arc(tw * 0.45, shY + 5, 1.6, 0, Math.PI * 2); fill('#f2c94c'); }
  if (L.bag) {
    ctx.save(); ctx.translate(0, shY + 1); ctx.rotate(0.6);
    ctx.beginPath(); ctx.rect(-1, 0, 2, 16); fill(darken(L.bag, 0.2)); ctx.restore();
    ctx.beginPath(); ctx.roundRect(-tw - 3, hipY - 8 - bob, 8, 7, 1.5); fill(L.bag);
  }

  // Head
  const hr = L.headR, hx = 1, hy = shY - hr + 1.5;
  if (L.longHair) {   // long hair falling past the shoulders, behind the head
    const sway = Math.sin(time * 1.8 + (o.seed || 0)) * 0.6;
    ctx.beginPath();
    if (o.back) ctx.roundRect(hx - hr - 1, hy - hr, hr * 2 + 2, hr * 2 + 9, 4);
    else { ctx.moveTo(hx + 1, hy - hr - 0.5); ctx.quadraticCurveTo(hx - hr - 3, hy - hr, hx - hr - 2 + sway, hy + hr + 8);
           ctx.lineTo(hx - 1 + sway, hy + hr + 6); ctx.quadraticCurveTo(hx - 1, hy + 2, hx + 1, hy - hr - 0.5); }
    fill(L.hair);
    ctx.beginPath(); ctx.moveTo(hx - hr + 1, hy); ctx.quadraticCurveTo(hx - hr - 1 + sway, hy + hr + 2, hx - hr + sway, hy + hr + 7);
    ctx.strokeStyle = P(darken(L.hair, 0.15)); ctx.lineWidth = 0.8; ctx.stroke(); ctx.lineWidth = 1;
  }
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); fill(L.skin);
  if (o.back) { ctx.beginPath(); ctx.arc(hx, hy, hr, Math.PI * 0.85, Math.PI * 2.15); fill(L.hair); }
  else {
    ctx.beginPath(); ctx.arc(hx - 1, hy - 1, hr, Math.PI * 0.95, Math.PI * 1.6); fill(L.hair);
    if (o.tainted) glowEye(hx + hr * 0.45, hy - 0.5, 1.3);                                             // polluted eye
    else { ctx.beginPath(); ctx.arc(hx + hr * 0.45, hy - 0.5, 0.9, 0, Math.PI * 2); fill('#1e1a18'); }
    if (L.grumpy) { ctx.beginPath(); ctx.moveTo(hx + 1, hy - 3.4); ctx.lineTo(hx + hr, hy - 2); ctx.lineTo(hx + hr, hy - 1.2); ctx.lineTo(hx + 1, hy - 2.4); fill('#2a1e18'); }
    ctx.beginPath(); ctx.moveTo(hx + hr - 0.5, hy - 0.5); ctx.lineTo(hx + hr + 1.6, hy + 1.2); ctx.lineTo(hx + hr - 0.5, hy + 1.8); fill(darken(L.skin, 0.12)); // nose
    if (L.mustache) { ctx.beginPath(); ctx.roundRect(hx + hr * 0.3, hy + 2, hr * 0.75, 1.5, 0.7); fill(L.mustache); }
    else { ctx.beginPath(); ctx.rect(hx + hr * 0.45, hy + 2.6, 2, 0.6); fill(L.lips || '#6a3a2a'); }
  }
  if (L.hat === 'cap') {
    ctx.beginPath(); ctx.arc(hx, hy - 1, hr + 0.4, Math.PI, 0); fill(L.hatColor);
    ctx.beginPath(); ctx.roundRect(hx + (o.back ? -hr - 3 : 0), hy - 1.8, hr + 3, 1.8, 0.9); fill(darken(L.hatColor, 0.15));
  } else if (L.hat === 'uniform') {
    ctx.beginPath(); ctx.roundRect(hx - hr - 0.5, hy - hr - 2.5, hr * 2 + 1, 4.5, 1); fill(L.hatColor);
    ctx.beginPath(); ctx.roundRect(hx + (o.back ? -hr - 2.5 : 1), hy - hr + 1.5, hr + 1.5, 1.6, 0.8); fill('#1e1e22');
  } else if (L.hat === 'straw') {
    ctx.beginPath(); ctx.ellipse(hx, hy - hr + 2, hr + 5, 1.8, 0, 0, Math.PI * 2); fill(L.hatColor);
    ctx.beginPath(); ctx.roundRect(hx - hr + 1, hy - hr - 3, hr * 2 - 2, 5, 2); fill(L.hatColor);
    ctx.beginPath(); ctx.rect(hx - hr + 1, hy - hr + 0.2, hr * 2 - 2, 1.2); fill('#b3191c');
  }

  // Near arm holding their item.
  limb(3, shY + 2, o.armA, 10, 2 * L.wide, L.sleeve, () => {
    ctx.rotate(-0.25); drawPersonItem(L.item); ctx.rotate(0.25); hand();
  });
  ctx.restore();
}

// What each townsperson looks like. wide = body width, headR = head size.
const LOOKS = {
  paperboy:   { wide: 0.85, headR: 5.6, skin: '#f1c27d', hair: '#6b4a2b', body: '#3a7bd5', stripe: '#f2f2f2', sleeve: '#3a7bd5', legs: '#34495e',
                shoes: '#eeeeee', hat: 'cap', hatColor: '#c0392b', item: 'newspaper' },
  mailman:    { wide: 1,    headR: 5.4, skin: '#c68642', hair: '#2a1e18', body: '#5a7aa8', sleeve: '#5a7aa8', legs: '#2f3e5a',
                shoes: '#1e1e22', hat: 'uniform', hatColor: '#2c3e66', bag: '#7a5230', badge: true, item: 'parcel' },
  gardener:   { wide: 1.12, headR: 5.4, skin: '#e0ac69', hair: '#9a9a9a', body: '#d9d0b8', sleeve: '#d9d0b8', legs: '#4f7a3a', overalls: '#4f7a3a',
                shoes: '#5a3a20', hat: 'straw', hatColor: '#d8b45a', grumpy: true, mustache: '#9a9a9a', item: 'rake' },
  dogcatcher: { wide: 1.35, headR: 5.2, skin: '#d8a07a', hair: '#3a2a1a', body: '#8a7a4a', sleeve: '#8a7a4a', legs: '#5a5038',
                shoes: '#2a2218', hat: 'uniform', hatColor: '#4a4230', grumpy: true, mustache: '#3a2a1a', belly: true, badge: true, item: 'net' },
  jackie:     { wide: 0.88, headR: 5.6, skin: '#f3cfae', hair: '#f2d06b', longHair: true, lips: '#c4566a', body: '#2bb3a3', sleeve: '#2bb3a3', legs: '#3a4a6a',
                shoes: '#f0f0f0', item: 'none' },
};

// Jackie waits by the doghouse and waves when Watson comes home.
function drawJackie() {
  const p = player, s = toScreen(JACKIE.x, JACKIE.y);
  shadow(JACKIE.x, JACKIE.y, 0.25);
  const near = Math.hypot(p.x - JACKIE.x, p.y - JACKIE.y) < 3.5;
  const { flip } = screenFacing(p.x - JACKIE.x, p.y - JACKIE.y);
  drawPerson(s.x, s.y, { s: 1.1, flip, back: false, walk: 0, moving: false, seed: 2,
    armA: near ? -2.9 + Math.sin(time * 8) * 0.35 : -0.3, look: 'jackie' });
}
// Fred: an orange tabby who sits on a crate of goodies beside the doghouse.
function drawFred() {
  const p = player, s = toScreen(FRED.x, FRED.y);
  shadow(FRED.x, FRED.y, 0.45);
  // The crate of wares (not mirrored)
  ctx.save(); ctx.translate(s.x - 18, s.y);
  ctx.fillStyle = '#9a6a3a'; ctx.fillRect(-11, -14, 18, 14);
  ctx.fillStyle = '#7a5028'; for (const y of [-10, -5]) ctx.fillRect(-11, y, 18, 1.2);
  ctx.fillStyle = '#b07a45'; ctx.fillRect(-11, -15.5, 18, 2.2);
  ctx.save(); ctx.translate(-6, -15); ctx.rotate(-0.5); ctx.fillStyle = '#8a5a2e'; ctx.fillRect(0, -1, 13, 2.2); ctx.restore();   // a stick
  ctx.save(); ctx.translate(1, -17); ctx.rotate(0.35); paintMode = null; drawBone(-3, 4, '#f2e6c8'); ctx.restore();                 // a bone
  ctx.fillStyle = '#2ec4b6'; ctx.beginPath(); ctx.ellipse(-8, -16, 4, 1.4, 0, 0, Math.PI * 2); ctx.fill();                      // a frisbee
  ctx.fillStyle = '#f2e6c8'; ctx.font = 'bold 5px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText("FRED'S", -2, -6.5);
  ctx.restore();

  // The cat
  const { flip } = screenFacing(p.x - FRED.x, p.y - FRED.y);
  const orange = '#f08a24', stripe = '#c4621a', white = '#fbf3e6';
  ctx.save(); ctx.translate(s.x, s.y); ctx.scale(flip ? -1.25 : 1.25, 1.25);
  const swish = Math.sin(time * 2.2) * 0.35;
  ctx.save(); ctx.translate(-7, -3); ctx.rotate(-1.1 + swish);                                                  // tail
  ctx.beginPath(); ctx.moveTo(-1.6, 0); ctx.quadraticCurveTo(-3, -9, 1, -15); ctx.lineTo(3.4, -14); ctx.quadraticCurveTo(0, -9, 1.6, 0); ctx.closePath();
  ctx.fillStyle = orange; ctx.fill();
  ctx.fillStyle = stripe; for (const y of [-5, -10]) { ctx.beginPath(); ctx.rect(-2.5, y, 4.5, 1.3); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = orange; ctx.beginPath(); ctx.ellipse(0, -10, 8.5, 10, 0, 0, Math.PI * 2); ctx.fill();         // body
  ctx.fillStyle = stripe; for (const a of [-0.9, -0.5, -0.1]) { ctx.beginPath(); ctx.ellipse(-4, -11 + a * 8, 4, 1.1, 0.5, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = white; ctx.beginPath(); ctx.ellipse(4, -9, 4.2, 7, 0, 0, Math.PI * 2); ctx.fill();            // chest
  for (const x of [2.5, 6.5]) { ctx.beginPath(); ctx.ellipse(x, -1.2, 2.4, 1.6, 0, 0, Math.PI * 2); ctx.fill(); } // paws
  // Head
  const hx = 4, hy = -23;
  ctx.fillStyle = orange;
  for (const [a, b, c] of [[[-2, -4], [-1, -13], [4, -6]], [[4, -6], [9, -13], [10, -3]]]) {                    // ears
    ctx.beginPath(); ctx.moveTo(hx + a[0], hy + a[1]); ctx.lineTo(hx + b[0], hy + b[1]); ctx.lineTo(hx + c[0], hy + c[1]); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#f2a0a8';
  ctx.beginPath(); ctx.moveTo(hx - 0.5, hy - 5); ctx.lineTo(hx - 0.2, hy - 10.5); ctx.lineTo(hx + 2.5, hy - 6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 5.5, hy - 6); ctx.lineTo(hx + 8.2, hy - 10.5); ctx.lineTo(hx + 8.5, hy - 4); ctx.fill();
  ctx.fillStyle = orange; ctx.beginPath(); ctx.arc(hx + 1, hy, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = stripe; for (const x of [-1, 1.5, 4]) { ctx.beginPath(); ctx.rect(hx + x - 0.6, hy - 7, 1.2, 3); ctx.fill(); }
  ctx.fillStyle = white; ctx.beginPath(); ctx.ellipse(hx + 4, hy + 2.5, 4, 2.8, 0, 0, Math.PI * 2); ctx.fill();   // muzzle
  ctx.fillStyle = '#e07080'; ctx.beginPath(); ctx.moveTo(hx + 5, hy + 0.5); ctx.lineTo(hx + 7.4, hy + 0.5); ctx.lineTo(hx + 6.2, hy + 2); ctx.fill();
  const blink = (time % 4.3) < 0.15;
  for (const ex of [1, 5.5]) {
    if (blink) { ctx.fillStyle = '#3a2410'; ctx.fillRect(hx + ex - 1.5, hy - 1.5, 3, 0.7); continue; }
    ctx.fillStyle = '#8ad04a'; ctx.beginPath(); ctx.ellipse(hx + ex, hy - 1.3, 1.6, 1.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a10'; ctx.beginPath(); ctx.ellipse(hx + ex + 0.2, hy - 1.3, 0.45, 1.6, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 0.5;                                                // whiskers
  for (const dy of [-0.6, 0.8]) { ctx.beginPath(); ctx.moveTo(hx + 6, hy + 2); ctx.lineTo(hx + 13, hy + 2 + dy * 2); ctx.stroke(); }
  ctx.lineWidth = 1;
  ctx.restore();
}

// ----- Polluted plant monsters -----
// pose: prog = how far into an attack wind-up (0..1), slump = off balance after attacking.
const TOXIC = '#b14cff';
function glowEye(x, y, r) {
  ctx.shadowColor = TOXIC; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill('#e3b8ff');
  ctx.shadowBlur = 0;
}
function angryEyes(x, y, gap, r) {
  for (const dx of [0, gap]) {
    ctx.beginPath(); ctx.arc(x + dx, y, r, 0, Math.PI * 2); fill('#ffffff');
    ctx.beginPath(); ctx.arc(x + dx + r * 0.3, y + r * 0.2, r * 0.55, 0, Math.PI * 2); fill('#2a1030');
  }
  ctx.beginPath(); ctx.moveTo(x - r, y - r * 1.6); ctx.lineTo(x + r, y - r * 0.9); ctx.lineTo(x + r, y - r * 0.4); ctx.lineTo(x - r, y - r * 1.1); fill('#2a1030');
  ctx.beginPath(); ctx.moveTo(x + gap - r, y - r * 0.9); ctx.lineTo(x + gap + r, y - r * 1.6); ctx.lineTo(x + gap + r, y - r * 1.1); ctx.lineTo(x + gap - r, y - r * 0.4); fill('#2a1030');
}
function stubFeet(sw, w, c) {
  for (const k of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(k * w + sw * k * 2, -1.5 + (sw * k > 0 ? -1.5 * Math.abs(sw) : 0), 3.2, 2, 0, 0, Math.PI * 2); fill(c);
  }
}

function drawPlant(sx, sy, e, pose) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(pose.flip ? -e.s : e.s, e.s);
  const sw = e.moving ? Math.sin(e.walk) : 0;
  const bob = e.moving ? Math.abs(Math.cos(e.walk)) * 1.5 : Math.sin(time * 2.4 + e.seed) * 0.6;
  const wig = Math.sin(time * 4 + e.seed);

  if (e.look === 'sprout') {
    stubFeet(sw, 4, '#5d8a2e');
    ctx.rotate(pose.slump ? 0.45 : -0.35 * pose.prog);
    ctx.translate(0, -bob);
    ctx.beginPath(); ctx.ellipse(0, -10, 8.5, 9, 0, 0, Math.PI * 2); fill('#8fbf4f');
    for (const [x, y, r] of [[-4, -6, 1.6], [-1, -15, 1.2], [5, -4, 1.1]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill('#8e44ad'); }
    ctx.beginPath(); ctx.roundRect(-0.8, -25, 1.6, 8, 0.8); fill('#5d8a2e');
    for (const k of [-1, 1]) {
      ctx.save(); ctx.translate(0, -24); ctx.rotate(k * (0.7 + wig * 0.15));
      ctx.beginPath(); ctx.ellipse(0, -4, 2.8, 5, 0, 0, Math.PI * 2); fill(k < 0 ? '#6fa83a' : '#7fb84a');
      ctx.beginPath(); ctx.rect(-0.3, -8, 0.6, 7); fill('#8e44ad');
      ctx.restore();
    }
    angryEyes(1.5, -12, 4.2, 1.7);
    ctx.beginPath(); ctx.arc(4, -5.5, 2, Math.PI * 1.1, Math.PI * 1.9); ctx.strokeStyle = P('#2a1030'); ctx.lineWidth = 1; ctx.stroke();
  } else if (e.look === 'thorn') {
    stubFeet(sw, 5, '#3a5a24');
    ctx.translate(0, -bob);
    const puff = pose.slump ? 0.85 : 1 + pose.prog * 0.2;
    ctx.translate(0, -12); ctx.scale(puff, pose.slump ? 0.8 : puff);
    const spikes = 12, tl = 3 + pose.prog * 5;
    for (let i = 0; i < spikes; i++) {
      const a = (i / spikes) * Math.PI * 2 + wig * 0.05, r = 10.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.15) * r, Math.sin(a - 0.15) * r);
      ctx.lineTo(Math.cos(a) * (r + tl), Math.sin(a) * (r + tl));
      ctx.lineTo(Math.cos(a + 0.15) * r, Math.sin(a + 0.15) * r);
      fill('#c9a0dc');
    }
    for (const [x, y, r, c] of [[-5, 2, 7, '#335a26'], [5, 2, 7, '#335a26'], [0, -4, 8, '#3f6e2e'], [-4, -2, 6, '#4a7a34'], [5, -5, 5, '#4a7a34']]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill(c);
    }
    for (const [x, y] of [[-6, 4], [2, 5], [-1, -9]]) { ctx.beginPath(); ctx.arc(x, y, 1.3, 0, Math.PI * 2); fill('#8e44ad'); }
    glowEye(2, -3, 1.8); glowEye(7, -3, 1.8);
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4, -4.6); ctx.moveTo(9, -6); ctx.lineTo(5, -4.6); ctx.strokeStyle = P('#14200e'); ctx.lineWidth = 1.2; ctx.stroke();
  } else if (e.look === 'toadstool') {
    for (const k of [-1, 1]) { ctx.beginPath(); ctx.roundRect(k * 3 - 2 + sw * k * 2, -6, 4, 6, 2); fill('#cfc2a2'); }
    ctx.translate(0, -bob);
    ctx.beginPath(); ctx.roundRect(-6.5, -26, 13, 22, 5); fill('#e8dcc0');
    angryEyes(0, -18, 4.5, 1.8);
    ctx.beginPath(); ctx.rect(1, -12, 4, 1); fill('#2a1030');
    // Arms
    let armA = e.moving ? -0.4 + sw * 0.3 : -0.4;
    if (pose.prog > 0) armA = lerp(-0.4, -3.1, pose.prog); else if (pose.slump) armA = -0.1;
    for (const [x, a, c] of [[-4, -armA * 0.6 + 0.2, '#cfc2a2'], [4, armA, '#e8dcc0']]) {
      ctx.save(); ctx.translate(x, -20); ctx.rotate(a);
      ctx.beginPath(); ctx.roundRect(-1.8, -1, 3.6, 11, 1.8); fill(c); ctx.restore();
    }
    // Cap: lifts during the wind-up, flops down when off balance.
    const capY = -25 - pose.prog * 4 + (pose.slump ? 3 : 0);
    ctx.beginPath(); ctx.ellipse(0, capY, 16, 11, 0, Math.PI, 0); ctx.closePath(); fill('#8e3b9e');
    ctx.beginPath(); ctx.ellipse(0, capY, 16, 2.5, 0, 0, Math.PI); fill('#6a2a78');
    for (const [x, y, r] of [[-8, -4, 2.4], [0, -8, 2.8], [8, -4, 2.2], [-3, -3, 1.5], [5, -9, 1.4]]) { ctx.beginPath(); ctx.arc(x, capY + y, r, 0, Math.PI * 2); fill('#b6f55a'); }
    if (pose.prog > 0) {   // toxic spores puffing out
      for (let i = 0; i < 6; i++) {
        const a = i + time * 2, rr = 12 + ((time * 10 + i * 5) % 10);
        ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(Math.cos(a) * rr, capY - 4 + Math.sin(a) * rr * 0.4, 1.4, 0, Math.PI * 2); fill('#b6f55a'); ctx.globalAlpha = 1;
      }
    }
  } else if (e.look === 'oak') {
    for (const k of [-1, 1]) {   // root legs
      ctx.save(); ctx.translate(k * 4, -14); ctx.rotate(sw * k * 0.4);
      ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0); ctx.lineTo(4.5, 14); ctx.lineTo(-4.5, 14); ctx.closePath(); fill(k < 0 ? '#4e3420' : '#5e4028');
      ctx.restore();
    }
    ctx.translate(0, -bob);
    let armA = e.moving ? -0.3 + sw * 0.25 : -0.3;
    if (pose.prog > 0) armA = lerp(-0.3, -3.3, pose.prog); else if (pose.slump) armA = 0.1;
    const branch = (x, a, c) => {
      ctx.save(); ctx.translate(x, -36); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(-2.5, 0); ctx.lineTo(2.5, 0); ctx.lineTo(1, 20); ctx.lineTo(-1, 20); ctx.closePath(); fill(c);
      ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(5, 15); ctx.lineTo(4, 16); ctx.lineTo(-0.5, 12); fill(c);
      for (const [lx, ly] of [[0, 21], [5, 16], [-2, 17]]) { ctx.beginPath(); ctx.arc(lx, ly, 3, 0, Math.PI * 2); fill('#5a4a6a'); }
      ctx.restore();
    };
    branch(-6, -armA * 0.5 + 0.3, '#4e3420');
    ctx.beginPath(); ctx.roundRect(-9.5, -44, 19, 32, 4); fill('#6b4a2e');
    for (const x of [-5, 0, 5]) { ctx.beginPath(); ctx.rect(x - 0.5, -42, 1, 26); fill('#553a22'); }
    // Withered canopy with smog drifting off it
    for (const [x, y, r, c] of [[-8, -48, 8, '#4a5a32'], [7, -49, 8, '#4a5a32'], [0, -55, 10, '#56663a'], [-3, -50, 6, '#6a5a7a']]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill(c);
    }
    for (let i = 0; i < 3; i++) {
      const t = (time * 0.5 + i / 3) % 1;
      ctx.globalAlpha = 0.45 * (1 - t);
      ctx.beginPath(); ctx.arc(-4 + i * 4 + Math.sin(t * 6 + i) * 3, -62 - t * 18, 3 + t * 5, 0, Math.PI * 2); fill('#7a6e86');
      ctx.globalAlpha = 1;
    }
    // Carved face
    ctx.beginPath(); ctx.ellipse(-1, -32, 2.6, 3.2, 0, 0, Math.PI * 2); fill('#24160c');
    ctx.beginPath(); ctx.ellipse(6, -32, 2.6, 3.2, 0, 0, Math.PI * 2); fill('#24160c');
    glowEye(-0.5, -31.5, 1.2); glowEye(6.5, -31.5, 1.2);
    ctx.beginPath(); ctx.moveTo(-3, -24); for (let i = 0; i <= 6; i++) ctx.lineTo(-3 + i * 1.8, i % 2 ? -21.5 : -24); ctx.lineTo(8, -20); ctx.lineTo(-3, -20); fill('#24160c');
    branch(6, armA, '#5e4028');
  }
  ctx.restore();
}

// Purple pollution glow under bosses.
function drawTaintAura(e) {
  const pulse = 0.5 + Math.sin(time * 3 + e.seed) * 0.2;
  ctx.fillStyle = `rgba(177,76,255,${0.25 * pulse + 0.1})`;
  groundEllipse(e.x, e.y, e.r + 0.45); ctx.fill();
  const s = toScreen(e.x, e.y);
  for (let i = 0; i < 4; i++) {
    const t = (time * 0.6 + i / 4 + e.seed) % 1;
    ctx.globalAlpha = 0.7 * (1 - t);
    ctx.fillStyle = TOXIC;
    ctx.beginPath(); ctx.arc(s.x + Math.sin(i * 2.3 + time) * 14 * e.s, s.y - t * e.h, 2 + i % 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}


function drawEnemy(e) {
  shadow(e.x, e.y, e.r);
  if (e.boss) drawTaintAura(e);
  const s = toScreen(e.x, e.y);
  paintMode = e.flash > 0 ? 'flash' : e.state === 'windup' && Math.floor(time * 12) % 2 ? 'tint' : null;
  const { flip, back } = screenFacing(e.fx, e.fy);
  const prog = e.state === 'windup' ? Math.min(1, (1 - e.t / e.tMax) * 1.6) : 0;
  const slump = e.state === 'recover' && e.punishable;
  if (e.boss) {
    let armA = e.moving ? -0.45 + Math.sin(e.walk) * 0.3 : -0.5;
    if (prog > 0) armA = lerp(-0.5, -3.5, prog);   // item raised overhead
    else if (slump) armA = -0.2;                   // swung down, off balance
    drawPerson(s.x, s.y, { s: e.s, flip, back, walk: e.walk, moving: e.moving, seed: e.seed, armA, look: e.look, tainted: true });
  } else {
    drawPlant(s.x, s.y, e, { flip, prog, slump });
  }
  paintMode = null;
  const top = s.y - e.h - 8;
  if (e === target) {
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillText(`${e.name} Lv${e.lvl}`, s.x, top - 6);
  }
  if (e.hp < e.maxHp || e === target) {
    ctx.fillStyle = '#300'; ctx.fillRect(s.x - 18, top - 2, 36, 4);
    ctx.fillStyle = '#e04848'; ctx.fillRect(s.x - 18, top - 2, 36 * Math.max(0, e.hp) / e.maxHp, 4);
  }
}

function drawPlayer() {
  const p = player;
  shadow(p.x, p.y, p.r + 0.08);
  const s = toScreen(p.x, p.y);
  if (p.grace > 0 && Math.floor(time * 20) % 2) ctx.globalAlpha = 0.5;
  paintMode = p.flash > 0 ? 'flash' : null;
  if (p.roll) {
    // Tucked into a roll: a spinning ball of brown fur.
    const a = (0.4 - p.roll.t) * 18 * (screenFacing(p.roll.x, p.roll.y).flip ? -1 : 1);
    ctx.save(); ctx.translate(s.x, s.y - 13); ctx.scale(DOG_SCALE, DOG_SCALE); ctx.rotate(a);
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); fill('#8b5a2b');
    ctx.beginPath(); ctx.arc(2, 2, 6, 0, Math.PI * 2); fill('#c99a62');
    ctx.beginPath(); ctx.ellipse(-5, -6, 2.5, 5, 0.6, 0, Math.PI * 2); fill('#5e3b1c');
    ctx.beginPath(); ctx.rect(-8, 3, 6, 2.2); fill('#c0392b');
    ctx.restore();
  } else {
    let { flip } = screenFacing(p.face.x, p.face.y);
    if (p.whirl > 0) flip = Math.floor(p.whirl * 20) % 2 === 0;   // zoomies: spinning in circles
    const wpn = WEAPONS[p.weapon];
    drawDog(s.x, s.y, { flip, walk: p.walk, moving: p.moving || p.whirl > 0, running: p.running || p.whirl > 0,
      attack: p.swing > 0 ? 1 - p.swing / p.swingMax : -1, item: wpn.type, color: wpn.color, eating: p.drink > 0 });
  }
  paintMode = null;
  ctx.globalAlpha = 1;
}

// Watson's doghouse: the safe spot in the middle of town.
function drawDoghouse() {
  const s = toScreen(CENTER, CENTER);
  shadow(CENTER, CENTER, 0.75);
  const x = s.x, y = s.y;
  ctx.fillStyle = '#b5703a';                                                                  // walls
  ctx.beginPath(); ctx.moveTo(x - 24, y - 6); ctx.lineTo(x, y + 6); ctx.lineTo(x + 24, y - 6); ctx.lineTo(x + 24, y - 30); ctx.lineTo(x, y - 18); ctx.lineTo(x - 24, y - 30); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9a5c2e';
  ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.lineTo(x + 24, y - 6); ctx.lineTo(x + 24, y - 30); ctx.lineTo(x, y - 18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a1a12';                                                                  // door
  ctx.beginPath(); ctx.moveTo(x - 16, y - 2); ctx.lineTo(x - 6, y + 3); ctx.lineTo(x - 6, y - 10); ctx.quadraticCurveTo(x - 11, y - 20, x - 16, y - 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#b3191c';                                                                  // roof
  ctx.beginPath(); ctx.moveTo(x - 28, y - 28); ctx.lineTo(x - 2, y - 52); ctx.lineTo(x + 4, y - 15); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8e1416';
  ctx.beginPath(); ctx.moveTo(x - 2, y - 52); ctx.lineTo(x + 28, y - 28); ctx.lineTo(x + 4, y - 15); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f2e6c8'; ctx.font = 'bold 8px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.save(); ctx.translate(x - 12, y - 23); ctx.transform(1, 0.45, 0, 1, 0, 0); ctx.fillText('WATSON', 0, 0); ctx.restore();
  // Food bowl
  const b = toScreen(CENTER + 0.9, CENTER + 0.3);
  ctx.fillStyle = '#3a6fd8'; ctx.beginPath(); ctx.ellipse(b.x, b.y, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a0622d'; ctx.beginPath(); ctx.ellipse(b.x, b.y - 1, 5, 2, 0, 0, Math.PI * 2); ctx.fill();
}

function drawBloodstain() {
  const b = bloodstain, pulse = 0.6 + Math.sin(time * 4) * 0.25;
  ctx.fillStyle = `rgba(242,201,76,${pulse * 0.4})`;
  groundEllipse(b.x, b.y, 0.5); ctx.fill();
  const s = toScreen(b.x, b.y);
  ctx.save(); ctx.translate(s.x, s.y - 10 - Math.sin(time * 3) * 2); ctx.rotate(-0.4);
  ctx.globalAlpha = 0.6 + pulse * 0.4; ctx.shadowColor = '#f2c94c'; ctx.shadowBlur = 12;
  drawBone(-6, 6, '#fff3c4');
  ctx.restore(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawEffect(f) {
  const a = f.t / f.max;
  ctx.globalAlpha = a;
  ctx.strokeStyle = ctx.fillStyle = f.color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (f.type === 'arc') {
    for (let k = 0; k <= 12; k++) {
      const an = f.ang - Math.PI / 3 + (k / 12) * (Math.PI * 2 / 3);
      const s = toScreen(f.x + Math.cos(an) * f.range, f.y + Math.sin(an) * f.range);
      k ? ctx.lineTo(s.x, s.y - 14) : ctx.moveTo(s.x, s.y - 14);
    }
    ctx.stroke();
  } else {
    groundEllipse(f.x, f.y, f.range * (1.2 - a * 0.2));
    if (f.fill) { ctx.globalAlpha = a * 0.35; ctx.fill(); ctx.globalAlpha = a; }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
}

function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
}

function drawHUD() {
  const p = player;
  // HP and stamina bars grow as you level those stats.
  bar(18, 18, maxHp() * 2.4, 14, p.hp / maxHp(), '#b3191c');
  bar(18, 40, maxSta() * 2.4, 8, p.sta / maxSta(), '#3fae5a');
  ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText(`${Math.ceil(p.hp)} / ${maxHp()}`, 24, 29);

  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = '#e8e4e0'; ctx.fillText(`Level ${p.level}`, 16, 72);
  ctx.fillStyle = '#f2c94c'; ctx.fillText(`${p.xp} XP`, 80, 72);
  ctx.fillStyle = '#c4b8b6';
  ctx.fillText(`${WEAPONS[p.weapon].name} (${weaponDmg()} dmg)`, 16, 92);
  ctx.fillText(`${zoneAt(p.x, p.y).name}  ·  ${kills} chased off`, 16, 112);
  ctx.fillStyle = '#d6a8ff'; ctx.fillText(`Bosses beaten: ${defeated.size} / ${BOSSES.length}`, 16, 132);
  if (bloodstain) { ctx.fillStyle = '#ff6b6b'; ctx.fillText(`${bloodstain.xp} XP waiting where you were knocked out`, 16, 152); }

  drawHint();
  if (distC(p.x, p.y) < SAFE_R && !isTouch) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd25a'; ctx.font = '16px Georgia, serif';
    ctx.fillText('Press B to rest at the doghouse', W / 2, H - 110);
    if (nearFred()) { ctx.fillStyle = '#ffb36b'; ctx.fillText('Press E to trade with Fred', W / 2, H - 132); }
  }

  // Locked-on target, top centre.
  if (target) {
    const bw = Math.min(target.boss ? 460 : 300, W - 60);
    const ty = W < 760 ? 186 : 26;   // narrow (phone) screens: below the stats so they don't overlap
    ctx.textAlign = 'center'; ctx.fillStyle = target.boss ? '#e3b8ff' : '#e8e4e0'; ctx.font = (target.boss ? '18px' : '14px') + ' Georgia, serif';
    ctx.fillText(`${target.name}  ·  Lv ${target.lvl}`, W / 2, ty);
    bar(W / 2 - bw / 2, ty + 8, bw, target.boss ? 10 : 8, target.hp / target.maxHp, target.boss ? '#8e44ad' : '#b3191c');
  }

  if (isTouch) { drawJoystick(); return; }   // phones use on-screen buttons instead

  // Action bar
  const slots = [
    ...SKILLS.map(s => ({ key: s.key === '1' ? 'Click' : s.key, label: p.skills.has(s.id) ? s.name : `${s.cost} XP`,
      owned: p.skills.has(s.id), cd: cooldowns[s.id] / s.cd })),
    { key: 'Q', label: `Biscuit ${p.flasks}/${p.maxFlasks}`, owned: p.flasks > 0, cd: 0 },
    { key: 'Space', label: 'Roll', owned: true, cd: 0 },
    { key: 'Shift', label: 'Run', owned: true, cd: 0 },
  ];
  const size = 62, gap = 8, total = slots.length * size + (slots.length - 1) * gap;
  const x0 = (W - total) / 2, y0 = H - size - 16;
  slots.forEach((s, i) => {
    const x = x0 + i * (size + gap);
    ctx.fillStyle = s.owned ? 'rgba(36,29,32,.92)' : 'rgba(36,29,32,.5)';
    ctx.fillRect(x, y0, size, size);
    ctx.strokeStyle = s.owned ? '#6a4a50' : '#352b2d';
    ctx.strokeRect(x + 0.5, y0 + 0.5, size - 1, size - 1);
    if (s.owned && s.cd > 0) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, y0 + size * (1 - s.cd), size, size * s.cd); }
    ctx.textAlign = 'center';
    ctx.fillStyle = s.owned ? '#e8e4e0' : '#6d6264';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.fillText(s.key, x + size / 2, y0 + 20);
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillText(s.label, x + size / 2, y0 + 44);
  });
}

function drawJoystick() {
  if (joy.id === null) return;
  const ox = joy.ox / VIEW, oy = joy.oy / VIEW, R = JOY_R / VIEW;
  ctx.fillStyle = 'rgba(30,20,16,.35)'; ctx.strokeStyle = 'rgba(208,138,69,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ox, oy, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = joy.mag > 0.92 ? 'rgba(242,201,76,.85)' : 'rgba(242,230,200,.75)';
  ctx.beginPath(); ctx.arc(ox + joy.dx * R, oy + joy.dy * R, R * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 1;
}

function draw() {
  ctx.fillStyle = '#0b0a0c';
  ctx.fillRect(0, 0, W, H);
  drawTiles();
  if (bloodstain) drawBloodstain();
  for (const e of enemies) {
    if (e.state === 'windup') drawTelegraph(e);
    if (e.state === 'recover' && e.punishable) {   // yellow ring = open to a critical hit
      ctx.strokeStyle = 'rgba(255,210,90,.9)'; ctx.lineWidth = 3;
      groundEllipse(e.x, e.y, e.r + 0.3); ctx.stroke(); ctx.lineWidth = 1;
    }
  }
  if (target) {
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
    groundEllipse(target.x, target.y, target.r + 0.18); ctx.stroke(); ctx.lineWidth = 1;
  }

  // Depth-sort everything standing on the ground.
  const things = [
    { d: CENTER * 2, f: drawDoghouse },
    { d: JACKIE.x + JACKIE.y, f: drawJackie },
    { d: FRED.x + FRED.y, f: drawFred },
    ...enemies.map(e => ({ d: e.x + e.y, f: () => drawEnemy(e) })),
    ...projectiles.map(pr => ({ d: pr.x + pr.y, f: () => {
      // Mega Bark: a flying bundle of sound waves.
      shadow(pr.x, pr.y, 0.12);
      const s = toScreen(pr.x, pr.y), a = Math.atan2(pr.vy * 0.5 + pr.vx * 0.5, pr.vx - pr.vy);
      ctx.save(); ctx.translate(s.x, s.y - 16); ctx.rotate(a);
      ctx.strokeStyle = '#cfe8ff'; ctx.lineCap = 'round';
      ctx.shadowColor = '#9fd4ff'; ctx.shadowBlur = 10;
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = 1 - i * 0.25; ctx.lineWidth = 4 - i;
        ctx.beginPath(); ctx.arc(-i * 7, 0, 9 + i * 5, -1, 1); ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.restore(); ctx.globalAlpha = 1; ctx.lineWidth = 1;
    } })),
  ];
  if (!player.dead) things.push({ d: player.x + player.y, f: drawPlayer });
  things.sort((a, b) => a.d - b.d).forEach(t => t.f());

  effects.forEach(drawEffect);

  ctx.textAlign = 'center';
  ctx.font = 'bold 14px system-ui, sans-serif';
  for (const f of floaters) {
    const s = toScreen(f.x, f.y);
    ctx.globalAlpha = Math.min(1, f.t / f.max * 2);
    ctx.fillStyle = '#000'; ctx.fillText(f.text, s.x + f.dx + 1, s.y - f.z + 1);
    ctx.fillStyle = f.color; ctx.fillText(f.text, s.x + f.dx, s.y - f.z);
  }
  ctx.globalAlpha = 1;

  if (!overlay('title').classList.contains('open')) drawHUD();
}

// ---------- Learn-as-you-play hints ----------
// No instruction screen: each hint pops up the first time it's useful and goes away
// once you've done it (or after a few seconds for the ones that are just warnings).
const tut = { moved: 0, playT: 0, strike: 0, whirl: 0, fireball: 0, rolls: 0, crits: 0, ran: 0, ate: 0, shop: 0, fred: 0 };
const near = (e, d) => Math.hypot(e.x - player.x, e.y - player.y) < d;
const HINTS = [   // earlier hints win when several apply at once
  { id: 'roll',   text: 'SPACE  to roll out of the red circle', touch: 'Tap ROLL to get out of the red circle',            when: () => enemies.some(e => e.state === 'windup' && near(e, 3)),   done: () => tut.rolls > 0 },
  { id: 'heal',   text: 'Q  to eat a biscuit and heal', touch: 'Tap TREAT to eat a biscuit and heal',                    when: () => player.hp < maxHp() * 0.45 && player.flasks > 0,       done: () => tut.ate > 0 },
  { id: 'tired',  text: "Out of stamina! Back off and catch your breath",  when: () => player.sta <= 0,                                         limit: 4 },
  { id: 'crit',   text: "Yellow ring: they're off balance. Hit them now for a critical!", when: () => enemies.some(e => e.state === 'recover' && e.punishable && near(e, 3.5)), done: () => tut.crits > 0, limit: 8 },
  { id: 'boss',   text: 'A tainted boss! Bosses chain attacks together, so wait for the yellow ring', when: () => enemies.some(e => e.boss && near(e, 5.5)), limit: 7 },
  { id: 'attack', text: 'CLICK  to chomp toward the mouse', touch: 'Tap CHOMP, or tap where you want to bite',                when: () => enemies.some(e => near(e, 3.5)),                        done: () => tut.strike > 0 },
