<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watson Dog">
<meta name="theme-color" content="#0b0a0c">
<link rel="manifest" href="/game/manifest.webmanifest?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="/game/icon-180.png?v=2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/game/icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/game/icon-192.png?v=2">
<meta name="mobile-web-app-capable" content="yes">
<title>Watson Dog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0a0c; overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #e8e4e0; }
  html, body, button, .overlay { touch-action: manipulation; }   /* no double-tap zoom */
  canvas { display: block; touch-action: none; }
  body.touch { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .panel, .panel * { touch-action: pan-y; }
  /* Phone controls: only shown on touch screens */
  #touch { display: none; }
  body.touch #touch { display: block; }
  .tbtn { position: fixed; border-radius: 50%; border: 2px solid rgba(208,138,69,.8); background: rgba(30,20,16,.6);
    color: #f2e6c8; font: 700 11px system-ui, sans-serif; letter-spacing: .04em; display: flex; flex-direction: column;
    align-items: center; justify-content: center; touch-action: none; -webkit-tap-highlight-color: transparent; padding: 0; }
  .tbtn small { font-weight: 400; font-size: 9px; opacity: .8; }
  .tbtn.off { opacity: .35; }
  .tbtn.cool { background: rgba(10,8,8,.75); }
  .tbtn:active { background: rgba(208,138,69,.5); }
  #tChomp.act { background: rgba(208,138,69,.85); color: #1a120e; }
  #tChomp { width: 86px; height: 86px; right: calc(22px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); font-size: 14px; }
  #tRoll  { width: 64px; height: 64px; right: calc(120px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); }
  #tZoom  { width: 54px; height: 54px; right: calc(118px + env(safe-area-inset-right)); bottom: calc(96px + env(safe-area-inset-bottom)); }
  #tBark  { width: 54px; height: 54px; right: calc(56px + env(safe-area-inset-right)); bottom: calc(124px + env(safe-area-inset-bottom)); }
  #tTreat { width: 54px; height: 54px; right: calc(4px + env(safe-area-inset-right)); bottom: calc(124px + env(safe-area-inset-bottom)); }
  #tPee   { width: 54px; height: 54px; right: calc(194px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); }
  #tPal   { width: 54px; height: 54px; right: calc(180px + env(safe-area-inset-right)); bottom: calc(100px + env(safe-area-inset-bottom)); }
  #tPee.on { background: rgba(242,201,76,.8); color: #1a120e; border-color: #f2c94c; }
  #tPal.hide { display: none; }
  #tPause { width: 40px; height: 40px; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); font-size: 14px; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .7); }
  .overlay.open { display: flex; }
  .panel { background: #1a1517; border: 1px solid #4a3236; border-radius: 10px; padding: 20px 24px;
    width: min(640px, 92vw); max-height: 88vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .panel h1 { margin: 0 0 6px; font-size: 26px; font-family: Georgia, 'Times New Roman', serif; font-weight: normal; }
  .panel h2 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #a08a8c; }
  .panel p { color: #c4b8b6; line-height: 1.5; margin: 6px 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 6px; background: #241d20; margin-bottom: 6px; }
  .row .info { flex: 1; }
  .row .name { font-weight: 600; }
  .row .desc { font-size: 13px; color: #a89c9c; }
  .row .val { font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; font-weight: 600; }
  button { font: inherit; background: #9e2a2b; color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: #b83334; }
  button:disabled { background: #352b2d; color: #7d7072; cursor: default; }
  .xp { color: #f2c94c; font-weight: 600; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .shopHead { display: flex; align-items: center; gap: 12px; }
  kbd { background: #2c2427; border: 1px solid #54424a; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  .title { font-size: 34px !important; line-height: 1.15; color: #f0d9c8; }
  .died { font-family: Georgia, 'Times New Roman', serif; font-size: 64px; color: #b3191c; letter-spacing: .12em; margin: 0 0 10px; }
  #death .panel { background: none; border: 0; box-shadow: none; text-align: center; }
  /* Shop menus: compact on small screens so everything fits and stays readable */
  #shop .panel { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  @media (max-width: 760px), (max-height: 520px) {
    #shop .panel { width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)); max-height: calc(100vh - 16px);
      padding: 10px 12px; border-radius: 8px; box-sizing: border-box; }
    #shop .panel h1 { font-size: 18px; margin: 0; }
    #shop .panel h2 { margin: 5px 0 3px; font-size: 10px; }
    #shopSub { display: none; }
    #shop .xp { font-size: 13px; }
    #shop .row { padding: 4px 8px; gap: 8px; margin-bottom: 4px; }
    #shop .row .name { font-size: 13px; }
    #shop .row .desc { font-size: 11px; line-height: 1.25; }
    #shop .row .val { font-size: 12px; min-width: 18px; }
    #shop button { font-size: 12px; padding: 5px 10px; }
    #shop kbd { font-size: 10px; padding: 0 4px; }
  }
  /* Phones held sideways: two columns of items so you scroll less */
  @media (max-height: 520px) and (orientation: landscape) {
    #shopBody { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; align-items: start; }
    #shopBody h2 { grid-column: 1 / -1; }
    #shopBody .row { margin-bottom: 3px; padding: 3px 8px; }
    #shop .row .desc { font-size: 10.5px; }
    #shop .panel h2 { margin: 4px 0 2px; }
    #shop .panel { padding: 8px 12px; }
  }
  #title { background: radial-gradient(ellipse at center, rgba(20,12,8,.55) 0%, rgba(8,6,6,.92) 75%); cursor: pointer; }
  .logo { display: flex; flex-direction: column; align-items: center; user-select: none; }
  #logoDog { width: min(360px, 70vw); height: auto; margin-bottom: -18px; }
  .logo-text { font-family: 'Luckiest Guy', Impact, 'Arial Black', sans-serif; font-size: clamp(64px, 13vw, 132px); line-height: .9;
    color: #d08a45; -webkit-text-stroke: 4px #3a2210; paint-order: stroke fill; letter-spacing: .03em;
    text-shadow: 0 7px 0 #3a2210, 0 14px 30px rgba(0,0,0,.6); transform: rotate(-3deg); text-align: center; }
  .logo-text span { display: block; color: #c0392b; font-size: .82em; margin-top: 4px; }
  .press { margin-top: 34px; font-family: 'Luckiest Guy', Impact, sans-serif; font-size: 20px; letter-spacing: .14em;
    color: #f2e6c8; opacity: .8; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .iosTip { display: none; margin-top: 18px; font: 13px system-ui, sans-serif; color: #c4b8b6; text-align: center; max-width: 80vw; }
  .iosTip.show { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="touch">
  <button class="tbtn" id="tChomp">CHOMP</button>
  <button class="tbtn" id="tRoll">ROLL</button>
  <button class="tbtn" id="tZoom">ZOOM<small></small></button>
  <button class="tbtn" id="tBark">BARK<small></small></button>
  <button class="tbtn" id="tTreat">TREAT<small></small></button>
  <button class="tbtn" id="tPee">PEE<small></small></button>
  <button class="tbtn hide" id="tPal"><span>PAL</span><small></small></button>
  <button class="tbtn" id="tPause">II</button>
</div>

<div class="overlay open" id="title">
  <div class="logo">
    <canvas id="logoDog" width="720" height="440"></canvas>
    <div class="logo-text">Watson<span>Dog</span></div>
    <div class="press">press any key</div>
    <div class="iosTip" id="iosTip"></div>
  </div>
</div>

<div class="overlay" id="shop">
  <div class="panel">
    <div class="top"><h1 id="shopTitle">Watson's Doghouse</h1><span class="shopHead"><span class="xp" id="shopXp"></span><button id="closeShop">Leave</button></span></div>
    <p id="shopSub"></p>
    <div id="shopBody"></div>
  </div>
</div>

<div class="overlay" id="win">
  <div class="panel" style="text-align:center">
    <h1 class="title">The pollution is lifting!</h1>
    <p>Watson's turf covers the islands, and the plant folk are friendly again. Good boy, Lovebug.</p>
    <p style="margin-top:16px"><button id="keepPlaying">Keep playing</button></p>
  </div>
</div>

<div class="overlay" id="death">
  <div class="panel">
    <div class="died">KNOCKED OUT</div>
    <p id="deathMsg"></p>
    <p style="margin-top:18px"><button id="respawn">Back to the doghouse (R)</button></p>
  </div>
</div>

<script>
// ---------- Setup ----------
const TW = 64, TH = 32;        // isometric tile size in pixels
const MAP = 120;               // map is MAP x MAP tiles (mostly sea, with islands)
const CENTER = MAP / 2;
const SAFE_R = 2.5;            // radius of the safe area around the doghouse (tiles)
const MAX_ENEMIES = 70;
const LOCK_RANGE = 7;          // how far away auto lock-on reaches (tiles)

const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');   // swapped briefly to draw the title-screen logo
let W, H;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let VIEW = 1;   // < 1 zooms out on small (phone) screens
// Notch / rounded-corner insets, so the HUD isn't hidden in landscape full screen.
const safeProbe = document.createElement('div');
safeProbe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
document.body.appendChild(safeProbe);
const SAFE = { l: 0, t: 0 };
function resize() {
  const cs = getComputedStyle(safeProbe);
  SAFE.l = parseFloat(cs.paddingLeft) || 0; SAFE.t = parseFloat(cs.paddingTop) || 0;
  VIEW = clamp(Math.min(innerWidth, innerHeight * 1.6) / 950, 0.62, 1);
  W = canvas.width = Math.round(innerWidth / VIEW); H = canvas.height = Math.round(innerHeight / VIEW);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
}
addEventListener('resize', resize);
resize();

const distC = (x, y) => Math.hypot(x - CENTER, y - CENTER);

// ---------- Game data (tweak these to balance the game) ----------
const WEAPONS = [
  { name: 'Puppy Teeth',   dmg: 10, cost: 0,    color: '#ffffff', verb: 'BITE', type: 'bite',      desc: 'Just your own chompers' },
  { name: 'Fetch Stick',   dmg: 18, cost: 40,   color: '#8a5a2e', verb: 'WHACK', type: 'stick',     desc: 'A really good stick' },
  { name: 'Iron Bone',     dmg: 28, cost: 150,  color: '#a9cc9c', verb: 'BONK', type: 'bone',      desc: 'Heavy, shiny, and great for bonking' },
  { name: 'Razor Frisbee', dmg: 44, cost: 450,  color: '#2ec4b6', verb: 'SLASH', type: 'frisbee',   desc: 'A frisbee with a serrated edge' },
  { name: 'Inferno Bone',  dmg: 68, cost: 1200, color: '#ff7a3a', verb: 'SCORCH', type: 'flamebone', desc: 'A legendary bone that never stops burning' },
  { name: 'Moon Bone',     dmg: 95, cost: 2500, color: '#cfe8ff', verb: 'SMITE', type: 'moonbone',  desc: 'A glowing bone from Fred\'s secret stash' },
];

const SKILLS = [
  { id: 'strike',   key: '1', name: 'Attack',    cost: 0,   cd: 0.7,  sta: 16, lock: 0.32, desc: 'Bite, or swing your fetch gear, toward the mouse (click) or at the locked-on enemy (1 / J).' },
  { id: 'whirl',    key: '2', name: 'Zoomies',   cost: 80,  cd: 4,    sta: 35, lock: 0.5,  short: 'Spin attack that hits everyone around you', desc: 'Tear around in a circle, hitting everyone nearby for 1.3x gear damage.' },
  { id: 'fireball', key: '3', name: 'Mega Bark', cost: 200, cd: 1.6,  sta: 25, lock: 0.4,  short: 'Flying bark blast, 35 damage', desc: 'A bark so loud it flies. Blasts an area for 35 damage (scales with Bark Power).' },
];
const CRIT_MULT = 2;   // damage bonus for hitting an enemy right after it attacks
const ROLL_STA = 22;
const RUN_MULT = 1.75, RUN_STA = 22;   // run speed multiplier, stamina per second while running

// Stats you raise when you level up.
const STATS = [
  { id: 'vig', name: 'Vigor',     desc: '+12 max HP' },
  { id: 'end', name: 'Endurance', desc: '+10 max stamina' },
  { id: 'str', name: 'Jaw Strength', desc: '+7% chomp and gear damage' },
  { id: 'arc', name: 'Bark Power',   desc: '+10% Mega Bark damage' },
  { id: 'bla', name: 'Bladder',      desc: '+8 pee (bigger turf loops)' },
];
const levelCost = lvl => Math.floor(30 * 1.16 ** (lvl - 1));

// Regular enemies: friendly plant folk turned mean by pollution.
// windup = seconds of warning before the hit, reach = size of the red danger circle,
// staggers = whether your hits interrupt their attack. s = drawing scale, look = how they're drawn.
const ENEMY_TYPES = [
  { name: 'Sproutling',       lvl: 1,  hp: 10,  dmg: 14, speed: 1.6, xp: 6,   r: 0.26, h: 30, s: 1,    look: 'sprout',    color: '#8fbf4f', tier: 0,  windup: 0.66, reach: 0.45, recover: 0.7, staggers: true,  aggro: 4.0 },
  { name: 'Thornbush',        lvl: 3,  hp: 30,  dmg: 20, speed: 2.1, xp: 20,  r: 0.3,  h: 32, s: 1,    look: 'thorn',     color: '#3f6e2e', tier: 1,  windup: 0.54, reach: 0.6,  recover: 0.55, staggers: true, aggro: 5.0 },
  { name: 'Toxic Toadstool',  lvl: 6,  hp: 55,  dmg: 30, speed: 1.8, xp: 60,  r: 0.34, h: 46, s: 1.1,  look: 'toadstool', color: '#8e3b9e', tier: 2,  windup: 0.84,  reach: 0.85, recover: 0.8, staggers: false, aggro: 5.5 },
  { name: 'Smog Oak',         lvl: 10, hp: 110, dmg: 50, speed: 1.3, xp: 180, r: 0.45, h: 72, s: 1.1,  look: 'oak',       color: '#6b4a2e', tier: 3,  windup: 1.2,  reach: 1.1,  recover: 1.2, staggers: false, aggro: 6.0 },
];

// Dog friends: lost pups tangled in polluted vines around town. Free one and it joins you.
// Watson brings one friend along at a time (swap at the doghouse). kind 'ability' = a passive power,
// kind 'attack' = a special move on its own button. ox/oy = where it's found (tiles from the doghouse),
// home = where it lounges in the yard once saved. Bond grows as you knock out plants together (3 levels).
const FRIENDS = [
  { id: 'splash', name: 'Splash', breed: 'Labrador', ox: -12, oy: 8, home: [0.9, -1.7], kind: 'ability', power: 'swim',
    short: 'Loves water, so Watson can swim too', thanks: 'Woof! Thanks! Ooh, is that a pond?',
    look: { fur: '#e3b968', light: '#f3d9a4', dark: '#c2954a', saddle: null, collar: '#2e86de', s: 1 } },
  { id: 'boomer', name: 'Boomer', breed: 'Bulldog', ox: 40, oy: -10, home: [-0.9, -1.8], kind: 'attack', move: 'pound', verb: 'POUND',
    moveName: 'Ground Pound', cd: 6, dmg: 40, short: 'Belly-flops on plants and knocks them off balance', thanks: "Hrmph. Thanks, pal. I'll wait at your place.",
    look: { fur: '#b98a5e', light: '#f2ead8', dark: '#6e4c30', saddle: null, bw: 1.15, leg: 0.75, collar: '#8e44ad', s: 0.95 } },
  { id: 'scout', name: 'Scout', breed: 'German Shepherd', ox: 31, oy: 0, home: [1.9, 0.9], kind: 'ability', power: 'lookout',
    short: 'Keeps watch while you pee. Plants back off', thanks: "Thanks! I'll keep an eye out for you.",
    look: { fur: '#c08038', light: '#d9a462', dark: '#2a2018', saddle: '#2a2018', earUp: true, collar: '#27ae60', s: 1.08 } },
  { id: 'frost', name: 'Frost', breed: 'Husky', ox: -23, oy: 37, home: [-1.7, -0.5], kind: 'attack', move: 'howl', verb: 'HOWL',
    moveName: 'Frost Howl', cd: 9, dmg: 12, short: 'A chilly howl that freezes nearby plants (free critical hits)', thanks: 'Awooo! You found me!',
    look: { fur: '#8d96a3', light: '#f1f3f6', dark: '#4f5763', saddle: '#6f7885', belly: true, earUp: true, eye: '#5ab4ff', collar: '#e74c3c', s: 1.05 } },
  { id: 'zip', name: 'Zip', breed: 'Greyhound', ox: -12, oy: 30, home: [-0.7, 2.1], kind: 'ability', power: 'zoom',
    short: 'Run as long as you like, and a bit faster', thanks: 'Zoom zoom! Race you home!',
    look: { fur: '#c9a27a', light: '#e6cfb2', dark: '#8a6a4a', saddle: null, bw: 0.9, leg: 1.25, collar: '#f39c12', s: 1.02 } },
  { id: 'ember', name: 'Ember', breed: 'Dalmatian', ox: -29, oy: -30, home: [1.3, 1.8], kind: 'attack', move: 'fetch', verb: 'FETCH',
    moveName: 'Fire Fetch', cd: 4, dmg: 45, short: 'Throws a flaming ball. Fred likes her (she is warm)', thanks: "Phew! It's toasty out here. Thanks!",
    look: { fur: '#f4f1ea', light: '#ffffff', dark: '#222222', saddle: null, spots: true, collar: '#c0392b', s: 1 } },
];
for (const f of FRIENDS) Object.assign(f, { cdBase: f.cd || 0, x: CENTER + f.ox, y: CENTER + f.oy, walk: 0, moving: false, fx: 1, fy: 0, cd: 0, act: null, z: 0, helpT: rand(2, 6) });

// The world is islands in the sea. Watson starts on Home Island and hates water, so he can't leave
// until he frees Splash, who loves to swim. x/y = centre (tiles from the doghouse), R = size,
// tier = how tough the plants are (Home Island is easy near the doghouse, harder near its shore).
const ISLANDS = [
  { name: 'Home Island',   ox: 0,   oy: 0,   R: 17,  tier: 0, ground: [56, 112, 52] },
  { name: 'Suburb Isle',   ox: 36,  oy: -6,  R: 13,  tier: 2, ground: [96, 128, 70] },
  { name: 'Downtown Isle', ox: -18, oy: 33,  R: 14,  tier: 2, ground: [116, 116, 122] },
  { name: 'Pound Isle',    ox: -26, oy: -27, R: 13,  tier: 3, ground: [70, 62, 66] },
  { name: 'islet', ox: 18,  oy: 20, R: 3.5, tier: 2, ground: [110, 138, 78] },
  { name: 'islet', ox: 40,  oy: 26, R: 4,   tier: 2, ground: [110, 138, 78] },
  { name: 'islet', ox: -40, oy: 4,  R: 3,   tier: 2, ground: [110, 138, 78] },
].map((isl, k) => ({ ...isl, x: CENTER + isl.ox, y: CENTER + isl.oy, p1: k * 1.7, p2: k * 2.9 + 1, p3: k * 0.6 + 2 }));
// Wobbly coastline: island radius in a given direction.
const coastR = (isl, a) => isl.R * (1 + 0.07 * Math.sin(3 * a + isl.p1) + 0.04 * Math.sin(5 * a + isl.p2) + 0.02 * Math.sin(11 * a + isl.p3));
const islandAt = (x, y) => ISLANDS.find(isl => Math.hypot(x - isl.x, y - isl.y) < coastR(isl, Math.atan2(y - isl.y, x - isl.x)));
const inWater = (x, y) => !islandAt(x, y);
// Plant toughness at a spot.
const tierAt = (x, y) => { const isl = islandAt(x, y); return !isl ? 0 : isl === ISLANDS[0] ? (distC(x, y) < 9 ? 0 : 1) : isl.tier; };

// Outfits and armor, sold by Fred. One per slot; change them at the doghouse.
// armor = damage taken reduced by this much, speed / roll / dmg = multipliers. No numbers = just for style.
const OUTFITS = [
  { id: 'redcollar',     slot: 'neck', name: 'Red Collar',       cost: 0,    desc: "Watson's trusty collar" },
  { id: 'bandana',       slot: 'neck', name: 'Blue Bandana',     cost: 60,   desc: 'Looks sharp. Just for style' },
  { id: 'expresscollar', slot: 'neck', name: 'Express Collar',   cost: 220,  desc: 'Rolling costs 30% less stamina', roll: 0.7 },
  { id: 'spikecollar',   slot: 'neck', name: 'Spiked Collar',    cost: 400,  desc: '+10% bite and gear damage', dmg: 1.1 },
  { id: 'partyhat',      slot: 'head', name: 'Party Hat',        cost: 40,   desc: 'Just for style' },
  { id: 'cowboy',        slot: 'head', name: 'Cowboy Hat',       cost: 120,  desc: 'Yeehaw. Just for style' },
  { id: 'helmet',        slot: 'head', name: 'Knight Helmet',    cost: 350,  desc: 'Take 10% less damage', armor: 0.1 },
  { id: 'raincoat',      slot: 'body', name: 'Raincoat',         cost: 90,   desc: "Still won't go in the water. Just for style" },
  { id: 'cape',          slot: 'body', name: 'Hero Cape',        cost: 250,  desc: 'Move 8% faster', speed: 1.08 },
  { id: 'thorncoat',     slot: 'body', name: 'Thornproof Coat',  cost: 500,  desc: 'Take 20% less damage', armor: 0.2 },
  { id: 'knight',        slot: 'body', name: 'Knight Armor',     cost: 1100, desc: 'Take 35% less damage, but 10% slower', armor: 0.35, speed: 0.9 },
  { id: 'rainboots',     slot: 'feet', name: 'Rain Boots',       cost: 70,   desc: 'Just for style' },
  { id: 'sneakers',      slot: 'feet', name: 'Squeaky Sneakers', cost: 300,  desc: 'Move 15% faster', speed: 1.15 },
];

function toScreen(x, y) {

function toWorld(sx, sy) {
  const rx = sx - W / 2 + cam.x, ry = sy - H / 2 + cam.y;

    if (saved.has(f.id)) continue;
    for (let k = 0, tries = 0; k < 2 && tries < 20; tries++) {
      const a = rand(0, Math.PI * 2), r = rand(1.5, 2.6), x = f.x + Math.cos(a) * r, y = f.y + Math.sin(a) * r;
      if (!okSpot(x, y)) continue;
      enemies.push(makeEnemy(pickType(tierAt(f.x, f.y)), x, y)); k++;
    }
  }
  for (let i = 0; i < maxEnemies(); i++) spawnEnemy();
}
populate();

// ---------- Player actions ----------
const canAct = () => !player.dead && !player.roll && player.hitstun <= 0 && player.drink <= 0 && player.attackLock <= 0 && !player.chew && !player.scene;

function spendSta(n) {
  if (player.sta <= 0) return false;   // like Souls: any stamina left lets you act
  player.sta = Math.max(0, player.sta - n);
  player.staDelay = 0.6;
  return true;
}

function moveDir() {
  let ix = 0, iy = 0;
  if (keys.a || keys.arrowleft) ix--;
  if (keys.d || keys.arrowright) ix++;
  if (keys.w || keys.arrowup) iy--;
  if (keys.s || keys.arrowdown) iy++;
  if (!ix && !iy && joy.mag > 0.2) { ix = joy.dx; iy = joy.dy; }
  if (!ix && !iy) return null;
  // Keys are screen directions; convert to world directions.
  const wx = ix / TW + iy / TH, wy = iy / TH - ix / TW, l = Math.hypot(wx, wy);
  return { x: wx / l, y: wy / l };
}

function startRoll() {
  if (!canAct() || !spendSta(ROLL_STA * gearMult('roll'))) return;
  const d = moveDir() || player.face;
  player.roll = { t: 0.4, x: d.x, y: d.y };
  tut.rolls++;
}
const invulnerable = () => (player.roll && player.roll.t > 0.05 && player.roll.t < 0.38) || player.grace > 0;

function drinkFlask() {
  if (!canAct() || player.flasks <= 0) return;
  player.flasks--;
  player.drink = 0.8;   // you're stuck eating for a moment, so pick your timing
  tut.ate++;
}

// aim: a world direction (mouse attacks), or omitted to aim at the locked-on enemy.
function useSkill(id, aim) {
  if (paused) return;
  if (player.scene) { player.scene.t = Math.max(player.scene.t, SCENE_END); return; }   // tap to skip the belly rubs
  const it = id === 'strike' && interactTarget();
  if (it === 'rest') { startRest(); return; }
  if (it === 'fred') { toggleShop('fred'); return; }
  if (it === 'free') { startChew(lostFriendNear()); return; }
  if (!canAct() || !player.skills.has(id) || cooldowns[id] > 0) return;
  const s = SKILLS.find(s => s.id === id);
  if (!spendSta(s.sta)) return;
  const p = player;
  if (aim) { p.face = aim; p.aimT = 0.5; } else { p.aimT = 0; faceTarget(); }
  cooldowns[id] = s.cd;
  tut[id]++;
  p.attackLock = s.lock;   // you're committed until the swing finishes
  if (id === 'strike') {
    const range = 1.3, ang = Math.atan2(p.face.y, p.face.x);
    p.swing = p.swingMax;
    effects.push({ type: 'arc', x: p.x, y: p.y, ang, range, t: 0.15, max: 0.15, color: WEAPONS[p.weapon].color });
    for (const e of enemies) {
      const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
      if (d > range + e.r) continue;
      let diff = Math.abs(Math.atan2(dy, dx) - ang);
      if (diff > Math.PI) diff = 2 * Math.PI - diff;
      if (diff < Math.PI / 3 || d < 0.4) hurtEnemy(e, weaponDmg());
    }
  } else if (id === 'whirl') {
    const range = 1.9;
    p.whirl = 0.4;
    effects.push({ type: 'ring', x: p.x, y: p.y, range, t: 0.3, max: 0.3, color: '#9fd4ff' });
    for (const e of enemies)
      if (Math.hypot(e.x - p.x, e.y - p.y) < range + e.r) hurtEnemy(e, Math.round(weaponDmg() * 1.3));
  } else if (id === 'fireball') {
    projectiles.push({ x: p.x + p.face.x * 0.4, y: p.y + p.face.y * 0.4, vx: p.face.x * 8, vy: p.face.y * 8, life: 1.3 });
  }
}

// Peeing: toggle on, then walk. Outside your turf you leave a trail; loop back to your turf
// (or close the loop on itself) and everything inside becomes yours. Get hit and the trail is lost.
function togglePee() {
  if (paused || player.dead || player.scene) return;
  if (player.pee && trail.length) clearTrail();
  player.pee = !player.pee && player.bladder > 0;
  if (player.pee) tut.peeOn++;
}
function clearTrail() { trail = []; trailMark.fill(0); }
// Add a point to the trail and mark the cells under it. Returns true if it covered a new cell.
function addTrailPoint(x, y) {
  const last = trail[trail.length - 1];
  let fresh = false;
  const mark = (px, py) => { const c = cellAt(px, py); if (!trailMark[c]) { trailMark[c] = 1; fresh = true; } };
  if (last) {
    const d = Math.hypot(x - last.x, y - last.y);
    if (d < 0.1) return false;
    for (let k = 1, n = Math.ceil(d / 0.15); k <= n; k++) mark(last.x + (x - last.x) * k / n, last.y + (y - last.y) * k / n);
  } else mark(x, y);
  trail.push({ x, y });
  return fresh;
}
// Flood fill from the edge of the map. Anything the fill can't reach (walled in by turf and
// the trail) is enclosed. If anything is enclosed, or force is set (trail reached the turf), claim it.
function tryClaim(force) {
  const seen = new Uint8Array(N * N), q = new Int32Array(N * N);
  let qn = 0;
  const push = c => { if (!seen[c] && !turf[c] && !trailMark[c]) { seen[c] = 1; q[qn++] = c; } };
  for (let k = 0; k < N; k++) { push(k); push(k + (N - 1) * N); push(k * N); push(k * N + N - 1); }
  for (let qi = 0; qi < qn; qi++) {
    const c = q[qi], i = c % N;
    if (i > 0) push(c - 1);
    if (i < N - 1) push(c + 1);
    if (c >= N) push(c - N);
    if (c < N * (N - 1)) push(c + N);
  }
  let enclosed = 0;
  for (let c = 0; c < N * N; c++) if (!turf[c] && !trailMark[c] && !seen[c]) enclosed++;
  if (!enclosed && !force) return;
  let gained = 0;
  for (let c = 0; c < N * N; c++) if (!turf[c] && landCell[c] && (trailMark[c] || !seen[c])) { turf[c] = 1; gained++; }
  turfCount += gained;
  clearTrail();
  dirtyChunks();
  if (gained < 3) return;
  tut.claims++;
  // Plants caught inside the new turf are purified.
  let xp = Math.round(gained * 0.75), purified = 0;
  for (const e of enemies) if (e.hp > 0 && isTurf(e.x, e.y)) {
    xp += e.xp; e.hp = 0; purified++;
    effects.push({ type: 'ring', x: e.x, y: e.y, range: e.r * 2.5, t: 0.6, max: 0.6, color: '#9be37a', fill: true });
  }
  player.xp += xp;
  floatText(player.x, player.y, `Turf! +${xp} XP`, '#f2c94c', 1.8);
  if (purified) floatText(player.x, player.y - 0.6, purified > 1 ? `${purified} plants purified` : 'Plant purified', '#9be37a', 2);
  effects.push({ type: 'ring', x: player.x, y: player.y, range: 1.6, t: 0.6, max: 0.6, color: '#f2c94c', fill: true });
  if (Math.random() < 0.5) speak('jackie', pick(JACKIE_TURF));
  if (turfFrac() >= WIN_TURF && !won) { won = true; setTimeout(() => openOverlay('win'), 1200); }
}
function loseTrail() {
  if (!trail.length) return;
  clearTrail();
  trailLostT = time;
  effects.push({ type: 'ring', x: player.x, y: player.y, range: 0.9, t: 0.4, max: 0.4, color: '#f2c94c' });
}
function updatePee(dt, moved) {
  const p = player;
  if (!p.pee) {   // the bladder refills slowly, faster on your own turf
    p.bladder = Math.min(maxPee(), p.bladder + (isTurf(p.x, p.y) ? 4 : 1) * dt);
    return;
  }
  if (isTurf(p.x, p.y)) {
    if (trail.length) { addTrailPoint(p.x, p.y); tryClaim(true); }
    lastTurfPt = { x: p.x, y: p.y };
    p.bladder = Math.min(maxPee(), p.bladder + 4 * dt);
    return;
  }
  if (p.swimming) {   // the water washes the trail away
    if (trail.length) { clearTrail(); floatText(p.x, p.y, 'Washed away', '#9fd4ff', 1.2); }
    return;
  }
  if (!trail.length && lastTurfPt && Math.hypot(lastTurfPt.x - p.x, lastTurfPt.y - p.y) < 1) addTrailPoint(lastTurfPt.x, lastTurfPt.y);
  if (addTrailPoint(p.x, p.y)) tryClaim(false);
  p.bladder -= moved;
  if (p.bladder <= 0) {   // ran dry before closing the loop
    p.bladder = 0; p.pee = false;
    loseTrail();
    floatText(p.x, p.y, 'Out of pee!', '#f2c94c', 1.4);
  }
}

// Freeing a lost dog: Watson chews through the polluted vines. Getting hit interrupts him.
function startChew(f) {
  if (!f || !canAct()) return;
  player.chew = { f, t: 1.1 };
}
function saveFriend(f) {
  saved.add(f.id);
  effects.push({ type: 'ring', x: f.x, y: f.y, range: 1.4, t: 0.7, max: 0.7, color: '#9be37a', fill: true });
  floatText(f.x, f.y, `${f.name} is free!`, '#9be37a', 2.2);
  speak(f.id, f.thanks);
  if (!player.buddy) player.buddy = f.id;   // the first friend comes straight along
  else f.homeRun = true;                    // others wait at the doghouse
}

// The friend's special move (attack friends only). Only ever hits polluted plants.
function palMove() {
  const f = buddy(), p = player;
  if (paused || p.dead || p.scene || !f || f.kind !== 'attack' || f.cd > 0 || f.act) return;
  tut.pal++;
  updateTarget();
  const lvl = bondLvl(f.id), dmg = Math.round(f.dmg * [1, 1.4, 1.8][lvl - 1]);
  f.cd = f.cdBase * [1, 0.85, 0.7][lvl - 1];
  const tx = target ? target.x : p.x + p.face.x * 1.8, ty = target ? target.y : p.y + p.face.y * 1.8;
  const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1;
  f.fx = dx / d; f.fy = dy / d;
  if (f.move === 'pound') f.act = { type: 'leap', t: 0, max: 0.55, sx: f.x, sy: f.y, tx, ty, dmg };
  else if (f.move === 'howl') {
    f.act = { type: 'howl', t: 0, max: 0.7 };
    effects.push({ type: 'ring', x: f.x, y: f.y, range: 2.6, t: 0.6, max: 0.6, color: '#bfe8ff', fill: true });
    for (const e of enemies) if (Math.hypot(e.x - f.x, e.y - f.y) < 2.6 + e.r) {
      hurtEnemy(e, dmg, f.x, f.y);
      if (e.hp > 0) Object.assign(e, { state: 'recover', t: 3, frozen: 3, punishable: true, kx: 0, ky: 0 });
    }
  } else if (f.move === 'fetch') {
    f.act = { type: 'throw', t: 0, max: 0.3 };
    projectiles.push({ x: f.x + f.fx * 0.3, y: f.y + f.fy * 0.3, vx: f.fx * 7, vy: f.fy * 7, life: 1.3, kind: 'fire', dmg });
  }
}
function updateFriends(dt) {
  const p = player;
  for (const f of FRIENDS) {
    f.cd = Math.max(0, f.cd - dt);
    if (!saved.has(f.id)) {   // lost: whimpers now and then when Watson is close
      f.helpT -= dt;
      if (f.helpT <= 0 && Math.hypot(p.x - f.x, p.y - f.y) < 7) { speak(f.id, pick(['Help!', 'Arf! Over here!', '*whimper*', "I'm stuck!"])); f.helpT = rand(7, 11); }
      continue;
    }
    let gx, gy, spd;
    if (p.buddy === f.id) {
      if (f.act) {
        f.act.t += dt;
        const k = Math.min(1, f.act.t / f.act.max);
        if (f.act.type === 'leap') {
          f.x = lerp(f.act.sx, f.act.tx, k); f.y = lerp(f.act.sy, f.act.ty, k); f.z = Math.sin(k * Math.PI) * 34;
          if (k >= 1) {   // belly flop!
            f.z = 0;
            effects.push({ type: 'ring', x: f.x, y: f.y, range: 1.6, t: 0.45, max: 0.45, color: '#e8c37a', fill: true });
            for (const e of enemies) if (Math.hypot(e.x - f.x, e.y - f.y) < 1.6 + e.r) {
              hurtEnemy(e, f.act.dmg, f.x, f.y);
              if (e.hp > 0 && !e.frozen) Object.assign(e, { state: 'recover', t: 1.1, punishable: true });
            }
          }
        }
        if (k >= 1) f.act = null;
        f.moving = false;
        continue;
      }
      // Trot along just behind Watson.
      gx = p.x - p.face.x * 0.8 + p.face.y * 0.45; gy = p.y - p.face.y * 0.8 - p.face.x * 0.45;
      spd = Math.max(p.speed * 1.25, Math.hypot(gx - f.x, gy - f.y) * 2.5);
      if (Math.hypot(gx - f.x, gy - f.y) > 8) { f.x = gx; f.y = gy; }
    } else {
      // Lounging in the yard.
      gx = CENTER + f.home[0]; gy = CENTER + f.home[1];
      spd = f.homeRun ? 4.5 : 2.5;
    }
    const dx = gx - f.x, dy = gy - f.y, d = Math.hypot(dx, dy);
    f.moving = d > 0.3;
    if (f.moving) {
      const st = Math.min(d, spd * dt);
      f.x += dx / d * st; f.y += dy / d * st; f.walk += st * 9; f.fx = dx / d; f.fy = dy / d;
    } else {
      f.homeRun = false;
      if (p.buddy === f.id) { const tx = p.x - f.x, ty = p.y - f.y, td = Math.hypot(tx, ty) || 1; f.fx = tx / td; f.fy = ty / td; }
    }
  }
}

// Resting at the doghouse: Watson licks Jackie, then flops over for belly rubs. Tap to skip.
const SCENE_LICK = 1.2, SCENE_END = 3.0;
const SCENE_SPOT = { x: CENTER + 2.05, y: CENTER - 0.2 };   // just in front of Jackie
function startRest() {
  if (player.scene || !canAct() || paused) return;
  player.scene = { t: 0, rub: false, heartT: 0.4 };
  speak('jackie', pick(JACKIE_LICK));
}
function updateScene(dt) {
  const p = player, sc = p.scene;
  sc.t += dt;
  const k = Math.min(1, dt * 7);
  p.x += (SCENE_SPOT.x - p.x) * k; p.y += (SCENE_SPOT.y - p.y) * k;
  p.face = { x: -0.98, y: -0.18 };
  if (sc.t > SCENE_LICK && !sc.rub) { sc.rub = true; speak('jackie', pick(JACKIE_RUB)); }
  sc.heartT -= dt;
  if (sc.heartT <= 0) { floatText(p.x + rand(-0.2, 0.2), p.y + rand(-0.2, 0.2), '♥', '#ff7aa8', 1); sc.heartT = 0.3; }
  if (sc.t >= SCENE_END) {
    p.scene = null;
    p.hp = maxHp(); p.bladder = maxPee();
    shopMode = 'rest'; shopOpenedAt = performance.now();
    openOverlay('shop');
  }
}

// ---------- Combat ----------
function explode(pr) {
  const fire = pr.kind === 'fire', range = fire ? 1.3 : 1.2, { x, y } = pr;
  effects.push({ type: 'ring', x, y, range, t: 0.35, max: 0.35, color: fire ? '#ff9a3a' : '#9fd4ff', fill: true });
  for (const e of enemies) if (Math.hypot(e.x - x, e.y - y) < range + e.r) hurtEnemy(e, fire ? pr.dmg : fireballDmg(), x, y);
}

function hurtEnemy(e, dmg, fromX = player.x, fromY = player.y) {
  if (e.hp <= 0) return;
  const crit = e.state === 'recover' && e.punishable;
  if (crit) { dmg = Math.round(dmg * CRIT_MULT); tut.crits++; }
  e.hp -= dmg;
  e.flash = 0.12;
  if (e.state === 'windup' && e.staggers) { e.state = 'recover'; e.t = 0.45; e.punishable = false; e.comboLeft = (e.combo || 1) - 1; }
  else if (e.state === 'idle' || e.state === 'return') e.state = 'chase';
  const dx = e.x - fromX, dy = e.y - fromY, d = Math.hypot(dx, dy) || 1;
  const kb = e.staggers ? 2.5 : 0.6;
  e.kx += dx / d * kb; e.ky += dy / d * kb;
  floatText(e.x, e.y, crit ? `${dmg}!` : dmg, crit ? '#ffd25a' : '#fff', crit ? 1.1 : 0.8);
  if (e.hp <= 0) {
    player.xp += e.xp;
    kills++;
    floatText(e.x, e.y, `+${e.xp} XP`, '#f2c94c', 1.2);
    effects.push({ type: 'ring', x: e.x, y: e.y, range: e.r * 2, t: 0.3, max: 0.3, color: e.color, fill: true });
    // Friendship grows as you fight side by side.
    const b = buddy();
    if (b) {
      const before = bondLvl(b.id);
      bondKills[b.id] = (bondKills[b.id] || 0) + 1;
      if (bondLvl(b.id) > before) { floatText(b.x, b.y, `${b.name} ${stars(b.id)}`, '#f2c94c', 2.2); speak(b.id, 'We make a great team!'); }
    }
  }
}

function hurtPlayer(dmg, fromX, fromY) {
  const p = player;
  if (invulnerable()) return;
  dmg = Math.round(dmg * armorMult());
  p.chew = null;      // getting hit stops Watson chewing a friend free
  if (p.pee) loseTrail();   // and washes away the pee trail
  p.hp -= dmg;
  p.flash = 0.15;
  p.hitstun = 0.3;
  p.grace = 0.35;
  p.drink = 0;   // getting hit interrupts eating (the biscuit is wasted)
  const dx = p.x - fromX, dy = p.y - fromY, d = Math.hypot(dx, dy) || 1;
  if (!inWater(p.x + dx / d * 0.35, p.y + dy / d * 0.35) || hasPower('swim')) {
    p.x = clamp(p.x + dx / d * 0.35, 0.3, MAP - 0.3);
    p.y = clamp(p.y + dy / d * 0.35, 0.3, MAP - 0.3);
  }
  floatText(p.x, p.y, `-${dmg}`, '#ff6b6b');
  if (p.hp <= 0) die();
}

function die() {
  const p = player;
  p.hp = 0;
  p.dead = true;
  clearTrail(); p.pee = false; p.chew = null; p.scene = null;
  const lostOld = bloodstain ? bloodstain.xp : 0;
  bloodstain = p.xp > 0 ? { x: p.x, y: p.y, xp: p.xp } : null;
  p.xp = 0;
  let msg = bloodstain
    ? `Your ${bloodstain.xp} XP lies where you fell, marked by a glowing bone. Reach it before you're knocked out again.`
    : 'You had no XP to lose.';
  if (lostOld) msg += ` The ${lostOld} XP you dropped last time is lost forever.`;
  overlay('deathMsg').textContent = msg;
  openOverlay('death');
}

function respawn() {
  if (!player.dead) return;
  Object.assign(player, { dead: false, x: CENTER, y: CENTER + 1.6, hp: maxHp(), sta: maxSta(),
    flasks: player.maxFlasks, roll: null, hitstun: 0, drink: 0, grace: 0, attackLock: 0, aimT: 0, swing: 0, whirl: 0, bladder: maxPee(), shake: 0 });
  const b = buddy();
  if (b) { b.x = player.x - 0.7; b.y = player.y + 0.3; b.act = null; b.z = 0; }
  populate();   // every monster comes back when you die
  projectiles = []; effects = []; floaters = []; target = null;
  overlay('death').classList.remove('open');
  paused = false;
  speak('jackie', pick(JACKIE_HURT));
}

function floatText(x, y, text, color, life = 0.8) {
  floaters.push({ x, y, z: 30, text: String(text), color, t: life, max: life, dx: rand(-6, 6) });
}

// Lock on to the nearest enemy, but don't flicker between two that are about equally close.
function updateTarget() {
  const p = player;
  let best = null, bestD = LOCK_RANGE;
  for (const e of enemies) {
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d < bestD) { best = e; bestD = d; }
  }
  if (target && target.hp > 0 && enemies.includes(target)) {
    const cur = Math.hypot(target.x - p.x, target.y - p.y);
    if (cur < LOCK_RANGE + 1 && (!best || cur < bestD + 0.6)) return;
  }
  target = best;
}

function faceTarget() {
  const p = player;
  updateTarget();
  if (target) {
    const dx = target.x - p.x, dy = target.y - p.y, d = Math.hypot(dx, dy) || 1;
    p.face = { x: dx / d, y: dy / d };
  }
}

// ---------- Update ----------
// Move a body by (dx, dy), but stop at the water's edge (sliding along it) unless it can swim.
// Returns true if water got in the way.
function moveBody(o, dx, dy, swim) {
  const wet = (x, y, ax, ay) => { const l = Math.hypot(ax, ay) || 1; return inWater(x + ax / l * 0.22, y + ay / l * 0.22); };
  if (swim || inWater(o.x, o.y) || !wet(o.x + dx, o.y + dy, dx, dy)) { o.x += dx; o.y += dy; return false; }
  if (dx && !wet(o.x + dx, o.y, dx, 0)) o.x += dx;
  else if (dy && !wet(o.x, o.y + dy, 0, dy)) o.y += dy;
  return true;
}

function update(dt) {
  const p = player;
  if (p.scene) updateScene(dt);
  if (p.chew) {   // chewing a friend free of the vines
    const f = p.chew.f, dx = f.x - p.x, dy = f.y - p.y, d = Math.hypot(dx, dy) || 1;
    p.face = { x: dx / d, y: dy / d };
    p.chew.t -= dt;
    if (p.chew.t <= 0) { p.chew = null; saveFriend(f); }
  }
  const busy = p.scene || p.chew;

  // Face the locked-on enemy, unless you just attacked toward the mouse.
  const md = busy ? null : moveDir();
  p.aimT = Math.max(0, p.aimT - dt);
  if (!busy) { if (p.aimT > 0) updateTarget(); else faceTarget(); }
  if (!target && md && !p.roll && p.aimT <= 0) p.face = md;

  // Movement
  const ox = p.x, oy = p.y, swim = hasPower('swim');
  let bumped = false;
  p.running = false;
  if (p.roll) {
    p.roll.t -= dt;
    bumped = moveBody(p, p.roll.x * 7 * dt, p.roll.y * 7 * dt, swim);
    if (p.roll.t <= 0) p.roll = null;
  } else if (md && p.hitstun <= 0) {
    let spd = p.speed * gearMult('speed') * (p.drink > 0 ? 0.35 : p.attackLock > 0 ? 0.3 : 1);
    if (p.pee && trail.length) spd *= PEE_SPEED;
    if (p.swimming) spd *= swimMult();
    const zoom = hasPower('zoom');
    if (zoom) spd *= zoomMult();
    if ((keys.shift || joy.mag > 0.92) && p.sta > 0 && p.drink <= 0 && p.attackLock <= 0) {   // phones: push the stick all the way
      p.running = true;
      tut.ran += dt;
      spd *= RUN_MULT;
      if (!zoom) { p.sta = Math.max(0, p.sta - RUN_STA * dt); p.staDelay = 0.5; }
      if (!target && p.aimT <= 0) p.face = md;
    }
    bumped = moveBody(p, md.x * spd * dt, md.y * spd * dt, swim);
  }
  p.x = clamp(p.x, 0.3, MAP - 0.3); p.y = clamp(p.y, 0.3, MAP - 0.3);
  p.swimming = inWater(p.x, p.y);
  if (p.swimming) tut.swum += dt;
  // Watson hates water: bump into it and he shakes his head and refuses.
  p.shake = Math.max(0, p.shake - dt); p.shakeCd = Math.max(0, p.shakeCd - dt);
  if (bumped && p.shakeCd <= 0) { p.shake = 0.8; p.shakeCd = 2; tut.shakes++; }
  const moved = Math.hypot(p.x - ox, p.y - oy);
  tut.moved += moved;
  tut.playT += dt;
  p.moving = moved > 0.0005 && !p.roll && !p.scene;
  p.walk += moved * 9;
  p.whirl = Math.max(0, p.whirl - dt);
  if (!p.dead) updatePee(dt, moved);
  updateFriends(dt);

  for (const k in cooldowns) cooldowns[k] = Math.max(0, cooldowns[k] - dt);
  p.flash = Math.max(0, p.flash - dt);
  p.swing = Math.max(0, p.swing - dt);
  p.hitstun = Math.max(0, p.hitstun - dt);
  p.attackLock = Math.max(0, p.attackLock - dt);
  p.grace = Math.max(0, p.grace - dt);
  if (p.drink > 0) {
    p.drink -= dt;
    if (p.drink <= 0) {
      const amt = Math.round(maxHp() * 0.6);
      p.hp = Math.min(maxHp(), p.hp + amt);
      floatText(p.x, p.y, `+${amt}`, '#7dff9a');
      effects.push({ type: 'ring', x: p.x, y: p.y, range: 0.8, t: 0.4, max: 0.4, color: '#f2c94c' });
    }
  }

  // Stamina regenerates after a short pause.
  p.staDelay -= dt;
  if (p.staDelay <= 0 && !p.roll) p.sta = Math.min(maxSta(), p.sta + 50 * dt);

  // The doghouse heals you and refills your biscuits. No other natural healing.
  const atHome = distC(p.x, p.y) < SAFE_R;
  if (atHome) { p.hp = Math.min(maxHp(), p.hp + maxHp() * 0.25 * dt); p.flasks = p.maxFlasks; p.bladder = maxPee(); }
  else if (isTurf(p.x, p.y) && p.hp < maxHp()) p.hp = Math.min(maxHp(), p.hp + maxHp() * 0.02 * dt);   // home turf: slow healing
  // Jackie greets Watson when he gets back from an outing.
  if (distC(p.x, p.y) > SAFE_R + 4) awayFromHome = true;
  if (atHome && awayFromHome) { awayFromHome = false; speak('jackie', pick(JACKIE_HOME)); }
  // Fred mutters to himself when Watson is nearby. He perks up for anything warm.
  fredChatT -= dt;
  if (fredChatT <= 0 && Math.hypot(p.x - FRED.x, p.y - FRED.y) < 2.8) {
    speak('fred', pick(WEAPONS[p.weapon].type === 'flamebone' || p.buddy === 'ember' ? FRED_WARM : FRED_IDLE));
    fredChatT = rand(20, 30);
  }

  // Recover your lost XP.
  if (bloodstain && Math.hypot(bloodstain.x - p.x, bloodstain.y - p.y) < 0.6) {
    p.xp += bloodstain.xp;
    floatText(p.x, p.y, `Recovered ${bloodstain.xp} XP`, '#f2c94c', 1.6);
    bloodstain = null;
  }

  // Enemies
  for (const e of enemies) {
    e.flash = Math.max(0, e.flash - dt);
    e.atkCd = Math.max(0, e.atkCd - dt);
    e.frozen = Math.max(0, e.frozen - dt);
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 0.001;
    // Plants leave Watson alone at the doghouse, and back off from Scout while Watson pees.
    const playerSafe = distC(p.x, p.y) < SAFE_R + 0.3 || (hasPower('lookout') && p.pee && d < lookoutR());
    const strikeDist = e.r + p.r + e.reach;

    if ((e.state === 'idle' || e.state === 'return') && !playerSafe && d < e.aggro) e.state = 'chase';
    if (e.state === 'chase' && (playerSafe || d > e.aggro * 1.8)) e.state = 'return';

    let mx = 0, my = 0, spd = e.speed;
    if (e.state === 'chase') {
      if (d < strikeDist * 0.85 && e.atkCd <= 0) { e.state = 'windup'; e.t = e.tMax = e.windup; }
      else if (d > e.r + p.r + 0.1) { mx = dx / d; my = dy / d; }
    } else if (e.state === 'windup') {
      e.t -= dt;
      if (e.t <= 0) {
        effects.push({ type: 'ring', x: e.x, y: e.y, range: e.r + e.reach, t: 0.25, max: 0.25, color: '#ff4040', fill: true });
        if (d < strikeDist) hurtPlayer(e.dmg, e.x, e.y);
        if (e.comboLeft > 0) {
          // Chain straight into another, faster attack. No opening between combo hits.
          e.comboLeft--;
          e.state = 'windup'; e.t = e.tMax = e.windup * 0.65;
        } else {
          e.comboLeft = (e.combo || 1) - 1;
          e.state = 'recover'; e.t = e.recover; e.punishable = true;
        }
      }
    } else if (e.state === 'recover') {
      e.t -= dt;
      if (e.t <= 0) { e.state = 'chase'; e.atkCd = rand(0.2, 0.9); }
    } else if (e.state === 'return') {
      const hx = e.homeX - e.x, hy = e.homeY - e.y, hd = Math.hypot(hx, hy);
      if (hd < 0.3 || e.stuckT > 6) { e.state = 'idle'; e.hp = e.maxHp; e.homeX = e.x; e.homeY = e.y; e.stuckT = 0; } else { mx = hx / hd; my = hy / hd; e.stuckT = (e.stuckT || 0) + dt; }
    } else {
      e.wanderT -= dt;
      if (e.wanderT <= 0) { e.tx = e.homeX + rand(-2, 2); e.ty = e.homeY + rand(-2, 2); e.wanderT = rand(2, 5); }
      const tx = e.tx - e.x, ty = e.ty - e.y, td = Math.hypot(tx, ty);
      if (td > 0.1) { mx = tx / td; my = ty / td; spd *= 0.4; }
    }
    moveBody(e, (mx * spd + e.kx) * dt, (my * spd + e.ky) * dt, false);
    e.kx *= 0.85; e.ky *= 0.85;
    // Animation: walk cycle and which way they're facing.
    e.moving = mx || my;
    e.walk += Math.hypot(mx, my) * spd * dt * 9;
    if (e.state === 'chase' || e.state === 'windup' || e.state === 'recover') { e.fx = dx / d; e.fy = dy / d; }
    else if (e.moving) { e.fx = mx; e.fy = my; }

    // Keep enemies on the map and away from the doghouse.
    e.x = clamp(e.x, 0.3, MAP - 0.3); e.y = clamp(e.y, 0.3, MAP - 0.3);
    const cd = distC(e.x, e.y), minD = SAFE_R + e.r;
    if (cd < minD) { e.x = CENTER + (e.x - CENTER) / cd * minD; e.y = CENTER + (e.y - CENTER) / cd * minD; }
    if (p.dead) break;
  }
  // Push overlapping enemies apart.
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (d > 0 && d < min) {
      const push = (min - d) / 2;
      a.x -= dx / d * push; a.y -= dy / d * push;
      b.x += dx / d * push; b.y += dy / d * push;
    }
  }

  // Projectiles
  for (const pr of projectiles) {
    pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.life -= dt;
    const hit = enemies.some(e => e.hp > 0 && Math.hypot(e.x - pr.x, e.y - pr.y) < e.r + 0.15);
    if (hit || pr.life <= 0 || pr.x < 0 || pr.y < 0 || pr.x > MAP || pr.y > MAP) { explode(pr); pr.life = -1; }
  }
  projectiles = projectiles.filter(pr => pr.life > 0);
  enemies = enemies.filter(e => e.hp > 0);
  if (target && target.hp <= 0) target = null;

  // Slowly bring monsters back over time.
  spawnTimer -= dt;
  if (spawnTimer <= 0 && enemies.length < maxEnemies()) { spawnEnemy(); spawnTimer = 8; }

  for (const f of effects) f.t -= dt;
  effects = effects.filter(f => f.t > 0);
  for (const f of floaters) { f.t -= dt; f.z += 40 * dt; }
  for (const k in speech) speech[k].t -= dt;
  floaters = floaters.filter(f => f.t > 0);
}

// ---------- Drawing ----------
// clean = part of Watson's turf: no pollution, fresh green grass.
function tileColor(i, j, clean) {
  const x = i + 0.5, y = j + 0.5, d = distC(x, y);
  const n = ((i * 73856093) ^ (j * 19349663)) & 7;   // cheap per-tile variation
  const shade = (n - 3.5) * 2 - ((i + j) % 2) * 4;
  const isl = islandAt(x, y) || ISLANDS.reduce((a, b) => Math.hypot(x - a.x, y - a.y) / a.R < Math.hypot(x - b.x, y - b.y) / b.R ? a : b);
  let [r, g, b] = d < SAFE_R ? [128, 104, 72] : isl.ground;   // Watson's yard is dirt
  if (clean && d >= SAFE_R) { r = lerp(r, 84, 0.5); g = lerp(g, 168, 0.5); b = lerp(b, 70, 0.5); }
  else if (!clean) {
    // Pollution: a sickly purple tint, worse on the tougher islands.
    const smog = [0.03, 0.12, 0.24, 0.4][tierAt(x, y)];
    r = lerp(r, 92, smog); g = lerp(g, 64, smog); b = lerp(b, 110, smog);
  }
  return `rgb(${Math.round(r + shade)},${Math.round(g + shade)},${Math.round(b + shade)})`;
}

// The ground is drawn in square chunks of CH x CH tiles, each cached in its own small canvas
// (one canvas for the whole map would be too big for phones). Chunks redraw when the turf changes.
const CH = 12, NCH = Math.ceil(MAP / CH), SEA = '#2a6fa6', SHALLOW = '#3b8cc2', SAND = '#d8c48e';
const chunks = new Map();
const dirtyChunks = () => { for (const c of chunks.values()) c.dirty = true; };
const chunkOrigin = (ci, cj) => ({ x: (ci * CH - cj * CH - CH) * TW / 2, y: (ci * CH + cj * CH) * TH / 2 });
function coastPath(g, isl, grow) {
  g.moveTo(isl.x + coastR(isl, 0) + grow, isl.y);
  for (let k = 1; k <= 72; k++) { const a = k / 72 * Math.PI * 2, r = coastR(isl, a) + grow; g.lineTo(isl.x + Math.cos(a) * r, isl.y + Math.sin(a) * r); }
  g.closePath();
}
function renderChunk(ci, cj, c) {
  c.dirty = false;
  const g = c.canvas.getContext('2d'), o = chunkOrigin(ci, cj);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, c.canvas.width, c.canvas.height);
  g.setTransform(TW / 2, TH / 2, -TW / 2, TH / 2, -o.x, -o.y);   // draw in world (tile) units
  const x0 = ci * CH, y0 = cj * CH, x1 = x0 + CH, y1 = y0 + CH;
  g.save();
  g.beginPath(); g.rect(x0, y0, CH, CH); g.clip();
  const near = ISLANDS.filter(isl => isl.x + isl.R * 1.3 + 2 > x0 && isl.x - isl.R * 1.3 - 2 < x1 && isl.y + isl.R * 1.3 + 2 > y0 && isl.y - isl.R * 1.3 - 2 < y1);
  if (!near.length) { g.restore(); c.empty = true; return; }
  g.fillStyle = SHALLOW; g.beginPath(); for (const isl of near) coastPath(g, isl, 1.4); g.fill();
  g.fillStyle = SAND; g.beginPath(); for (const isl of near) coastPath(g, isl, 0.45); g.fill();
  g.beginPath(); for (const isl of near) coastPath(g, isl, 0); g.clip();
  for (let i = x0; i < x1; i++) for (let j = y0; j < y1; j++) { g.fillStyle = tileColor(i, j); g.fillRect(i - 0.01, j - 0.01, 1.02, 1.02); }
  const cs = 1 / G;
  for (let cy = y0 * G; cy < y1 * G; cy++) for (let cx = x0 * G; cx < x1 * G; cx++) {
    if (!turf[cx + cy * N]) continue;
    g.fillStyle = tileColor(Math.floor(cx / G), Math.floor(cy / G), true);
    g.fillRect(cx * cs - 0.01, cy * cs - 0.01, cs + 0.02, cs + 0.02);
  }
  g.strokeStyle = 'rgba(0,0,0,.14)'; g.lineWidth = 0.035;   // tile grid
  g.beginPath();
  for (let k = 0; k <= CH; k++) { g.moveTo(x0 + k, y0); g.lineTo(x0 + k, y1); g.moveTo(x0, y0 + k); g.lineTo(x1, y0 + k); }
  g.stroke();
  // Edge of Watson's turf
  g.strokeStyle = 'rgba(255,226,120,.7)'; g.lineWidth = 0.06;
  g.beginPath();
  const T = (cx, cy) => cx >= 0 && cy >= 0 && cx < N && cy < N && turf[cx + cy * N];
  for (let cy = y0 * G; cy < y1 * G; cy++) for (let cx = x0 * G; cx < x1 * G; cx++) {
    if (!T(cx, cy)) continue;
    const x = cx * cs, y = cy * cs;
    if (!T(cx - 1, cy)) { g.moveTo(x, y); g.lineTo(x, y + cs); }
    if (!T(cx + 1, cy)) { g.moveTo(x + cs, y); g.lineTo(x + cs, y + cs); }
    if (!T(cx, cy - 1)) { g.moveTo(x, y); g.lineTo(x + cs, y); }
    if (!T(cx, cy + 1)) { g.moveTo(x, y + cs); g.lineTo(x + cs, y + cs); }
  }
  g.stroke();
  g.restore();
  c.empty = false;
}
function drawTiles() {
  ctx.fillStyle = SEA; ctx.fillRect(0, 0, W, H);
  const o0 = toScreen(0, 0);
  for (let ci = 0; ci < NCH; ci++) for (let cj = 0; cj < NCH; cj++) {
    const o = chunkOrigin(ci, cj), sx = Math.round(o0.x + o.x), sy = Math.round(o0.y + o.y);
    if (sx > W || sy > H || sx + CH * TW < 0 || sy + CH * TH < 0) continue;
    const key = ci + cj * NCH;
    let c = chunks.get(key);
    if (!c) {
      if (chunks.size >= 24) {   // forget the chunk farthest from the camera
        let far = null, fd = -1;
        for (const [k, v] of chunks) { const d = Math.hypot(v.sx - sx, v.sy - sy); if (d > fd) { fd = d; far = k; } }
        chunks.delete(far);
      }
      const canvas = document.createElement('canvas');
      canvas.width = CH * TW; canvas.height = CH * TH;
      c = { canvas, dirty: true };
      chunks.set(key, c);
    }
    c.sx = sx; c.sy = sy;
    if (c.dirty) renderChunk(ci, cj, c);
    if (!c.empty) ctx.drawImage(c.canvas, sx, sy);
  }
  // Sparkles on the sea
  const tl = toWorld(0, 0), br = toWorld(W, H), tr = toWorld(W, 0), bl = toWorld(0, H);
  const ax = Math.floor(Math.min(tl.x, bl.x)), bx = Math.ceil(Math.max(tr.x, br.x)), ay = Math.floor(Math.min(tl.y, tr.y)), by = Math.ceil(Math.max(bl.y, br.y));
  ctx.strokeStyle = 'rgba(220,240,255,.45)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = ax - (ax % 3 + 3) % 3; i < bx; i += 3) for (let j = ay - (ay % 3 + 3) % 3; j < by; j += 3) {
    const h = ((i * 73856093) ^ (j * 19349663)) >>> 0, x = i + (h % 100) / 100 * 3, y = j + ((h >> 8) % 100) / 100 * 3;
    if (!inWater(x, y) || (h & 1)) continue;
    const s = toScreen(x, y), l = 3 + Math.sin(time * 2 + h) * 2.5;
    ctx.moveTo(s.x - l, s.y); ctx.lineTo(s.x + l, s.y);
  }
  ctx.stroke();
  ctx.lineWidth = 1;
}

// The pee trail: a wet yellow line on the ground.
function drawTrail() {
  if (!trail.length) return;
  ctx.lineCap = ctx.lineJoin = 'round';
  for (const [w, c] of [[6, 'rgba(214,176,40,.75)'], [2.5, 'rgba(255,240,150,.8)']]) {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.beginPath();
    trail.forEach((pt, k) => { const s = toScreen(pt.x, pt.y); k ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
    const s = toScreen(player.x, player.y); ctx.lineTo(s.x, s.y);
    ctx.stroke();
  }
  ctx.lineWidth = 1; ctx.lineCap = ctx.lineJoin = 'butt';
}

function groundEllipse(x, y, r) {
  const s = toScreen(x, y);
  ctx.beginPath();
  ctx.ellipse(s.x, s.y, r * TW * 0.707, r * TH * 0.707, 0, 0, Math.PI * 2);
}

function shadow(x, y, r) {
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  groundEllipse(x, y, r);
  ctx.fill();
}

function drawTelegraph(e) {
  // Red danger circle that fills up as the attack is about to land.
  const prog = 1 - e.t / e.tMax;
  const R = e.r + e.reach;
  ctx.strokeStyle = 'rgba(255,60,60,.8)';
  ctx.lineWidth = 2;
  groundEllipse(e.x, e.y, R); ctx.stroke();
  ctx.fillStyle = `rgba(255,40,40,${0.15 + prog * 0.3})`;
  groundEllipse(e.x, e.y, R * prog); ctx.fill();
  ctx.lineWidth = 1;
}

// ---------- Character art ----------
// Characters are drawn from simple shapes in a local space: origin between the feet,
// facing right, about 40 units tall at scale 1. They're mirrored when facing left.
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
function mix(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const lighten = (c, t) => mix(c, '#ffffff', t), darken = (c, t) => mix(c, '#000000', t);

// While drawing a character, P() turns its colours white (hit flash) or red (winding up).
let paintMode = null;
const P = c => paintMode === 'flash' ? '#ffffff' : paintMode === 'tint' ? mix(c, '#ff3a2a', 0.55) : paintMode === 'ice' ? mix(c, '#bfe8ff', 0.6) : c;
function fill(c) { ctx.fillStyle = P(c); ctx.fill(); }
const lerp = (a, b, t) => a + (b - a) * t;

// Which way a world-space facing vector points on screen.
function screenFacing(fx, fy) { return { flip: fx - fy < 0, back: fx + fy < -0.35 }; }

// ----- Watson -----
// Things Watson carries in his mouth. Drawn with the mouth at the origin, pointing forward (+x).
function drawBone(x0, x1, c) {
  ctx.beginPath(); ctx.roundRect(x0, -1.6, x1 - x0, 3.2, 1.2); fill(c);
  for (const x of [x0, x1]) for (const y of [-1.8, 1.8]) { ctx.beginPath(); ctx.arc(x, y, 2.3, 0, Math.PI * 2); fill(c); }
}
function drawDogItem(type, color, biting) {
  if (type === 'bite') {
    if (!biting) return;
    ctx.beginPath();   // a big flash of teeth
    for (let i = 0; i < 4; i++) { ctx.moveTo(-2 + i * 2.5, -2); ctx.lineTo(-0.8 + i * 2.5, 1.5); ctx.lineTo(0.4 + i * 2.5, -2); }
    fill('#ffffff');
  } else if (type === 'stick') {
    ctx.beginPath(); ctx.roundRect(-11, -1.4, 26, 2.8, 1.4); fill(color);
    ctx.save(); ctx.translate(8, -1); ctx.rotate(-0.7); ctx.beginPath(); ctx.roundRect(0, -0.8, 6, 1.6, 0.8); fill(color); ctx.restore();
  } else if (type === 'bone') {
    drawBone(-9, 13, color);
  } else if (type === 'frisbee') {
    ctx.beginPath(); ctx.ellipse(8, 0, 9, 3.2, 0, 0, Math.PI * 2); fill(color);
    ctx.beginPath(); ctx.ellipse(8, -0.6, 6, 1.8, 0, 0, Math.PI * 2); fill(lighten(color, 0.35));
    for (const x of [-1, 3, 8, 13, 17]) { ctx.beginPath(); ctx.moveTo(x - 1.3, 2.4); ctx.lineTo(x, 5); ctx.lineTo(x + 1.3, 2.4); fill('#d9dde2'); }
  } else if (type === 'moonbone') {
    ctx.shadowColor = '#9fd4ff'; ctx.shadowBlur = 14;
    drawBone(-9, 13, color);
    ctx.shadowBlur = 0;
    for (let i = 0; i < 3; i++) {   // sparkles
      const a = time * 3 + i * 2.1, x = 2 + Math.cos(a) * 11, y = Math.sin(a) * 5;
      ctx.beginPath(); ctx.arc(x, y, 0.9 + (i % 2) * 0.5, 0, Math.PI * 2); fill('#ffffff');
    }
  } else if (type === 'flamebone') {
    ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = 12;
    drawBone(-9, 13, color);
    ctx.shadowBlur = 0;
    for (let i = 0; i < 4; i++) {
      const x = -8 + i * 6.5, f = Math.sin(time * 14 + i * 2) * 1.5;
      ctx.beginPath(); ctx.moveTo(x - 2, -2); ctx.quadraticCurveTo(x, -9 + f, x + 2, -2); fill('#ffd25a');
    }
  }
}

// How a dog looks: fur colours, saddle patch (undefined = Watson's small patch, null = none),
// spots, pointy ears, body width (bw), leg length (leg), eye colour, light belly, collar colour, size (s).
const WATSON_LOOK = { fur: '#cc7a2e', light: '#e8b47c', dark: '#8e4c1a', collar: '#c0392b', s: 1 };
const COLLARS = { redcollar: '#c0392b', expresscollar: '#2e86de', spikecollar: '#2a2a2e', bandana: '#2e6fd8' };
const COATS = { raincoat: ['#f4c20d', '#d9a800'], thorncoat: ['#3d5a3a', '#7a5028'], knight: ['#b8c2cc', '#7f8a96'] };

// o: { flip, walk, moving, running, attack (0..1 while attacking, else -1), item, color, eating,
//      look (default Watson), wear (Watson's outfit), shake (shaking off water), lick, pee, howl }
const DOG_SCALE = 1.3;
function drawDog(sx, sy, o) {
  const L = o.look || WATSON_LOOK, wear = o.wear || {};
  const fur = L.fur, light = L.light, dark = L.dark, bw = L.bw || 1, legL = L.leg || 1, S = DOG_SCALE * (L.s || 1);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(o.flip ? -S : S, S);
  const sw = o.moving ? Math.sin(o.walk) * (o.running ? 0.9 : 0.6) : 0;
  const bob = o.moving ? Math.abs(Math.cos(o.walk)) * (o.running ? 2.2 : 1.3) : Math.sin(time * 2.5) * 0.4;
  const by = -2 - 13 * legL - bob;
  const boot = (near) => near ? '#f4c20d' : '#c99e08';
  const leg = (x, a, c, near) => {
    const len = 13 * legL + bob;
    ctx.save(); ctx.translate(x, by + 3); ctx.rotate(a);
    ctx.beginPath(); ctx.roundRect(-1.9, -1, 3.8, len, 1.9); fill(c);
    if (wear.feet === 'rainboots') { ctx.beginPath(); ctx.roundRect(-2.2, len - 6, 4.4, 6, 1.4); fill(boot(near)); }
    const paw = wear.feet === 'sneakers' ? (near ? '#f4f4f4' : '#cfcfcf') : wear.feet === 'rainboots' ? boot(near) : darken(c, 0.15);
    ctx.beginPath(); ctx.ellipse(0.8, len - 1, wear.feet ? 3 : 2.6, wear.feet ? 1.9 : 1.6, 0, 0, Math.PI * 2); fill(paw);
    if (wear.feet === 'sneakers') { ctx.beginPath(); ctx.rect(-0.6, len - 2.4, 3, 0.8); fill('#c0392b'); }
    ctx.restore();
  };

  // Hero cape flutters behind everything.
  if (wear.body === 'cape') {
    const fl = Math.sin(time * 9 + o.walk) * 1.5;
    ctx.beginPath(); ctx.moveTo(8, by - 6); ctx.quadraticCurveTo(-4, by - 9 + fl, -16, by - 2 + fl);
    ctx.lineTo(-13, by + 5 - fl); ctx.quadraticCurveTo(-2, by + 1, 7, by - 2); ctx.closePath(); fill('#c0392b');
  }

  // Tail wags faster when moving.
  const wag = Math.sin(time * (o.moving ? 16 : 9)) * 0.45;
  ctx.save(); ctx.translate(-11.5 * bw, by - 3); ctx.rotate(-0.9 + wag);
  ctx.beginPath(); ctx.roundRect(-1.7, -11, 3.4, 12, 1.7); fill(fur);
  ctx.beginPath(); ctx.arc(0, -10.5, 1.8, 0, Math.PI * 2); fill(L.belly ? light : fur);
  ctx.restore();

  leg(-8 * bw, sw, dark, false); leg(9 * bw, -sw, dark, false);   // far legs
  ctx.beginPath(); ctx.ellipse(0, by, 13.5 * bw, 7, 0, 0, Math.PI * 2); fill(fur);
  if (L.belly) { ctx.beginPath(); ctx.ellipse(1, by + 3.2, 10 * bw, 3.4, 0, 0, Math.PI * 2); fill(light); }
  if (L.saddle === undefined) { ctx.beginPath(); ctx.ellipse(-3, by - 3, 5, 2.5, 0.2, 0, Math.PI * 2); fill(darken(fur, 0.12)); }   // saddle patch
  else if (L.saddle) { ctx.beginPath(); ctx.ellipse(-1.5, by - 3.2, 9 * bw, 3.8, 0.08, 0, Math.PI * 2); fill(L.saddle); }
  if (L.spots) for (const [x, y, r] of [[-7, -3, 1.6], [-2, 1, 1.3], [4, -4, 1.5], [8, 0, 1.1], [-10, 1, 1.1], [1, -5, 1]]) { ctx.beginPath(); ctx.arc(x * bw, by + y, r, 0, Math.PI * 2); fill(dark); }
  if (COATS[wear.body]) {   // coats and armor cover the back
    const [c1, c2] = COATS[wear.body];
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, by, 13.5 * bw + 0.6, 7.6, 0, 0, Math.PI * 2); ctx.clip();
    ctx.beginPath(); ctx.rect(-16, by - 9, 25, 10); fill(c1);
    ctx.beginPath(); ctx.rect(-16, by + 0.4, 25, 1.6); fill(c2);
    if (wear.body === 'knight') for (const x of [-9, -4, 1, 6]) { ctx.beginPath(); ctx.rect(x, by - 8, 0.8, 9); fill(c2); }
    if (wear.body === 'raincoat') for (const x of [-6, 0]) { ctx.beginPath(); ctx.arc(x, by - 1.5, 0.8, 0, Math.PI * 2); fill(c2); }
    ctx.restore();
    if (wear.body === 'thorncoat') for (const x of [-9, -5, -1, 3]) { ctx.beginPath(); ctx.moveTo(x - 1.2, by - 6.2); ctx.lineTo(x, by - 9); ctx.lineTo(x + 1.2, by - 6.2); fill(c2); }
  }
  // Near hind leg: lifted while peeing.
  leg(-5.5 * bw, o.pee ? 1.25 : -sw, fur, true); leg(11 * bw, sw, fur, true);   // near legs
  if (o.pee) {   // a little yellow stream
    ctx.strokeStyle = P('#f2d43a'); ctx.lineWidth = 1.4; ctx.setLineDash([2, 1.5]); ctx.lineDashOffset = -time * 30;
    ctx.beginPath(); ctx.moveTo(-6 * bw, by + 4); ctx.quadraticCurveTo(-13, by + 2, -15, 0); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1;
  }

  // Head lunges and tosses during an attack, shakes off water, or reaches up to lick.
  let tilt = 0, lunge = 0;
  if (o.attack >= 0) {
    const t = o.attack;
    tilt = t < 0.3 ? lerp(0, -0.55, t / 0.3) : lerp(-0.55, 0.4, Math.min(1, (t - 0.3) / 0.5));
    lunge = Math.sin(t * Math.PI) * 5;
  }
  if (o.eating) tilt = 0.25 + Math.sin(time * 18) * 0.12;
  if (o.shake) tilt = Math.sin(time * 48) * 0.5;
  if (o.lick) { tilt = -0.5 + Math.sin(time * 16) * 0.12; lunge = 2 + Math.sin(time * 16) * 1.5; }
  if (o.howl) tilt = -0.85;
  ctx.save();
  ctx.translate(10 * bw + lunge, by - 5);
  ctx.rotate(tilt);
  ctx.beginPath(); ctx.ellipse(0, 0, 5, 6, 0.3, 0, Math.PI * 2); fill(fur);                   // neck
  const neck = o.wear ? wear.neck : 'redcollar', cc = o.wear ? COLLARS[neck] : L.collar;
  if (neck) {
    ctx.beginPath(); ctx.roundRect(-3.5, 1, 7, 2.6, 1.2); fill(cc);                            // collar
    if (neck === 'bandana') {
      ctx.beginPath(); ctx.moveTo(-3.2, 3); ctx.lineTo(4.2, 3); ctx.lineTo(1, 9); ctx.closePath(); fill(cc);
      for (const [x, y] of [[-0.5, 4.5], [2, 5], [1, 7]]) { ctx.beginPath(); ctx.arc(x, y, 0.5, 0, Math.PI * 2); fill('#ffffff'); }
    } else if (neck === 'spikecollar') {
      for (const x of [-2.2, 0.4, 3]) { ctx.beginPath(); ctx.moveTo(x - 1, 3.4); ctx.lineTo(x, 5.6); ctx.lineTo(x + 1, 3.4); fill('#d9dde2'); }
    } else {
      if (neck === 'expresscollar') { ctx.beginPath(); ctx.rect(-3.5, 2, 7, 0.6); fill('#ffffff'); }
      ctx.beginPath(); ctx.arc(1.5, 4.6, 1.4, 0, Math.PI * 2); fill('#f2c94c');                // tag
    }
  }
  ctx.beginPath(); ctx.arc(3, -5.5, 6.2, 0, Math.PI * 2); fill(fur);                           // head
  if (L.spots) for (const [x, y, r] of [[0, -8, 1.1], [5, -10, 0.8]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill(dark); }
  ctx.beginPath(); ctx.ellipse(8.8, -3.2, 5.2, 3.3, 0.1, 0, Math.PI * 2); fill(light);       // snout
  if (o.lick) { ctx.beginPath(); ctx.ellipse(12, 0.4 + Math.sin(time * 16) * 1.2, 1.8, 3, -0.4, 0, Math.PI * 2); fill('#ff7a9a'); }   // tongue
  ctx.beginPath(); ctx.ellipse(13.4, -4.3, 1.9, 1.5, 0, 0, Math.PI * 2); fill('#1a1210');     // nose
  if (L.eye) { ctx.beginPath(); ctx.arc(4.8, -7.4, 1.4, 0, Math.PI * 2); fill(L.eye); ctx.beginPath(); ctx.arc(5, -7.4, 0.7, 0, Math.PI * 2); fill('#1a1210'); }
  else { ctx.beginPath(); ctx.arc(4.8, -7.4, 1.3, 0, Math.PI * 2); fill('#1a1210'); }         // eye
  ctx.beginPath(); ctx.arc(5.2, -7.9, 0.45, 0, Math.PI * 2); fill('#ffffff');
  ctx.beginPath(); ctx.ellipse(3.6, -9.3, 2, 0.7, -0.2, 0, Math.PI * 2); fill(dark);         // eyebrow
  const flop = o.shake ? Math.sin(time * 48 + 1) * 0.6 : Math.sin(time * 6 + o.walk) * (o.moving ? 0.25 : 0.08);
  if (L.earUp) {                                                                               // pointy ear
    ctx.save(); ctx.translate(1.2, -10); ctx.rotate(-0.15 + flop * 0.3);
    ctx.beginPath(); ctx.moveTo(-2.6, 1.5); ctx.lineTo(0.2, -6.5); ctx.lineTo(3, 1.5); ctx.closePath(); fill(dark);
    ctx.restore();
  } else {
    ctx.save(); ctx.translate(0.5, -9.5); ctx.rotate(0.35 + flop);                             // floppy ear
    ctx.beginPath(); ctx.moveTo(-1.5, 0); ctx.quadraticCurveTo(-5, 4, -3.5, 10); ctx.quadraticCurveTo(0, 9, 2.2, 1); ctx.closePath(); fill(dark);
    ctx.restore();
  }
  if (wear.head === 'partyhat') {
    ctx.save(); ctx.translate(3.5, -11.2); ctx.rotate(0.15);
    ctx.beginPath(); ctx.moveTo(-3.4, 0); ctx.lineTo(3.4, 0); ctx.lineTo(0, -9); ctx.closePath(); fill('#ff5fa2');
    for (const [x, y] of [[-1, -2.5], [1.2, -4.5], [-0.2, -6.5]]) { ctx.beginPath(); ctx.arc(x, y, 0.6, 0, Math.PI * 2); fill('#ffffff'); }
    ctx.beginPath(); ctx.arc(0, -9, 1.6, 0, Math.PI * 2); fill('#f2c94c');
    ctx.restore();
  } else if (wear.head === 'cowboy') {
    ctx.beginPath(); ctx.roundRect(-1.5, -16.5, 9, 6.5, 2.5); fill('#8a5a2e');
    ctx.beginPath(); ctx.ellipse(3, -10.6, 9.5, 2, -0.05, 0, Math.PI * 2); fill('#8a5a2e');
    ctx.beginPath(); ctx.rect(-1.5, -12.4, 9, 1.3); fill('#3a2210');
  } else if (wear.head === 'helmet') {
    ctx.beginPath(); ctx.ellipse(3, -17, 1.8, 3.4, -0.3, 0, Math.PI * 2); fill('#c0392b');   // plume
    ctx.beginPath(); ctx.arc(3, -8.6, 6.6, Math.PI, Math.PI * 2); fill('#b8c2cc');
    ctx.beginPath(); ctx.rect(-3.6, -9.2, 13.2, 1.6); fill('#7f8a96');
  }
  ctx.save(); ctx.translate(10, -1);
  if (o.eating) {
    ctx.beginPath(); ctx.roundRect(-1, -2, 6, 4, 1.2); fill('#e8b04a');
  } else if (o.item) {
    let ia = 0;
    if (o.attack >= 0) ia = o.attack < 0.3 ? -0.5 : lerp(-0.5, 0.45, Math.min(1, (o.attack - 0.3) / 0.5));
    ctx.rotate(ia);
    drawDogItem(o.item, o.color, o.attack >= 0);
  }
  ctx.restore();
  ctx.restore();
  ctx.restore();
}

// Watson flopped on his back for belly rubs: paws wiggling in the air, tongue out.
function drawDogBellyUp(sx, sy, flip) {
  const L = WATSON_LOOK, fur = L.fur, wig = Math.sin(time * 11);
  ctx.save(); ctx.translate(sx, sy); ctx.scale(flip ? -DOG_SCALE : DOG_SCALE, DOG_SCALE);
  ctx.save(); ctx.translate(-12, -3); ctx.rotate(Math.sin(time * 14) * 0.6 - 1.4);           // tail thumping
  ctx.beginPath(); ctx.roundRect(-1.7, -10, 3.4, 11, 1.7); fill(fur); ctx.restore();
  const legUp = (x, a, c) => {
    ctx.save(); ctx.translate(x, -9); ctx.rotate(a);
    ctx.beginPath(); ctx.roundRect(-1.9, -10, 3.8, 11, 1.9); fill(c);
    ctx.beginPath(); ctx.ellipse(0, -10, 2.5, 1.7, 0, 0, Math.PI * 2); fill(darken(c, 0.15));
    ctx.restore();
  };
  legUp(-7, -0.3 + wig * 0.2, L.dark); legUp(7, 0.3 - wig * 0.2, L.dark);
  ctx.beginPath(); ctx.ellipse(0, -6, 13, 6.5, 0, 0, Math.PI * 2); fill(fur);
  ctx.beginPath(); ctx.ellipse(0, -8.5, 9, 3.2, 0, 0, Math.PI * 2); fill(lighten(fur, 0.12));   // belly (same orange, catching the light)
  legUp(-4, 0.2 - wig * 0.25, fur); legUp(4, -0.2 + wig * 0.25, fur);
  // Head lying on its side, upside down and happy
  ctx.save(); ctx.translate(14, -6); ctx.rotate(0.5);
  ctx.beginPath(); ctx.roundRect(-5, -3, 6, 2.4, 1); fill('#c0392b');                          // collar
  ctx.beginPath(); ctx.arc(2, 0, 6, 0, Math.PI * 2); fill(fur);
  ctx.beginPath(); ctx.ellipse(7, 2.5, 4.6, 3, 0.4, 0, Math.PI * 2); fill(L.light);
  ctx.beginPath(); ctx.ellipse(10, 5, 1.5, 2.8 + Math.sin(time * 9) * 0.4, -0.3, 0, Math.PI * 2); fill('#ff7a9a');   // tongue lolling
  ctx.beginPath(); ctx.ellipse(11, 3.6, 1.7, 1.3, 0, 0, Math.PI * 2); fill('#1a1210');          // nose
  ctx.strokeStyle = P('#1a1210'); ctx.lineWidth = 0.9;                                           // happy closed eye
  ctx.beginPath(); ctx.arc(3.5, 1.5, 1.4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); ctx.lineWidth = 1;
  ctx.save(); ctx.translate(-1, 3); ctx.rotate(-0.6 + wig * 0.15);                                // ear flopped on the ground
  ctx.beginPath(); ctx.moveTo(-1.5, 0); ctx.quadraticCurveTo(-5, 4, -3.5, 9); ctx.quadraticCurveTo(0, 8, 2.2, 1); ctx.closePath(); fill(L.dark);
  ctx.restore();
  ctx.restore();
  ctx.restore();
}

// ----- Townspeople -----
function drawPersonItem(type) {
  if (type === 'newspaper') {
    ctx.beginPath(); ctx.roundRect(-2.2, -2, 4.4, 15, 2); fill('#e8e4d8');
    ctx.beginPath(); ctx.rect(-2.2, 4, 4.4, 1); fill('#9a968a');
    ctx.beginPath(); ctx.rect(-2.2, 8, 4.4, 1); fill('#9a968a');
  } else if (type === 'parcel') {
    ctx.beginPath(); ctx.rect(-5, 0, 10, 8); fill('#b07a45');
    ctx.beginPath(); ctx.rect(-0.8, 0, 1.6, 8); fill('#e0c890');
  } else if (type === 'rake') {
    ctx.beginPath(); ctx.roundRect(-1, -4, 2, 30, 1); fill('#8a6a3a');
    ctx.beginPath(); ctx.rect(-6, 25, 12, 2); fill('#8a8f96');
    for (let x = -5.5; x <= 5.5; x += 2.75) { ctx.beginPath(); ctx.rect(x - 0.4, 27, 0.8, 4); fill('#8a8f96'); }
  } else if (type === 'net') {
    ctx.beginPath(); ctx.roundRect(-1, -4, 2, 30, 1); fill('#5a5e66');
    ctx.beginPath(); ctx.ellipse(0, 32, 7, 6, 0, 0, Math.PI * 2);
    ctx.globalAlpha *= 0.35; fill('#d0d0d0'); ctx.globalAlpha /= 0.35;
    ctx.strokeStyle = P('#3a3e46'); ctx.lineWidth = 1.5; ctx.stroke(); ctx.lineWidth = 1;
  }
}

// o: { s, flip, back, walk, moving, armA (item-arm angle), look, seed, kneel (0..1), bend (lean forward, radians) }
function drawPerson(sx, sy, o) {
  const L = LOOKS[o.look];
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(o.flip ? -o.s : o.s, o.s);
  const sw = o.moving ? Math.sin(o.walk) : 0;
  const bob = o.moving ? Math.abs(Math.cos(o.walk)) * 1.3 : Math.sin(time * 2.2 + (o.seed || 0)) * 0.5;
  const tw = 7 * L.wide, hipY = -14, shY = -26 - bob * 0.5, kneel = o.kneel || 0;
  ctx.translate(0, 6 * kneel);   // kneeling: everything drops, legs fold
  const limb = (x, y, a, len, w, c, end) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.beginPath(); ctx.roundRect(-w, -w, w * 2, len + w, w); fill(c);
    if (end) { ctx.translate(0, len); end(); }
    ctx.restore();
  };
  const shoe = () => { ctx.beginPath(); ctx.ellipse(1.2, 0.5, 3.2 * L.wide, 1.8, 0, 0, Math.PI * 2); fill(L.shoes); };
  const hand = () => { ctx.beginPath(); ctx.arc(0, 0.5, 2.1 * L.wide, 0, Math.PI * 2); fill(L.skin); };

  limb(-1.5, hipY - bob, -sw * 0.55, 13 + bob - 6 * kneel, 2.4 * L.wide, darken(L.legs, 0.2), shoe);   // far leg
  limb(1.5, hipY - bob, sw * 0.55, 13 + bob - 6 * kneel, 2.4 * L.wide, L.legs, shoe);                   // near leg
  if (o.bend) { ctx.translate(0, hipY); ctx.rotate(o.bend); ctx.translate(0, -hipY); }   // lean over from the hips
  limb(-2, shY + 2, 0.35 - sw * 0.5, 10, 2 * L.wide, darken(L.sleeve, 0.2), hand);              // far arm

  // Torso
  ctx.beginPath(); ctx.roundRect(-tw, shY, tw * 2, hipY - shY + 2 - bob, 3 * L.wide); fill(L.body);
  if (L.belly) { ctx.beginPath(); ctx.ellipse(tw * 0.35, hipY - 5 - bob, tw * 0.85, 6.5, 0, 0, Math.PI * 2); fill(lighten(L.body, 0.08)); }
  if (L.stripe) { ctx.beginPath(); ctx.rect(-tw, shY + 6, tw * 2, 2.2); fill(L.stripe); }
  if (L.overalls) { ctx.beginPath(); ctx.roundRect(-tw + 1.5, shY + 3, tw * 2 - 3, hipY - shY - 1 - bob, 2); fill(L.overalls); }
  if (L.badge && !o.back) { ctx.beginPath(); ctx.arc(tw * 0.45, shY + 5, 1.6, 0, Math.PI * 2); fill('#f2c94c'); }
  if (L.bag) {
    ctx.save(); ctx.translate(0, shY + 1); ctx.rotate(0.6);
    ctx.beginPath(); ctx.rect(-1, 0, 2, 16); fill(darken(L.bag, 0.2)); ctx.restore();
    ctx.beginPath(); ctx.roundRect(-tw - 3, hipY - 8 - bob, 8, 7, 1.5); fill(L.bag);
  }

  // Head
  const hr = L.headR, hx = 1, hy = shY - hr + 1.5;
  if (L.longHair) {   // long hair falling past the shoulders, behind the head
    const sway = Math.sin(time * 1.8 + (o.seed || 0)) * 0.6;
    ctx.beginPath();
    if (o.back) ctx.roundRect(hx - hr - 1, hy - hr, hr * 2 + 2, hr * 2 + 3, 4);
    else { ctx.moveTo(hx + 1, hy - hr - 0.5); ctx.quadraticCurveTo(hx - hr - 3, hy - hr, hx - hr - 1.5 + sway, hy + hr + 2.5);
           ctx.lineTo(hx - 0.5 + sway, hy + hr + 1); ctx.quadraticCurveTo(hx - 1, hy + 2, hx + 1, hy - hr - 0.5); }
    fill(L.hair);
    ctx.beginPath(); ctx.moveTo(hx - hr + 1, hy); ctx.quadraticCurveTo(hx - hr - 1 + sway, hy + hr, hx - hr + 0.5 + sway, hy + hr + 2);
    ctx.strokeStyle = P(darken(L.hair, 0.15)); ctx.lineWidth = 0.8; ctx.stroke(); ctx.lineWidth = 1;
  }
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); fill(L.skin);
  if (o.back) { ctx.beginPath(); ctx.arc(hx, hy, hr, Math.PI * 0.85, Math.PI * 2.15); fill(L.hair); }
  else {
    ctx.beginPath(); ctx.arc(hx - 1, hy - 1, hr, Math.PI * 0.95, Math.PI * 1.6); fill(L.hair);
    if (o.tainted) glowEye(hx + hr * 0.45, hy - 0.5, 1.3);                                             // polluted eye
    else { ctx.beginPath(); ctx.arc(hx + hr * 0.45, hy - 0.5, 0.9, 0, Math.PI * 2); fill('#1e1a18'); }
    if (L.grumpy) { ctx.beginPath(); ctx.moveTo(hx + 1, hy - 3.4); ctx.lineTo(hx + hr, hy - 2); ctx.lineTo(hx + hr, hy - 1.2); ctx.lineTo(hx + 1, hy - 2.4); fill('#2a1e18'); }
    ctx.beginPath(); ctx.moveTo(hx + hr - 0.5, hy - 0.5); ctx.lineTo(hx + hr + 1.6, hy + 1.2); ctx.lineTo(hx + hr - 0.5, hy + 1.8); fill(darken(L.skin, 0.12)); // nose
    if (L.mustache) { ctx.beginPath(); ctx.roundRect(hx + hr * 0.3, hy + 2, hr * 0.75, 1.5, 0.7); fill(L.mustache); }
    else { ctx.beginPath(); ctx.rect(hx + hr * 0.45, hy + 2.6, 2, 0.6); fill(L.lips || '#6a3a2a'); }
  }
  if (L.hat === 'cap') {
    ctx.beginPath(); ctx.arc(hx, hy - 1, hr + 0.4, Math.PI, 0); fill(L.hatColor);
    ctx.beginPath(); ctx.roundRect(hx + (o.back ? -hr - 3 : 0), hy - 1.8, hr + 3, 1.8, 0.9); fill(darken(L.hatColor, 0.15));
  } else if (L.hat === 'uniform') {
    ctx.beginPath(); ctx.roundRect(hx - hr - 0.5, hy - hr - 2.5, hr * 2 + 1, 4.5, 1); fill(L.hatColor);
    ctx.beginPath(); ctx.roundRect(hx + (o.back ? -hr - 2.5 : 1), hy - hr + 1.5, hr + 1.5, 1.6, 0.8); fill('#1e1e22');
  } else if (L.hat === 'straw') {
    ctx.beginPath(); ctx.ellipse(hx, hy - hr + 2, hr + 5, 1.8, 0, 0, Math.PI * 2); fill(L.hatColor);
    ctx.beginPath(); ctx.roundRect(hx - hr + 1, hy - hr - 3, hr * 2 - 2, 5, 2); fill(L.hatColor);
    ctx.beginPath(); ctx.rect(hx - hr + 1, hy - hr + 0.2, hr * 2 - 2, 1.2); fill('#b3191c');
  }

  // Near arm holding their item.
  limb(3, shY + 2, o.armA, 10, 2 * L.wide, L.sleeve, () => {
    ctx.rotate(-0.25); drawPersonItem(L.item); ctx.rotate(0.25); hand();
  });
  ctx.restore();
}

// What each townsperson looks like. wide = body width, headR = head size.
const LOOKS = {
