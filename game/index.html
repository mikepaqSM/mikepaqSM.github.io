// Jackie waits by the doghouse and waves when Watson comes home.
function drawJackie() {
  const p = player, s = toScreen(JACKIE.x, JACKIE.y);
  shadow(JACKIE.x, JACKIE.y, 0.25);
  const near = Math.hypot(p.x - JACKIE.x, p.y - JACKIE.y) < 3.5, sc = p.scene;
  const { flip } = screenFacing(p.x - JACKIE.x, p.y - JACKIE.y);
  if (sc) {   // kneeling down for Watson: laughing at his kisses, then rubbing his belly
    const rub = sc.t > SCENE_LICK;
    drawPerson(s.x, s.y, { s: 1.4, flip, back: false, walk: 0, moving: false, seed: 2, look: 'jackie',
      kneel: Math.min(1, sc.t * 4), bend: rub ? 0.5 : 0.12, armA: rub ? -1.05 + Math.sin(time * 11) * 0.3 : -1.7 + Math.sin(time * 5) * 0.15 });
    return;
  }
  drawPerson(s.x, s.y, { s: 1.4, flip, back: false, walk: 0, moving: false, seed: 2,
    armA: near ? -2.9 + Math.sin(time * 8) * 0.35 : -0.3, look: 'jackie' });
}
// Fred: an orange tabby who sits on a crate of goodies beside the doghouse.
function drawFred() {
  const p = player, s = toScreen(FRED.x, FRED.y);
  shadow(FRED.x, FRED.y, 0.45);
  // The crate of wares (not mirrored)
  ctx.save(); ctx.translate(s.x - 14, s.y); ctx.scale(0.8, 0.8);
  ctx.fillStyle = '#9a6a3a'; ctx.fillRect(-11, -14, 18, 14);
  ctx.fillStyle = '#7a5028'; for (const y of [-10, -5]) ctx.fillRect(-11, y, 18, 1.2);
  ctx.fillStyle = '#b07a45'; ctx.fillRect(-11, -15.5, 18, 2.2);
  ctx.save(); ctx.translate(-6, -15); ctx.rotate(-0.5); ctx.fillStyle = '#8a5a2e'; ctx.fillRect(0, -1, 13, 2.2); ctx.restore();   // a stick
  ctx.save(); ctx.translate(1, -17); ctx.rotate(0.35); paintMode = null; drawBone(-3, 4, '#cfe9b4'); ctx.restore();                 // a bone
  ctx.fillStyle = '#2ec4b6'; ctx.beginPath(); ctx.ellipse(-8, -16, 4, 1.4, 0, 0, Math.PI * 2); ctx.fill();                      // a frisbee
  ctx.fillStyle = '#f2e6c8'; ctx.font = 'bold 5px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText("FRED'S", -2, -6.5);
  ctx.restore();

  // The cat
  const { flip } = screenFacing(p.x - FRED.x, p.y - FRED.y);
  const orange = '#f08a24', stripe = '#c4621a', white = '#fbf3e6';
  const shiver = (time % 7) < 1.3 ? Math.sin(time * 70) * 0.5 : 0;   // he gets the shivers now and then
  ctx.save(); ctx.translate(s.x + shiver, s.y); ctx.scale(flip ? -0.85 : 0.85, 0.85);
  const swish = Math.sin(time * 2.2) * 0.35;
  ctx.save(); ctx.translate(-7, -3); ctx.rotate(-1.1 + swish);                                                  // tail
  ctx.beginPath(); ctx.moveTo(-1.6, 0); ctx.quadraticCurveTo(-3, -9, 1, -15); ctx.lineTo(3.4, -14); ctx.quadraticCurveTo(0, -9, 1.6, 0); ctx.closePath();
  ctx.fillStyle = orange; ctx.fill();
  ctx.fillStyle = stripe; for (const y of [-5, -10]) { ctx.beginPath(); ctx.rect(-2.5, y, 4.5, 1.3); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = orange; ctx.beginPath(); ctx.ellipse(0, -10, 8.5, 10, 0, 0, Math.PI * 2); ctx.fill();         // body
  ctx.fillStyle = stripe; for (const a of [-0.9, -0.5, -0.1]) { ctx.beginPath(); ctx.ellipse(-4, -11 + a * 8, 4, 1.1, 0.5, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = white; ctx.beginPath(); ctx.ellipse(4, -9, 4.2, 7, 0, 0, Math.PI * 2); ctx.fill();            // chest
  for (const x of [2.5, 6.5]) { ctx.beginPath(); ctx.ellipse(x, -1.2, 2.4, 1.6, 0, 0, Math.PI * 2); ctx.fill(); } // paws
  // A little knitted scarf (he's always cold)
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.roundRect(-2, -18.5, 13, 4, 2); ctx.fill();
  ctx.save(); ctx.translate(7, -16); ctx.rotate(0.25 + Math.sin(time * 2) * 0.08); ctx.beginPath(); ctx.roundRect(-1.6, 0, 3.4, 9, 1.2); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#f2e6c8'; for (const x of [1, 5]) ctx.fillRect(x, -18.5, 1.3, 4);
  // Head
  const hx = 4, hy = -23;
  ctx.fillStyle = orange;
  for (const [a, b, c] of [[[-2, -4], [-1, -13], [4, -6]], [[4, -6], [9, -13], [10, -3]]]) {                    // ears
    ctx.beginPath(); ctx.moveTo(hx + a[0], hy + a[1]); ctx.lineTo(hx + b[0], hy + b[1]); ctx.lineTo(hx + c[0], hy + c[1]); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#f2a0a8';
  ctx.beginPath(); ctx.moveTo(hx - 0.5, hy - 5); ctx.lineTo(hx - 0.2, hy - 10.5); ctx.lineTo(hx + 2.5, hy - 6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 5.5, hy - 6); ctx.lineTo(hx + 8.2, hy - 10.5); ctx.lineTo(hx + 8.5, hy - 4); ctx.fill();
  ctx.fillStyle = orange; ctx.beginPath(); ctx.arc(hx + 1, hy, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = stripe; for (const x of [-1, 1.5, 4]) { ctx.beginPath(); ctx.rect(hx + x - 0.6, hy - 7, 1.2, 3); ctx.fill(); }
  ctx.fillStyle = white; ctx.beginPath(); ctx.ellipse(hx + 4, hy + 2.5, 4, 2.8, 0, 0, Math.PI * 2); ctx.fill();   // muzzle
  ctx.fillStyle = '#e07080'; ctx.beginPath(); ctx.moveTo(hx + 5, hy + 0.5); ctx.lineTo(hx + 7.4, hy + 0.5); ctx.lineTo(hx + 6.2, hy + 2); ctx.fill();
  const blink = (time % 4.3) < 0.15;
  for (const ex of [1, 5.5]) {
    if (blink) { ctx.fillStyle = '#3a2410'; ctx.fillRect(hx + ex - 1.5, hy - 1.5, 3, 0.7); continue; }
    ctx.fillStyle = '#8ad04a'; ctx.beginPath(); ctx.ellipse(hx + ex, hy - 1.3, 1.6, 1.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a10'; ctx.beginPath(); ctx.ellipse(hx + ex + 0.2, hy - 1.3, 0.45, 1.6, 0, 0, Math.PI * 2); ctx.fill();

  for (const dy of [-0.6, 0.8]) { ctx.beginPath(); ctx.moveTo(hx + 6, hy + 2); ctx.lineTo(hx + 13, hy + 2 + dy * 2); ctx.stroke(); }
  ctx.lineWidth = 1;
  ctx.restore();
}

// ----- Polluted plant monsters -----
// pose: prog = how far into an attack wind-up (0..1), slump = off balance after attacking.
const TOXIC = '#b14cff';
function glowEye(x, y, r) {
  ctx.shadowColor = TOXIC; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill('#e3b8ff');
  ctx.shadowBlur = 0;
}
function angryEyes(x, y, gap, r) {
  for (const dx of [0, gap]) {
    ctx.beginPath(); ctx.arc(x + dx, y, r, 0, Math.PI * 2); fill('#ffffff');
    ctx.beginPath(); ctx.arc(x + dx + r * 0.3, y + r * 0.2, r * 0.55, 0, Math.PI * 2); fill('#2a1030');
  }
  ctx.beginPath(); ctx.moveTo(x - r, y - r * 1.6); ctx.lineTo(x + r, y - r * 0.9); ctx.lineTo(x + r, y - r * 0.4); ctx.lineTo(x - r, y - r * 1.1); fill('#2a1030');
  ctx.beginPath(); ctx.moveTo(x + gap - r, y - r * 0.9); ctx.lineTo(x + gap + r, y - r * 1.6); ctx.lineTo(x + gap + r, y - r * 1.1); ctx.lineTo(x + gap - r, y - r * 0.4); fill('#2a1030');
}
function stubFeet(sw, w, c) {
  for (const k of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(k * w + sw * k * 2, -1.5 + (sw * k > 0 ? -1.5 * Math.abs(sw) : 0), 3.2, 2, 0, 0, Math.PI * 2); fill(c);
  }
}

function drawPlant(sx, sy, e, pose) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(pose.flip ? -e.s : e.s, e.s);
  const sw = e.moving ? Math.sin(e.walk) : 0;
  const bob = e.moving ? Math.abs(Math.cos(e.walk)) * 1.5 : Math.sin(time * 2.4 + e.seed) * 0.6;
  const wig = Math.sin(time * 4 + e.seed);

  if (e.look === 'sprout') {
    stubFeet(sw, 4, '#5d8a2e');
    ctx.rotate(pose.slump ? 0.45 : -0.35 * pose.prog);
    ctx.translate(0, -bob);
    ctx.beginPath(); ctx.ellipse(0, -10, 8.5, 9, 0, 0, Math.PI * 2); fill('#8fbf4f');
    for (const [x, y, r] of [[-4, -6, 1.6], [-1, -15, 1.2], [5, -4, 1.1]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill('#8e44ad'); }
    ctx.beginPath(); ctx.roundRect(-0.8, -25, 1.6, 8, 0.8); fill('#5d8a2e');
    for (const k of [-1, 1]) {
      ctx.save(); ctx.translate(0, -24); ctx.rotate(k * (0.7 + wig * 0.15));
      ctx.beginPath(); ctx.ellipse(0, -4, 2.8, 5, 0, 0, Math.PI * 2); fill(k < 0 ? '#6fa83a' : '#7fb84a');
      ctx.beginPath(); ctx.rect(-0.3, -8, 0.6, 7); fill('#8e44ad');
      ctx.restore();
    }
    angryEyes(1.5, -12, 4.2, 1.7);
    ctx.beginPath(); ctx.arc(4, -5.5, 2, Math.PI * 1.1, Math.PI * 1.9); ctx.strokeStyle = P('#2a1030'); ctx.lineWidth = 1; ctx.stroke();
  } else if (e.look === 'thorn') {
    stubFeet(sw, 5, '#3a5a24');
    ctx.translate(0, -bob);
    const puff = pose.slump ? 0.85 : 1 + pose.prog * 0.2;
    ctx.translate(0, -12); ctx.scale(puff, pose.slump ? 0.8 : puff);
    const spikes = 12, tl = 3 + pose.prog * 5;
    for (let i = 0; i < spikes; i++) {
      const a = (i / spikes) * Math.PI * 2 + wig * 0.05, r = 10.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.15) * r, Math.sin(a - 0.15) * r);
      ctx.lineTo(Math.cos(a) * (r + tl), Math.sin(a) * (r + tl));
      ctx.lineTo(Math.cos(a + 0.15) * r, Math.sin(a + 0.15) * r);
      fill('#c9a0dc');
    }
    for (const [x, y, r, c] of [[-5, 2, 7, '#335a26'], [5, 2, 7, '#335a26'], [0, -4, 8, '#3f6e2e'], [-4, -2, 6, '#4a7a34'], [5, -5, 5, '#4a7a34']]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill(c);
    }
    for (const [x, y] of [[-6, 4], [2, 5], [-1, -9]]) { ctx.beginPath(); ctx.arc(x, y, 1.3, 0, Math.PI * 2); fill('#8e44ad'); }
    glowEye(2, -3, 1.8); glowEye(7, -3, 1.8);
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4, -4.6); ctx.moveTo(9, -6); ctx.lineTo(5, -4.6); ctx.strokeStyle = P('#14200e'); ctx.lineWidth = 1.2; ctx.stroke();
  } else if (e.look === 'toadstool') {
    for (const k of [-1, 1]) { ctx.beginPath(); ctx.roundRect(k * 3 - 2 + sw * k * 2, -6, 4, 6, 2); fill('#cfc2a2'); }
    ctx.translate(0, -bob);
    ctx.beginPath(); ctx.roundRect(-6.5, -26, 13, 22, 5); fill('#e8dcc0');
    angryEyes(0, -18, 4.5, 1.8);
    ctx.beginPath(); ctx.rect(1, -12, 4, 1); fill('#2a1030');
    // Arms
    let armA = e.moving ? -0.4 + sw * 0.3 : -0.4;
    if (pose.prog > 0) armA = lerp(-0.4, -3.1, pose.prog); else if (pose.slump) armA = -0.1;
    for (const [x, a, c] of [[-4, -armA * 0.6 + 0.2, '#cfc2a2'], [4, armA, '#e8dcc0']]) {
      ctx.save(); ctx.translate(x, -20); ctx.rotate(a);
      ctx.beginPath(); ctx.roundRect(-1.8, -1, 3.6, 11, 1.8); fill(c); ctx.restore();
    }
    // Cap: lifts during the wind-up, flops down when off balance.
    const capY = -25 - pose.prog * 4 + (pose.slump ? 3 : 0);
    ctx.beginPath(); ctx.ellipse(0, capY, 16, 11, 0, Math.PI, 0); ctx.closePath(); fill('#8e3b9e');
    ctx.beginPath(); ctx.ellipse(0, capY, 16, 2.5, 0, 0, Math.PI); fill('#6a2a78');
    for (const [x, y, r] of [[-8, -4, 2.4], [0, -8, 2.8], [8, -4, 2.2], [-3, -3, 1.5], [5, -9, 1.4]]) { ctx.beginPath(); ctx.arc(x, capY + y, r, 0, Math.PI * 2); fill('#b6f55a'); }
    if (pose.prog > 0) {   // toxic spores puffing out
      for (let i = 0; i < 6; i++) {
        const a = i + time * 2, rr = 12 + ((time * 10 + i * 5) % 10);
        ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(Math.cos(a) * rr, capY - 4 + Math.sin(a) * rr * 0.4, 1.4, 0, Math.PI * 2); fill('#b6f55a'); ctx.globalAlpha = 1;
      }
    }
  } else if (e.look === 'oak') {
    for (const k of [-1, 1]) {   // root legs
      ctx.save(); ctx.translate(k * 4, -14); ctx.rotate(sw * k * 0.4);
      ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0); ctx.lineTo(4.5, 14); ctx.lineTo(-4.5, 14); ctx.closePath(); fill(k < 0 ? '#4e3420' : '#5e4028');
      ctx.restore();
    }
    ctx.translate(0, -bob);
    let armA = e.moving ? -0.3 + sw * 0.25 : -0.3;
    if (pose.prog > 0) armA = lerp(-0.3, -3.3, pose.prog); else if (pose.slump) armA = 0.1;
    const branch = (x, a, c) => {
      ctx.save(); ctx.translate(x, -36); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(-2.5, 0); ctx.lineTo(2.5, 0); ctx.lineTo(1, 20); ctx.lineTo(-1, 20); ctx.closePath(); fill(c);
      ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(5, 15); ctx.lineTo(4, 16); ctx.lineTo(-0.5, 12); fill(c);
      for (const [lx, ly] of [[0, 21], [5, 16], [-2, 17]]) { ctx.beginPath(); ctx.arc(lx, ly, 3, 0, Math.PI * 2); fill('#5a4a6a'); }
      ctx.restore();
    };
    branch(-6, -armA * 0.5 + 0.3, '#4e3420');
    ctx.beginPath(); ctx.roundRect(-9.5, -44, 19, 32, 4); fill('#6b4a2e');
    for (const x of [-5, 0, 5]) { ctx.beginPath(); ctx.rect(x - 0.5, -42, 1, 26); fill('#553a22'); }
    // Withered canopy with smog drifting off it
    for (const [x, y, r, c] of [[-8, -48, 8, '#4a5a32'], [7, -49, 8, '#4a5a32'], [0, -55, 10, '#56663a'], [-3, -50, 6, '#6a5a7a']]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill(c);
    }
    for (let i = 0; i < 3; i++) {
      const t = (time * 0.5 + i / 3) % 1;
      ctx.globalAlpha = 0.45 * (1 - t);
      ctx.beginPath(); ctx.arc(-4 + i * 4 + Math.sin(t * 6 + i) * 3, -62 - t * 18, 3 + t * 5, 0, Math.PI * 2); fill('#7a6e86');
      ctx.globalAlpha = 1;
    }
    // Carved face
    ctx.beginPath(); ctx.ellipse(-1, -32, 2.6, 3.2, 0, 0, Math.PI * 2); fill('#24160c');
    ctx.beginPath(); ctx.ellipse(6, -32, 2.6, 3.2, 0, 0, Math.PI * 2); fill('#24160c');
    glowEye(-0.5, -31.5, 1.2); glowEye(6.5, -31.5, 1.2);
    ctx.beginPath(); ctx.moveTo(-3, -24); for (let i = 0; i <= 6; i++) ctx.lineTo(-3 + i * 1.8, i % 2 ? -21.5 : -24); ctx.lineTo(8, -20); ctx.lineTo(-3, -20); fill('#24160c');
    branch(6, armA, '#5e4028');
  }
  ctx.restore();
}

function drawEnemy(e) {
  shadow(e.x, e.y, e.r);
  const s = toScreen(e.x, e.y);
  paintMode = e.flash > 0 ? 'flash' : e.frozen > 0 ? 'ice' : e.state === 'windup' && Math.floor(time * 12) % 2 ? 'tint' : null;
  const { flip } = screenFacing(e.fx, e.fy);
  const prog = e.state === 'windup' ? Math.min(1, (1 - e.t / e.tMax) * 1.6) : 0;
  const slump = e.state === 'recover' && e.punishable;
  drawPlant(s.x, s.y, e, { flip, prog, slump });
  paintMode = null;
  if (e.frozen > 0) {   // ice crystals
    ctx.fillStyle = 'rgba(200,235,255,.8)';
    for (let k = 0; k < 3; k++) { const a = k * 2.1 + e.seed; ctx.beginPath(); ctx.arc(s.x + Math.cos(a) * 10 * e.s, s.y - e.h * 0.5 + Math.sin(a) * 8, 2, 0, Math.PI * 2); ctx.fill(); }
  }
  const top = s.y - e.h - 8;
  if (e.hp < e.maxHp || e === target) {
    ctx.fillStyle = '#300'; ctx.fillRect(s.x - 18, top - 2, 36, 4);
    ctx.fillStyle = '#e04848'; ctx.fillRect(s.x - 18, top - 2, 36 * Math.max(0, e.hp) / e.maxHp, 4);
  }
}

function drawPlayer() {
  const p = player;
  shadow(p.x, p.y, p.r + 0.08);
  const s = toScreen(p.x, p.y);
  if (p.grace > 0 && Math.floor(time * 20) % 2) ctx.globalAlpha = 0.5;
  paintMode = p.flash > 0 ? 'flash' : null;
  if (p.roll) {
    // Tucked into a roll: a spinning ball of brown fur.
    const a = (0.4 - p.roll.t) * 18 * (screenFacing(p.roll.x, p.roll.y).flip ? -1 : 1);
    ctx.save(); ctx.translate(s.x, s.y - 13); ctx.scale(DOG_SCALE, DOG_SCALE); ctx.rotate(a);
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); fill('#cc7a2e');
    ctx.beginPath(); ctx.arc(2, 2, 6, 0, Math.PI * 2); fill('#b86a24');
    ctx.beginPath(); ctx.ellipse(-5, -6, 2.5, 5, 0.6, 0, Math.PI * 2); fill('#8e4c1a');
    ctx.beginPath(); ctx.rect(-8, 3, 6, 2.2); fill('#c0392b');
    ctx.restore();
  } else if (p.scene && p.scene.t > SCENE_LICK) {
    drawDogBellyUp(s.x, s.y, screenFacing(p.face.x, p.face.y).flip);
  } else {
    let { flip } = screenFacing(p.face.x, p.face.y);
    if (p.whirl > 0) flip = Math.floor(p.whirl * 20) % 2 === 0;   // zoomies: spinning in circles
    const wpn = WEAPONS[p.weapon];
    const dog = y => drawDog(s.x, y, { flip, walk: p.walk, moving: p.moving || p.whirl > 0, running: p.running || p.whirl > 0,
      attack: p.chew ? (time * 3) % 1 : p.swing > 0 ? 1 - p.swing / p.swingMax : -1, item: wpn.type, color: wpn.color, eating: p.drink > 0,
      wear: p.wear, shake: p.shake > 0, lick: !!p.scene, pee: p.pee && trail.length > 0 && !p.swimming });
    if (p.swimming) swimming(s, dog); else dog(s.y);
    if (p.shake > 0) {   // water droplets flying off his head
      const hx = s.x + (flip ? -17 : 17), hy = s.y - 34;
      ctx.fillStyle = '#9fd4ff';
      for (let k = 0; k < 6; k++) {
        const a = k * 1.05 + time * 3, r = 6 + ((time * 40 + k * 4) % 12);
        ctx.beginPath(); ctx.arc(hx + Math.cos(a) * r, hy + Math.sin(a) * r * 0.6, 1.6, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  paintMode = null;
  ctx.globalAlpha = 1;
}
// Swimming: only the top half shows above the water, with a ripple around it.
function swimming(s, draw) {
  ctx.save();
  ctx.beginPath(); ctx.rect(s.x - 80, s.y - 120, 160, 120); ctx.clip();
  draw(s.y + 10);
  ctx.restore();
  ctx.strokeStyle = 'rgba(220,240,255,.75)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(s.x, s.y, 20 + Math.sin(time * 5) * 2, 6, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1;
}

// Dog friends: lost ones sit tangled in polluted vines; saved ones follow Watson or lounge in the yard.
function drawFriend(f) {
  const s = toScreen(f.x, f.y), lost = !saved.has(f.id);
  shadow(f.x, f.y, 0.3 * f.look.s);
  const { flip } = screenFacing(f.fx, f.fy);
  const a = f.act;
  const dog = y => drawDog(s.x, y - (f.z || 0), { flip, walk: f.walk, moving: f.moving, running: f.moving && player.running,
    attack: a && a.type === 'throw' ? a.t / a.max : -1, look: f.look, howl: (a && a.type === 'howl') || (lost && Math.sin(time * 1.3 + f.ox) > 0.85) });
  if (inWater(f.x, f.y) && !f.z) swimming(s, dog); else dog(s.y);
  if (!lost) return;
  // Thorny purple vines wrapped around them
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#5d3a7a';
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(s.x, s.y - 10 - k * 8, 19 - k * 2, 5, (k - 1) * 0.25, 0, Math.PI * 2); ctx.stroke(); }
  ctx.lineWidth = 1;
  for (let k = 0; k < 8; k++) {
    const an = k * 0.8, x = s.x + Math.cos(an) * 18, y = s.y - 12 - (k % 3) * 8 + Math.sin(an) * 4;
    ctx.fillStyle = k % 2 ? '#c9a0dc' : '#4a7a34';
    ctx.beginPath(); ctx.moveTo(x - 2, y); ctx.lineTo(x, y - 4); ctx.lineTo(x + 2, y); ctx.fill();
  }
  // Freeing progress
  if (player.chew && player.chew.f === f) {
    ctx.strokeStyle = '#9be37a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y - 52, 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - player.chew.t / 1.1)); ctx.stroke();
    ctx.lineWidth = 1;
  }
}

// Watson's doghouse: the safe spot in the middle of town.
function drawDoghouse() {
  const s = toScreen(CENTER, CENTER);
  shadow(CENTER, CENTER, 0.75);
  const x = s.x, y = s.y;
  ctx.fillStyle = '#b5703a';                                                                  // walls
  ctx.beginPath(); ctx.moveTo(x - 24, y - 6); ctx.lineTo(x, y + 6); ctx.lineTo(x + 24, y - 6); ctx.lineTo(x + 24, y - 30); ctx.lineTo(x, y - 18); ctx.lineTo(x - 24, y - 30); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9a5c2e';
  ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.lineTo(x + 24, y - 6); ctx.lineTo(x + 24, y - 30); ctx.lineTo(x, y - 18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a1a12';                                                                  // door
  ctx.beginPath(); ctx.moveTo(x - 16, y - 2); ctx.lineTo(x - 6, y + 3); ctx.lineTo(x - 6, y - 10); ctx.quadraticCurveTo(x - 11, y - 20, x - 16, y - 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#b3191c';                                                                  // roof
  ctx.beginPath(); ctx.moveTo(x - 28, y - 28); ctx.lineTo(x - 2, y - 52); ctx.lineTo(x + 4, y - 15); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8e1416';
  ctx.beginPath(); ctx.moveTo(x - 2, y - 52); ctx.lineTo(x + 28, y - 28); ctx.lineTo(x + 4, y - 15); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f2e6c8'; ctx.font = 'bold 8px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.save(); ctx.translate(x - 12, y - 23); ctx.transform(1, 0.45, 0, 1, 0, 0); ctx.fillText('WATSON', 0, 0); ctx.restore();
  // Food bowl
  const b = toScreen(CENTER + 0.9, CENTER + 0.3);
  ctx.fillStyle = '#3a6fd8'; ctx.beginPath(); ctx.ellipse(b.x, b.y, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a0622d'; ctx.beginPath(); ctx.ellipse(b.x, b.y - 1, 5, 2, 0, 0, Math.PI * 2); ctx.fill();
}

function drawBloodstain() {
  const b = bloodstain, pulse = 0.6 + Math.sin(time * 4) * 0.25;
  ctx.fillStyle = `rgba(127,212,106,${pulse * 0.4})`;
  groundEllipse(b.x, b.y, 0.5); ctx.fill();
  const s = toScreen(b.x, b.y);
  ctx.save(); ctx.translate(s.x, s.y - 10 - Math.sin(time * 3) * 2); ctx.rotate(-0.4);
  ctx.globalAlpha = 0.6 + pulse * 0.4; ctx.shadowColor = '#7fd46a'; ctx.shadowBlur = 12;
  drawBone(-6, 6, '#cfe9b4');
  ctx.restore(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawEffect(f) {
  const a = f.t / f.max;
  ctx.globalAlpha = a;
  ctx.strokeStyle = ctx.fillStyle = f.color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (f.type === 'arc') {
    for (let k = 0; k <= 12; k++) {
      const an = f.ang - Math.PI / 3 + (k / 12) * (Math.PI * 2 / 3);
      const s = toScreen(f.x + Math.cos(an) * f.range, f.y + Math.sin(an) * f.range);
      k ? ctx.lineTo(s.x, s.y - 14) : ctx.moveTo(s.x, s.y - 14);
    }
    ctx.stroke();
  } else {
    groundEllipse(f.x, f.y, f.range * (1.2 - a * 0.2));
    if (f.fill) { ctx.globalAlpha = a * 0.35; ctx.fill(); ctx.globalAlpha = a; }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
}

function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
}

function drawHUD() {
  ctx.save(); ctx.translate(SAFE.l / VIEW, SAFE.t / VIEW);
  drawHUDInner();
  ctx.restore();
}
function drawHUDInner() {
  const p = player;
  // HP and stamina bars grow as you level those stats.
  bar(18, 18, maxHp() * 2.4, 14, p.hp / maxHp(), '#b3191c');
  bar(18, 40, maxSta() * 2.4, 8, p.sta / maxSta(), '#3fae5a');
  bar(18, 54, maxPee() * 4, 5, p.bladder / maxPee(), p.pee ? '#ffe066' : '#c9a83a');   // pee left
  ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText(`${Math.ceil(p.hp)} / ${maxHp()}`, 24, 29);

  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillStyle = '#e8e4e0'; ctx.fillText(`Lv ${p.level}`, 18, 78);
  const lw = ctx.measureText(`Lv ${p.level}`).width;
  ctx.fillStyle = '#f2c94c'; ctx.fillText(`${p.xp} XP`, 28 + lw, 78);
  // Turf claimed, then one pip per dog friend (filled once saved)
  ctx.font = 'bold 12px system-ui, sans-serif'; ctx.fillStyle = '#9be37a';
  const tt = `Turf ${Math.floor(turfFrac() * 100)}%`;
  ctx.fillText(tt, 18, 97);
  const px = 30 + ctx.measureText(tt).width;
  FRIENDS.forEach((f, i) => {
    ctx.beginPath(); ctx.arc(px + i * 13, 93, 4.5, 0, Math.PI * 2);
    if (saved.has(f.id)) { ctx.fillStyle = f.look.fur; ctx.fill(); ctx.strokeStyle = p.buddy === f.id ? '#ffffff' : 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.5; ctx.stroke(); }
    else { ctx.strokeStyle = 'rgba(230,220,200,.5)'; ctx.lineWidth = 1.5; ctx.stroke(); }
    ctx.lineWidth = 1;
  });
  // Dropped XP still out there: a little bone and the amount
  if (bloodstain) {
    const bx = px + FRIENDS.length * 13 + 8;
    ctx.save(); ctx.translate(bx, 93); ctx.rotate(-0.3); paintMode = null; drawBone(-4, 4, '#cfe9b4'); ctx.restore();
    ctx.font = '12px system-ui, sans-serif'; ctx.fillStyle = '#ffb4a0'; ctx.fillText(`${bloodstain.xp}`, bx + 12, 97);
  }

  drawHint();
  drawInteract();
  drawMinimap();

  // Locked-on target, top centre.
  if (target) {
    const bw = Math.min(300, W - 60);
    const ty = W < 760 ? 128 : 26;   // narrow (phone) screens: below the stats so they don't overlap
    ctx.textAlign = 'center'; ctx.fillStyle = '#e8e4e0'; ctx.font = '14px Georgia, serif';
    ctx.fillText(`${target.name}  ·  Lv ${target.lvl}`, W / 2, ty);
    bar(W / 2 - bw / 2, ty + 8, bw, 8, target.hp / target.maxHp, '#b3191c');
  }

  if (isTouch) { drawJoystick(); return; }   // phones use on-screen buttons instead

  // Action bar
  const slots = [
    ...SKILLS.map(s => ({ key: s.key === '1' ? 'Click' : s.key, label: !p.skills.has(s.id) ? `${s.cost} XP` : s.id === 'strike' ? WEAPONS[p.weapon].verb[0] + WEAPONS[p.weapon].verb.slice(1).toLowerCase() : s.name,
      owned: p.skills.has(s.id), cd: cooldowns[s.id] / s.cd })),
    { key: 'Q', label: `Biscuit ${p.flasks}/${p.maxFlasks}`, owned: p.flasks > 0, cd: 0 },
    { key: 'Space', label: 'Roll', owned: true, cd: 0 },
    { key: 'Shift', label: 'Run', owned: true, cd: 0 },
    { key: 'P', label: p.pee ? 'Peeing' : 'Pee', owned: p.bladder > 0, cd: 0 },
  ];
  const b = buddy();
  if (b && b.kind === 'attack') slots.push({ key: 'F', label: b.moveName, owned: true, cd: b.cd / b.cdBase });
  const size = 62, gap = 8, total = slots.length * size + (slots.length - 1) * gap;
  const x0 = (W - total) / 2, y0 = H - size - 16;
  slots.forEach((s, i) => {
    const x = x0 + i * (size + gap);
    ctx.fillStyle = s.owned ? 'rgba(36,29,32,.92)' : 'rgba(36,29,32,.5)';
    ctx.fillRect(x, y0, size, size);
    ctx.strokeStyle = s.owned ? '#6a4a50' : '#352b2d';
    ctx.strokeRect(x + 0.5, y0 + 0.5, size - 1, size - 1);
    if (s.owned && s.cd > 0) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, y0 + size * (1 - s.cd), size, size * s.cd); }
    ctx.textAlign = 'center';
    ctx.fillStyle = s.owned ? '#e8e4e0' : '#6d6264';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.fillText(s.key, x + size / 2, y0 + 20);
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillText(s.label, x + size / 2, y0 + 44);
  });
}

// Little map in the top-right corner: islands, Watson's turf, Watson, home, and lost dogs.
const mini = document.createElement('canvas'), MINI_W = 180, MINI_SC = MINI_W / (MAP * TW);
mini.width = MINI_W; mini.height = MINI_W / 2;
let miniTurf = -1;
const miniPt = (x, y) => ({ x: MINI_W / 2 + (x - y) * MINI_SC * TW / 2, y: (x + y) * MINI_SC * TH / 2 });
function drawMinimap() {
  if (miniTurf !== turfCount) {
    miniTurf = turfCount;
    const g = mini.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, mini.width, mini.height);
    g.fillStyle = 'rgba(20,50,80,.75)'; g.beginPath(); g.moveTo(MINI_W / 2, 0); g.lineTo(MINI_W, MINI_W / 4); g.lineTo(MINI_W / 2, MINI_W / 2); g.lineTo(0, MINI_W / 4); g.fill();
    g.setTransform(MINI_SC * TW / 2, MINI_SC * TH / 2, -MINI_SC * TW / 2, MINI_SC * TH / 2, MINI_W / 2, 0);
    g.fillStyle = '#7a9a5a'; g.beginPath(); for (const isl of ISLANDS) coastPath(g, isl, 0); g.fill();
    g.fillStyle = '#ffe066';
    for (let c = 0; c < N * N; c++) if (turf[c]) g.fillRect((c % N) / G, Math.floor(c / N) / G, 1 / G + 0.05, 1 / G + 0.05);
  }
  const x0 = W - MINI_W - (isTouch ? 64 / VIEW : 16), y0 = 12;
  ctx.drawImage(mini, x0, y0);
  const dot = (x, y, r, c) => { const m = miniPt(x, y); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x0 + m.x, y0 + m.y, r, 0, Math.PI * 2); ctx.fill(); };
  dot(CENTER, CENTER, 2.5, '#c0392b');
  for (const f of FRIENDS) if (!saved.has(f.id)) dot(f.x, f.y, 2 + Math.sin(time * 5) * 0.8, '#ffffff');
  dot(player.x, player.y, 3, '#ff9a3a');
}

// Small bubble at the bottom when Watson can talk to Fred or rest. The attack button activates it.
function drawInteract() {
  const it = interactTarget();
  if (!it || paused || isTouch) return;   // phones: the big button itself changes to REST / TRADE
  const label = it === 'fred' ? 'Trade with Fred' : it === 'free' ? 'Free the dog' : 'Rest';
  const key = 'Click';
  ctx.font = 'bold 14px system-ui, sans-serif';
  const kw = ctx.measureText(key).width + 14, w = kw + ctx.measureText(label).width + 30;
  // Phones: bottom centre between the stick and the buttons (portrait: above the buttons)
  const x = W / 2 - w / 2, y = isTouch ? H - (innerWidth > innerHeight ? 70 : 225) / VIEW : H - 118;
  ctx.fillStyle = 'rgba(20,14,12,.85)';
  ctx.beginPath(); ctx.roundRect(x, y, w, 30, 15); ctx.fill();
  ctx.strokeStyle = it === 'fred' ? '#f08a24' : '#d08a45'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
  if (player.chew || player.scene) return;
  ctx.fillStyle = it === 'fred' ? '#f08a24' : '#d08a45';
  ctx.beginPath(); ctx.roundRect(x + 6, y + 5, kw, 20, 10); ctx.fill();
  ctx.textAlign = 'left'; ctx.fillStyle = '#1a120e'; ctx.fillText(key, x + 13, y + 20);
  ctx.fillStyle = '#f2e6c8'; ctx.fillText(label, x + kw + 16, y + 20);
}

function drawJoystick() {
  if (joy.id === null) return;
  const ox = joy.ox / VIEW, oy = joy.oy / VIEW, R = JOY_R / VIEW;
  ctx.fillStyle = 'rgba(30,20,16,.35)'; ctx.strokeStyle = 'rgba(208,138,69,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ox, oy, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = joy.mag > 0.92 ? 'rgba(242,201,76,.85)' : 'rgba(242,230,200,.75)';
  ctx.beginPath(); ctx.arc(ox + joy.dx * R, oy + joy.dy * R, R * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 1;
}

function draw() {
  ctx.fillStyle = '#0b0a0c';
  ctx.fillRect(0, 0, W, H);
  drawTiles();
  drawTrail();
  if (bloodstain) drawBloodstain();
  const seen = (x, y) => { const s = toScreen(x, y); return s.x > -150 && s.x < W + 150 && s.y > -150 && s.y < H + 200; };
  const shown = enemies.filter(e => seen(e.x, e.y));
  for (const e of shown) {
    if (e.state === 'windup') drawTelegraph(e);
    if (e.state === 'recover' && e.punishable) {   // yellow ring = open to a critical hit
      ctx.strokeStyle = 'rgba(255,210,90,.9)'; ctx.lineWidth = 3;
      groundEllipse(e.x, e.y, e.r + 0.3); ctx.stroke(); ctx.lineWidth = 1;
    }
  }
  if (target) {
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
    groundEllipse(target.x, target.y, target.r + 0.18); ctx.stroke(); ctx.lineWidth = 1;
  }

  // Depth-sort everything standing on the ground.
  const things = [
    { d: CENTER * 2, f: drawDoghouse },
    { d: JACKIE.x + JACKIE.y, f: drawJackie },
    { d: FRED.x + FRED.y, f: drawFred },
    ...FRIENDS.filter(fr => seen(fr.x, fr.y)).map(fr => ({ d: fr.x + fr.y, f: () => drawFriend(fr) })),
    ...shown.map(e => ({ d: e.x + e.y, f: () => drawEnemy(e) })),
    ...projectiles.map(pr => ({ d: pr.x + pr.y, f: () => {
      shadow(pr.x, pr.y, 0.12);
      const s = toScreen(pr.x, pr.y), a = Math.atan2(pr.vy * 0.5 + pr.vx * 0.5, pr.vx - pr.vy);
      if (pr.kind === 'fire') {   // Ember's flaming ball
        ctx.save(); ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = 14;
        ctx.fillStyle = '#ff9a3a'; ctx.beginPath(); ctx.arc(s.x, s.y - 14, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd25a'; ctx.beginPath(); ctx.arc(s.x, s.y - 15, 3.4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }
      // Mega Bark: a flying bundle of sound waves.
      ctx.save(); ctx.translate(s.x, s.y - 16); ctx.rotate(a);
      ctx.strokeStyle = '#cfe8ff'; ctx.lineCap = 'round';
      ctx.shadowColor = '#9fd4ff'; ctx.shadowBlur = 10;
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = 1 - i * 0.25; ctx.lineWidth = 4 - i;
        ctx.beginPath(); ctx.arc(-i * 7, 0, 9 + i * 5, -1, 1); ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.restore(); ctx.globalAlpha = 1; ctx.lineWidth = 1;
    } })),
  ];
  if (!player.dead) things.push({ d: player.x + player.y, f: drawPlayer });
  things.sort((a, b) => a.d - b.d).forEach(t => t.f());

  effects.forEach(drawEffect);
  drawSpeech();

  ctx.textAlign = 'center';
  ctx.font = 'bold 14px system-ui, sans-serif';
  for (const f of floaters) {
    const s = toScreen(f.x, f.y);
    ctx.globalAlpha = Math.min(1, f.t / f.max * 2);
    ctx.fillStyle = '#000'; ctx.fillText(f.text, s.x + f.dx + 1, s.y - f.z + 1);
    ctx.fillStyle = f.color; ctx.fillText(f.text, s.x + f.dx, s.y - f.z);
  }
  ctx.globalAlpha = 1;

  if (!overlay('title').classList.contains('open')) drawHUD();
}

// ---------- Learn-as-you-play hints ----------
// No instruction screen: each hint pops up the first time it's useful and goes away
// once you've done it (or after a few seconds for the ones that are just warnings).
const tut = { moved: 0, playT: 0, strike: 0, whirl: 0, fireball: 0, rolls: 0, crits: 0, ran: 0, ate: 0, shop: 0, fred: 0,
  pal: 0, claims: 0, swaps: 0, swum: 0, shakes: 0, peeOn: 0 };
const near = (e, d) => Math.hypot(e.x - player.x, e.y - player.y) < d;
const HINTS = [   // earlier hints win when several apply at once
  { id: 'roll',   text: 'SPACE  to roll out of the red circle', touch: 'Tap ROLL to get out of the red circle',            when: () => enemies.some(e => e.state === 'windup' && near(e, 3)),   done: () => tut.rolls > 0 },
  { id: 'heal',   text: 'Q  to eat a biscuit and heal', touch: 'Tap TREAT to eat a biscuit and heal',                    when: () => player.hp < maxHp() * 0.45 && player.flasks > 0,       done: () => tut.ate > 0 },
  { id: 'tired',  text: "Out of stamina! Back off and catch your breath",  when: () => player.sta <= 0,                                         limit: 4 },
  { id: 'crit',   text: "Yellow ring: they're off balance. Hit them now for a critical!", when: () => enemies.some(e => e.state === 'recover' && e.punishable && near(e, 3.5)), done: () => tut.crits > 0, limit: 8 },
  { id: 'water',  text: "Watson hates water! A friend who loves swimming might help", when: () => player.shake > 0 && !hasPower('swim'), limit: 4 },
  { id: 'free',   text: 'A dog is stuck in polluted vines! Walk up and CLICK to free them', touch: 'A dog is stuck in polluted vines! Walk up and tap FREE',
    when: () => FRIENDS.some(f => !saved.has(f.id) && near(f, 4.5)), done: () => saved.size > 0, limit: 10 },
  { id: 'lost',   text: 'Got hit! The pee trail washed away. Start over', when: () => time - trailLostT < 2.5, limit: 6 },
  { id: 'attack', text: 'CLICK  to attack toward the mouse', touch: 'Tap the big button to attack',                when: () => enemies.some(e => near(e, 3.5)),                        done: () => tut.strike > 0 },
  { id: 'bone',   text: 'Your dropped XP glows like a bone. Go get it back!', when: () => !!bloodstain,                                       done: () => !bloodstain, limit: 8 },
  { id: 'pee',    text: 'P to pee. Walk a loop back to your turf to claim it', touch: 'Tap PEE, then walk a loop back to your turf',
    when: () => tut.playT > 25 && !player.pee && distC(player.x, player.y) < 9, done: () => tut.claims > 0, limit: 12 },
  { id: 'peeing', text: 'Loop back to the yellow line to claim it. Don\'t get hit!', when: () => player.pee && trail.length > 3, done: () => tut.claims > 0, limit: 8 },
  { id: 'swim',   text: 'Splash loves water! Now Watson can swim too', when: () => hasPower('swim'), done: () => tut.swum > 1, limit: 8 },
  { id: 'palmove', text: () => `F for ${buddy().name}'s ${buddy().moveName}`, touch: () => `Tap ${buddy().verb} for ${buddy().name}'s ${buddy().moveName}`,
    when: () => { const b = buddy(); return !!b && b.kind === 'attack' && enemies.some(e => near(e, 4)); }, done: () => tut.pal > 0 },
  { id: 'swap',   text: 'Swap dog friends at the doghouse', when: () => saved.size >= 2 && distC(player.x, player.y) < 6, done: () => tut.swaps > 0, limit: 8 },
  { id: 'fred',   text: 'Fred the cat sells gear, tricks and outfits. Walk up to Fred', touch: 'Fred the cat sells gear, tricks and outfits. Walk up to Fred',
    when: () => player.xp >= WEAPONS[1].cost && distC(player.x, player.y) < 5 && !nearFred(), done: () => tut.fred > 0, limit: 12 },
  { id: 'spend',  text: 'Enough XP to level up! Head home to the doghouse', when: () => player.xp >= levelCost(player.level) && distC(player.x, player.y) >= SAFE_R, done: () => tut.shop > 0, limit: 10 },
  { id: 'whirl',  text: '2  for Zoomies', touch: 'Tap ZOOM for Zoomies',                                  when: () => player.skills.has('whirl') && !paused,                  done: () => tut.whirl > 0 },
  { id: 'bark',   text: '3  for Mega Bark', touch: 'Tap BARK for Mega Bark',                                when: () => player.skills.has('fireball') && !paused,               done: () => tut.fireball > 0 },
  { id: 'run',    text: 'Hold SHIFT to run', touch: 'Push the stick all the way to run',                               when: () => tut.moved > 4 && tut.playT > 15,                         done: () => tut.ran > 0.4 },
  { id: 'move',   text: 'W A S D  to move', touch: 'Drag on the left side to move',                                when: () => tut.playT > 1.5,                                         done: () => tut.moved > 2 },
];
const hintDone = new Set(), hintShown = {};
let hint = null, hintFade = 0;
function updateHints(dt) {
  if (player.dead) return;
  for (const h of HINTS) if (!hintDone.has(h.id) && h.done && h.done()) hintDone.add(h.id);
  const now = HINTS.find(h => !hintDone.has(h.id) && h.when());
  if (now) {
    hintShown[now.id] = (hintShown[now.id] || 0) + dt;
    if (now.limit && hintShown[now.id] > now.limit) hintDone.add(now.id);
    if (hint !== now) { hint = now; hintFade = 0; }
  } else hint = null;
  hintFade = Math.min(1, hintFade + dt * 4);
}
function drawHint() {
  if (!hint || paused) return;
  const y = isTouch ? (W < 760 ? 178 : 90) : H - (interactTarget() ? 162 : 112);
  let text = isTouch && hint.touch ? hint.touch : hint.text;
  if (typeof text === 'function') text = text();
  ctx.font = 'bold 16px system-ui, sans-serif';
  const w = ctx.measureText(text).width + 36;
  ctx.globalAlpha = hintFade * (0.85 + Math.sin(performance.now() / 250) * 0.15);
  ctx.fillStyle = 'rgba(20,14,12,.85)';
  ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, y - 22, w, 34, 17); ctx.fill();
  ctx.strokeStyle = '#d08a45'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
  ctx.fillStyle = '#f2e6c8'; ctx.textAlign = 'center';
  ctx.fillText(text, W / 2, y);
  ctx.globalAlpha = 1;
}

// Title-screen logo: Watson trotting on the spot, drawn with the game's own art.
const logoCtx = document.getElementById('logoDog').getContext('2d');
function drawLogoDog() {
  const main = ctx;
  ctx = logoCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 720, 440);
  ctx.setTransform(6, 0, 0, 6, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(60, 68, 22, 4, 0, 0, Math.PI * 2); ctx.fill();
  drawDog(58, 68, { flip: false, walk: time * 7, moving: true, running: false, attack: -1, item: 'bone', color: '#cfe9b4', eating: false });
  ctx = main;
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  time += dt;
  if (!paused) { update(dt); updateHints(dt); }
  updateTouchButtons();
  if (overlay('title').classList.contains('open')) drawLogoDog();
  // Camera follows the player smoothly.
  const tx = (player.x - player.y) * TW / 2, ty = (player.x + player.y) * TH / 2;
  cam.x += (tx - cam.x) * Math.min(1, dt * 8);
  cam.y += (ty - cam.y) * Math.min(1, dt * 8);
  draw();
  requestAnimationFrame(frame);
}
cam.x = (player.x - player.y) * TW / 2;
cam.y = (player.x + player.y) * TH / 2;
requestAnimationFrame(frame);
</script>
