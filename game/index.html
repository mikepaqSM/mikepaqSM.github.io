    // Carved face
    ctx.beginPath(); ctx.ellipse(-1, -32, 2.6, 3.2, 0, 0, Math.PI * 2); fill('#24160c');
    ctx.beginPath(); ctx.ellipse(6, -32, 2.6, 3.2, 0, 0, Math.PI * 2); fill('#24160c');
    glowEye(-0.5, -31.5, 1.2); glowEye(6.5, -31.5, 1.2);
    ctx.beginPath(); ctx.moveTo(-3, -24); for (let i = 0; i <= 6; i++) ctx.lineTo(-3 + i * 1.8, i % 2 ? -21.5 : -24); ctx.lineTo(8, -20); ctx.lineTo(-3, -20); fill('#24160c');
    branch(6, armA, '#5e4028');
  }
  ctx.restore();
}

function drawEnemy(e) {
  shadow(e.x, e.y, e.r);
  const s = toScreen(e.x, e.y);
  paintMode = e.flash > 0 ? 'flash' : e.frozen > 0 ? 'ice' : e.state === 'windup' && Math.floor(time * 12) % 2 ? 'tint' : null;
  const { flip } = screenFacing(e.fx, e.fy);
  const prog = e.state === 'windup' ? Math.min(1, (1 - e.t / e.tMax) * 1.6) : 0;
  const slump = e.state === 'recover' && e.punishable;
  if (e.boss) {   // a pulsing purple pollution glow under bosses
    const pulse = 0.5 + Math.sin(time * 3 + e.seed) * 0.2;
    ctx.fillStyle = `rgba(177,76,255,${0.22 * pulse + 0.08})`;
    groundEllipse(e.x, e.y, e.r + 0.5); ctx.fill();
  }
  drawPlant(s.x, s.y, e, { flip, prog, slump });
  paintMode = null;
  if (e.frozen > 0) {   // ice crystals
    ctx.fillStyle = 'rgba(200,235,255,.8)';
    for (let k = 0; k < 3; k++) { const a = k * 2.1 + e.seed; ctx.beginPath(); ctx.arc(s.x + Math.cos(a) * 10 * e.s, s.y - e.h * 0.5 + Math.sin(a) * 8, 2, 0, Math.PI * 2); ctx.fill(); }
  }
  const top = s.y - e.h - 8;
  if (e.hp < e.maxHp || e === target) {
    ctx.fillStyle = '#300'; ctx.fillRect(s.x - 18, top - 2, 36, 4);
    ctx.fillStyle = '#e04848'; ctx.fillRect(s.x - 18, top - 2, 36 * Math.max(0, e.hp) / e.maxHp, 4);
  }
}

function drawPlayer() {
  const p = player;
  shadow(p.x, p.y, p.r + 0.08);
  const s = toScreen(p.x, p.y);
  if (p.grace > 0 && Math.floor(time * 20) % 2) ctx.globalAlpha = 0.5;
  paintMode = p.flash > 0 ? 'flash' : null;
  if (p.roll) {
    // Tucked into a roll: a spinning ball of brown fur.
    const a = (0.4 - p.roll.t) * 18 * (screenFacing(p.roll.x, p.roll.y).flip ? -1 : 1);
    ctx.save(); ctx.translate(s.x, s.y - 13); ctx.scale(DOG_SCALE, DOG_SCALE); ctx.rotate(a);
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); fill('#cc7a2e');
    ctx.beginPath(); ctx.ellipse(-5, -6, 2.5, 5, 0.6, 0, Math.PI * 2); fill('#8e4c1a');
    ctx.beginPath(); ctx.rect(-8, 3, 6, 2.2); fill('#c0392b');
    ctx.restore();
  } else if (p.scene && p.scene.t > SCENE_LICK) {
    drawDogBellyUp(s.x, s.y, screenFacing(p.face.x, p.face.y).flip);
  } else {
    let { flip } = screenFacing(p.face.x, p.face.y);
    if (p.whirl > 0) flip = Math.floor(p.whirl * 20) % 2 === 0;   // zoomies: spinning in circles
    const wpn = WEAPONS[p.weapon];
    const dog = y => drawDog(s.x, y, { flip, walk: p.walk, moving: p.moving || p.whirl > 0, running: p.running || p.whirl > 0,
      attack: p.chew ? (time * 3) % 1 : p.swing > 0 ? 1 - p.swing / p.swingMax : -1, item: wpn.type, color: wpn.color, eating: p.drink > 0,
      wear: p.wear, shake: p.shake > 0, lick: !!p.scene, pee: p.pee && trail.length > 0 && !p.swimming });
    if (p.swimming) swimming(s, dog); else dog(s.y);
    if (p.shake > 0) {   // water droplets flying off his head
      const hx = s.x + (flip ? -17 : 17), hy = s.y - 34;
      ctx.fillStyle = '#9fd4ff';
      for (let k = 0; k < 6; k++) {
        const a = k * 1.05 + time * 3, r = 6 + ((time * 40 + k * 4) % 12);
        ctx.beginPath(); ctx.arc(hx + Math.cos(a) * r, hy + Math.sin(a) * r * 0.6, 1.6, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  paintMode = null;
  ctx.globalAlpha = 1;
}
// Swimming: only the top half shows above the water, with a ripple around it.
function swimming(s, draw) {
  ctx.save();
  ctx.beginPath(); ctx.rect(s.x - 80, s.y - 120, 160, 120); ctx.clip();
  draw(s.y + 10);
  ctx.restore();
  ctx.strokeStyle = 'rgba(220,240,255,.75)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(s.x, s.y, 20 + Math.sin(time * 5) * 2, 6, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1;
}

// Dog friends: lost ones sit tangled in polluted vines; saved ones follow Watson or lounge in the yard.
function drawFriend(f) {
  const s = toScreen(f.x, f.y), lost = !saved.has(f.id);
  shadow(f.x, f.y, 0.3 * f.look.s);
  const { flip } = screenFacing(f.fx, f.fy);
  const a = f.act;
  const dog = y => drawDog(s.x, y - (f.z || 0), { flip, walk: f.walk, moving: f.moving, running: f.moving && player.running,
    attack: a && a.type === 'throw' ? a.t / a.max : -1, look: f.look, howl: (a && a.type === 'howl') || (lost && Math.sin(time * 1.3 + f.ox) > 0.85) });
  if (inWater(f.x, f.y) && !f.z) swimming(s, dog); else dog(s.y);
  if (!lost) return;
  // Thorny purple vines wrapped around them
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#5d3a7a';
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(s.x, s.y - 10 - k * 8, 19 - k * 2, 5, (k - 1) * 0.25, 0, Math.PI * 2); ctx.stroke(); }
  ctx.lineWidth = 1;
  for (let k = 0; k < 8; k++) {
    const an = k * 0.8, x = s.x + Math.cos(an) * 18, y = s.y - 12 - (k % 3) * 8 + Math.sin(an) * 4;
    ctx.fillStyle = k % 2 ? '#c9a0dc' : '#4a7a34';
    ctx.beginPath(); ctx.moveTo(x - 2, y); ctx.lineTo(x, y - 4); ctx.lineTo(x + 2, y); ctx.fill();
  }
  // Freeing progress
  if (player.chew && player.chew.f === f) {
    ctx.strokeStyle = '#9be37a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y - 52, 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - player.chew.t / 1.1)); ctx.stroke();
    ctx.lineWidth = 1;
  }
}

// Boulders and brambles sitting on top of rare finds (a faint glint shows something is underneath).
function drawObstacle(o) {

// Shiny trinkets: a small gem, button, bottle cap or marble that glints now and then.
function drawTrinket(t) {
  const s = toScreen(t.x, t.y), bob = Math.sin(time * 3 + t.id) * 1.5, y = s.y - 6 + bob;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(s.x, s.y, 5, 2, 0, 0, Math.PI * 2); ctx.fill();
  const col = ['#9fd4ff', '#ffd25a', '#ff8fb8', '#b6f5a8'][t.kind];
  ctx.fillStyle = col;
  if (t.kind === 0) { ctx.beginPath(); ctx.moveTo(s.x, y - 5); ctx.lineTo(s.x + 4, y); ctx.lineTo(s.x, y + 5); ctx.lineTo(s.x - 4, y); ctx.closePath(); ctx.fill(); }

  const g = (time * 0.7 + t.id * 0.37) % 2.2;   // a glint every couple of seconds

// Water bowls on far islands: dry and dusty until they're inside Watson's turf.

function drawNest(o) {

// Rare finds: a glowing item with a beam of light so you can spot it from far away.
function drawTreasure(t) {
  const s = toScreen(t.x, t.y), bob = Math.sin(time * 3) * 3;
  const grd = ctx.createLinearGradient(0, s.y - 120, 0, s.y);

  else if (t.id === 'awning') { for (let k = 0; k < 5; k++) { ctx.fillStyle = k % 2 ? '#ffffff' : t.color; ctx.fillRect(-10 + k * 4, -6, 4, 10); } }
  else if (t.id === 'pillow') { ctx.beginPath(); ctx.roundRect(-10, -5, 20, 10, 5); ctx.fill(); }

  else if (t.id === 'sign') { ctx.fillRect(-11, -7, 22, 10); ctx.fillStyle = '#ffffff'; ctx.fillRect(-7, -3, 14, 2); }
  else if (t.id === 'shingles') { for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(-7 + k * 7, -2, 4, 0, Math.PI); ctx.fill(); } }

}

function drawBloodstain() {
  const b = bloodstain, pulse = 0.6 + Math.sin(time * 4) * 0.25;
  ctx.fillStyle = `rgba(127,212,106,${pulse * 0.4})`;
  groundEllipse(b.x, b.y, 0.5); ctx.fill();
  const s = toScreen(b.x, b.y);
  ctx.save(); ctx.translate(s.x, s.y - 10 - Math.sin(time * 3) * 2); ctx.rotate(-0.4);
  ctx.globalAlpha = 0.6 + pulse * 0.4; ctx.shadowColor = '#7fd46a'; ctx.shadowBlur = 12;

function drawEffect(f) {
  const a = f.t / f.max;
  ctx.globalAlpha = a;
  ctx.strokeStyle = ctx.fillStyle = f.color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (f.type === 'arc') {
    for (let k = 0; k <= 12; k++) {
      const an = f.ang - Math.PI * 0.42 + (k / 12) * (Math.PI * 0.84);
      const s = toScreen(f.x + Math.cos(an) * f.range, f.y + Math.sin(an) * f.range);
      k ? ctx.lineTo(s.x, s.y - 14) : ctx.moveTo(s.x, s.y - 14);

    ctx.stroke();

    groundEllipse(f.x, f.y, f.range * (1.2 - a * 0.2));
    if (f.fill) { ctx.globalAlpha = a * 0.35; ctx.fill(); ctx.globalAlpha = a; }
    ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
}

function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
}

function drawHUD() {
  ctx.save(); ctx.translate(SAFE.l / VIEW, SAFE.t / VIEW);
  drawHUDInner();
  ctx.restore();
}
const canLevelUp = () => freePicks() > 0 || readyToLevel();
const canBuildUpgrade = () => (found.has('bowl') && !built.has('bowl')) ||
  UPGRADES.some(u => !built.has(u.id) && (!u.needs || found.has(u.needs)) && (!u.after || built.has(u.after)) && homeXp >= u.home);
function drawHUDInner() {
  const p = player;
  // HP and stamina bars grow as you level those stats.
  bar(18, 18, maxHp() * 2.4, 14, p.hp / maxHp(), '#b3191c');
  bar(18, 40, maxSta() * 2.4, 8, p.sta / maxSta(), '#3fae5a');
  bar(18, 54, maxPee() * 4, 5, p.bladder / maxPee(), p.pee ? '#ffe066' : '#c9a83a');   // pee left
  ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText(`${Math.ceil(p.hp)} / ${maxHp()}`, 24, 29);

  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillStyle = '#e8e4e0'; ctx.fillText(`Lv ${p.level}`, 18, 78);
  let lw = ctx.measureText(`Lv ${p.level}`).width;
  // Level bar: XP toward the next level
  bar(26 + lw, 70, 46, 5, p.xp / levelCost(p.level), readyToLevel() ? '#ffe680' : '#f2c94c');   // full = rest to level up
  lw += 58;
  // Gentle pulsing badges: a gold up-arrow when there's a level-up pick to spend, a glow on the house when an upgrade can be built.
  const pulse = 0.6 + Math.sin(time * 4) * 0.4;
  if (canLevelUp()) {
    const bx = 30 + lw, by = 73;
    ctx.save();
    ctx.shadowColor = '#ffd25a'; ctx.shadowBlur = 8 * pulse;
    ctx.fillStyle = '#f2c94c'; ctx.beginPath(); ctx.arc(bx, by, 7.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#3a2210'; ctx.beginPath(); ctx.moveTo(bx, by - 4.5); ctx.lineTo(bx + 4, by + 0.5); ctx.lineTo(bx + 1.5, by + 0.5);
    ctx.lineTo(bx + 1.5, by + 4); ctx.lineTo(bx - 1.5, by + 4); ctx.lineTo(bx - 1.5, by + 0.5); ctx.lineTo(bx - 4, by + 0.5); ctx.closePath(); ctx.fill();
    lw += 20;
  }
  const hx = 32 + lw;   // Doghouse XP: a little house and the amount

    ctx.save(); ctx.fillStyle = `rgba(255,179,107,${0.35 * pulse})`; ctx.shadowColor = '#ffb36b'; ctx.shadowBlur = 10 * pulse;
    ctx.beginPath(); ctx.arc(hx + 6.5, 72.5, 10, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  ctx.fillStyle = '#ffb36b';
  ctx.beginPath(); ctx.moveTo(hx, 73); ctx.lineTo(hx + 6.5, 66.5); ctx.lineTo(hx + 13, 73); ctx.fill();
  ctx.fillRect(hx + 2, 72, 9, 6);
  ctx.fillText(`${homeXp}`, hx + 17, 78);
  // Shiny trinkets for Fred: a little blue gem and the count
  const tx = hx + 30 + ctx.measureText(`${homeXp}`).width;
  ctx.fillStyle = '#9fd4ff'; ctx.beginPath(); ctx.moveTo(tx, 66); ctx.lineTo(tx + 5.5, 72); ctx.lineTo(tx, 78); ctx.lineTo(tx - 5.5, 72); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e6f6ff'; ctx.beginPath(); ctx.moveTo(tx, 67.5); ctx.lineTo(tx + 2.5, 71); ctx.lineTo(tx, 71); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#bfe6ff'; ctx.fillText(`${trinkets}`, tx + 9, 78);
  // Turf claimed, then one pip per dog friend (filled once saved)
  ctx.font = 'bold 12px system-ui, sans-serif'; ctx.fillStyle = '#9be37a';
  const tt = `Turf ${Math.floor(turfFrac() * 100)}%`;
  ctx.fillText(tt, 18, 97);
  const px = 30 + ctx.measureText(tt).width;
  FRIENDS.forEach((f, i) => {
    ctx.beginPath(); ctx.arc(px + i * 13, 93, 4.5, 0, Math.PI * 2);
    if (saved.has(f.id)) { ctx.fillStyle = f.look.fur; ctx.fill(); ctx.strokeStyle = p.buddy === f.id ? '#ffffff' : 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.5; ctx.stroke(); }
    else { ctx.strokeStyle = 'rgba(230,220,200,.5)'; ctx.lineWidth = 1.5; ctx.stroke(); }
    ctx.lineWidth = 1;
  });

  }

  // Action bar
  const slots = [
    ...SKILLS.filter(s => p.skills.has(s.id)).map(s => ({ key: s.key === '1' ? 'Click' : s.key, label: !p.skills.has(s.id) ? `${s.cost} XP` : s.id === 'strike' ? WEAPONS[p.weapon].verb[0] + WEAPONS[p.weapon].verb.slice(1).toLowerCase() : s.name,
      owned: p.skills.has(s.id), cd: cooldowns[s.id] / s.cd })),
    { key: 'Q', label: `Biscuit ${p.flasks}/${p.maxFlasks}`, owned: p.flasks > 0, cd: 0 },
    { key: 'Space', label: 'Roll', owned: true, cd: 0 },
    { key: 'Shift', label: 'Run', owned: true, cd: 0 },

  const size = 62, gap = 8, total = slots.length * size + (slots.length - 1) * gap;
  const x0 = (W - total) / 2, y0 = H - size - 16;
  slots.forEach((s, i) => {
    const x = x0 + i * (size + gap);
    ctx.fillStyle = s.owned ? 'rgba(36,29,32,.92)' : 'rgba(36,29,32,.5)';
    ctx.fillRect(x, y0, size, size);
    ctx.strokeStyle = s.owned ? '#6a4a50' : '#352b2d';
    ctx.strokeRect(x + 0.5, y0 + 0.5, size - 1, size - 1);
    if (s.owned && s.cd > 0) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, y0 + size * (1 - s.cd), size, size * s.cd); }
    ctx.textAlign = 'center';
    ctx.fillStyle = s.owned ? '#e8e4e0' : '#6d6264';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.fillText(s.key, x + size / 2, y0 + 20);
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillText(s.label, x + size / 2, y0 + 44);
  });
}

// Little map in the top-right corner: islands, Watson's turf, Watson, home, and lost dogs.
const mini = document.createElement('canvas'), MINI_W = 180, MINI_SC = MINI_W / (MAP * TW);
mini.width = MINI_W; mini.height = MINI_W / 2;
let miniTurf = -1;
const miniPt = (x, y) => ({ x: MINI_W / 2 + (x - y) * MINI_SC * TW / 2, y: (x + y) * MINI_SC * TH / 2 });
function drawMinimap() {
  if (miniTurf !== turfCount) {
    miniTurf = turfCount;
    const g = mini.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, mini.width, mini.height);
    g.fillStyle = 'rgba(20,50,80,.75)'; g.beginPath(); g.moveTo(MINI_W / 2, 0); g.lineTo(MINI_W, MINI_W / 4); g.lineTo(MINI_W / 2, MINI_W / 2); g.lineTo(0, MINI_W / 4); g.fill();
    g.setTransform(MINI_SC * TW / 2, MINI_SC * TH / 2, -MINI_SC * TW / 2, MINI_SC * TH / 2, MINI_W / 2, 0);
    g.fillStyle = '#7a9a5a'; g.beginPath(); for (const isl of ISLANDS) coastPath(g, isl, 0); g.fill();
    g.fillStyle = '#ffe066';
    for (let c = 0; c < N * N; c++) if (turf[c]) g.fillRect((c % N) / G, Math.floor(c / N) / G, 1 / G + 0.05, 1 / G + 0.05);
  }
  // Right edge of the safe area (the HUD is already shifted by the left inset), then clear of the pause button.
  const x0 = W - (SAFE.l + SAFE.r) / VIEW - MINI_W - (isTouch ? 64 / VIEW : 16), y0 = 12;
  ctx.drawImage(mini, x0, y0);
  const dot = (x, y, r, c) => { const m = miniPt(x, y); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x0 + m.x, y0 + m.y, r, 0, Math.PI * 2); ctx.fill(); };
  dot(CENTER, CENTER, canLevelUp() || canBuildUpgrade() ? 2.5 + Math.sin(time * 4) + 1 : 2.5, canLevelUp() || canBuildUpgrade() ? '#ffd25a' : '#c0392b');
  for (const o of OUTPOSTS) if (isTurf(o.x, o.y)) dot(o.x, o.y, 2, '#5ab4ff');
  for (const o of NESTS) dot(o.x, o.y, 1.8, nestClean(o) ? '#9be37a' : '#b14cff');
  for (const f of FRIENDS) if (!saved.has(f.id)) dot(f.x, f.y, 2 + Math.sin(time * 5) * 0.8, '#ffffff');
  dot(player.x, player.y, 3, '#ff9a3a');
}

// Small bubble at the bottom when Watson can talk to Fred or rest. The attack button activates it.
function drawInteract() {
  const it = interactTarget();
  if (!it || paused || isTouch) return;   // phones: the big button itself changes to REST / TRADE
  const label = it === 'fred' ? 'Trade with Fred' : it === 'free' ? 'Free the dog' : 'Rest';
  const key = 'Click';
  ctx.font = 'bold 14px system-ui, sans-serif';
  const kw = ctx.measureText(key).width + 14, w = kw + ctx.measureText(label).width + 30;
  // Phones: bottom centre between the stick and the buttons (portrait: above the buttons)
  const x = W / 2 - w / 2, y = isTouch ? H - (innerWidth > innerHeight ? 70 : 225) / VIEW : H - 118;
  ctx.fillStyle = 'rgba(20,14,12,.85)';
  ctx.beginPath(); ctx.roundRect(x, y, w, 30, 15); ctx.fill();
  ctx.strokeStyle = it === 'fred' ? '#f08a24' : '#d08a45'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
  if (player.chew || player.scene) return;
  ctx.fillStyle = it === 'fred' ? '#f08a24' : '#d08a45';
  ctx.beginPath(); ctx.roundRect(x + 6, y + 5, kw, 20, 10); ctx.fill();
  ctx.textAlign = 'left'; ctx.fillStyle = '#1a120e'; ctx.fillText(key, x + 13, y + 20);
  ctx.fillStyle = '#f2e6c8'; ctx.fillText(label, x + kw + 16, y + 20);
}

function drawJoystick() {
  if (joy.id === null) return;
  const ox = joy.ox / VIEW, oy = joy.oy / VIEW, R = JOY_R / VIEW;
  ctx.fillStyle = 'rgba(30,20,16,.35)'; ctx.strokeStyle = 'rgba(208,138,69,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ox, oy, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = joy.mag > 0.92 ? 'rgba(242,201,76,.85)' : 'rgba(242,230,200,.75)';
  ctx.beginPath(); ctx.arc(ox + joy.dx * R, oy + joy.dy * R, R * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 1;
}

function draw() {
  ctx.fillStyle = '#0b0a0c';
  ctx.fillRect(0, 0, W, H);
  drawTiles();
  drawBlooms();
  drawTrail();
  if (bloodstain) drawBloodstain();
  const seen = (x, y) => { const s = toScreen(x, y); return s.x > -150 && s.x < W + 150 && s.y > -150 && s.y < H + 200; };
  const shown = enemies.filter(e => seen(e.x, e.y));
  for (const e of shown) {
    if (e.state === 'windup') drawTelegraph(e);
    if (e.state === 'recover' && e.punishable) {   // yellow ring = open to a critical hit
      ctx.strokeStyle = 'rgba(255,210,90,.9)'; ctx.lineWidth = 3;
      groundEllipse(e.x, e.y, e.r + 0.3); ctx.stroke(); ctx.lineWidth = 1;
    }
  }
  if (target) {
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
    groundEllipse(target.x, target.y, target.r + 0.18); ctx.stroke(); ctx.lineWidth = 1;
  }

  // Depth-sort everything standing on the ground.
  const things = [
    { d: CENTER * 2, f: drawDoghouse },
    { d: JACKIE.x + JACKIE.y, f: drawJackie },
    { d: FRED.x + FRED.y, f: drawFred },
    ...TREASURES.filter(t => !found.has(t.id) && !obstacleAt(t.x, t.y) && seen(t.x, t.y)).map(t => ({ d: t.x + t.y, f: () => drawTreasure(t) })),
    ...TRINKETS.filter(t => !gotTrinket.has(t.id) && seen(t.x, t.y)).map(t => ({ d: t.x + t.y, f: () => drawTrinket(t) })),
    ...drops.filter(t => seen(t.x, t.y)).map(t => ({ d: t.x + t.y, f: () => drawTrinket(t) })),
    ...OBSTACLES.filter(o => !o.gone && seen(o.x, o.y)).map(o => ({ d: o.x + o.y, f: () => drawObstacle(o) })),
    ...OUTPOSTS.filter(o => seen(o.x, o.y)).map(o => ({ d: o.x + o.y - 0.5, f: () => drawOutpost(o) })),
    ...NESTS.filter(o => seen(o.x, o.y)).map(o => ({ d: o.x + o.y, f: () => drawNest(o) })),
    ...FRIENDS.filter(fr => seen(fr.x, fr.y)).map(fr => ({ d: fr.x + fr.y, f: () => drawFriend(fr) })),
    ...shown.map(e => ({ d: e.x + e.y, f: () => drawEnemy(e) })),
    ...projectiles.map(pr => ({ d: pr.x + pr.y, f: () => {
      shadow(pr.x, pr.y, 0.12);
      const s = toScreen(pr.x, pr.y), a = Math.atan2(pr.vy * 0.5 + pr.vx * 0.5, pr.vx - pr.vy);
      if (pr.kind === 'fire') {   // Ember's flaming ball
        ctx.save(); ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = 14;
        ctx.fillStyle = '#ff9a3a'; ctx.beginPath(); ctx.arc(s.x, s.y - 14, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd25a'; ctx.beginPath(); ctx.arc(s.x, s.y - 15, 3.4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }
      // Mega Bark: a flying bundle of sound waves.
      ctx.save(); ctx.translate(s.x, s.y - 16); ctx.rotate(a);
      ctx.strokeStyle = '#cfe8ff'; ctx.lineCap = 'round';
      ctx.shadowColor = '#9fd4ff'; ctx.shadowBlur = 10;
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = 1 - i * 0.25; ctx.lineWidth = 4 - i;
        ctx.beginPath(); ctx.arc(-i * 7, 0, 9 + i * 5, -1, 1); ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.restore(); ctx.globalAlpha = 1; ctx.lineWidth = 1;
    } })),
  ];
  if (!player.dead) things.push({ d: player.x + player.y, f: drawPlayer });
  things.sort((a, b) => a.d - b.d).forEach(t => t.f());

  effects.forEach(drawEffect);
  drawSpeech();

  ctx.textAlign = 'center';
  ctx.font = 'bold 14px system-ui, sans-serif';
  for (const f of floaters) {
    const s = toScreen(f.x, f.y);
    ctx.globalAlpha = Math.min(1, f.t / f.max * 2);
    ctx.fillStyle = '#000'; ctx.fillText(f.text, s.x + f.dx + 1, s.y - f.z + 1);
    ctx.fillStyle = f.color; ctx.fillText(f.text, s.x + f.dx, s.y - f.z);
  }
  ctx.globalAlpha = 1;

  if (!overlay('title').classList.contains('open')) drawHUD();
}

  { id: 'boss',   text: 'A giant polluted plant! It chains attacks, so wait for the yellow ring', when: () => enemies.some(e => e.boss && near(e, 6)), limit: 7 },
  { id: 'water',  text: "Watson hates water! A friend who loves swimming might help", when: () => player.shake > 0 && !hasPower('swim'), limit: 4 },
  { id: 'free',   text: 'A dog is stuck in polluted vines! Walk up and CLICK to free them', touch: 'A dog is stuck in polluted vines! Walk up and tap FREE',
    when: () => FRIENDS.some(f => !saved.has(f.id) && near(f, 4.5)), done: () => saved.size > 0, limit: 10 },
  { id: 'dry',    text: () => peeRefills() ? 'Out of pee! Rest at the doghouse to refill' : "Out of pee! Watson needs a water bowl. Maybe Fred can help", when: () => time - peeEmptyT < 4 || (player.bladder <= 0 && distC(player.x, player.y) > SAFE_R), limit: 6 },
  { id: 'boulder', text: 'Too big to move. A strong friend could smash it', when: () => OBSTACLES.some(o => !o.gone && o.type === 'boulder' && near(o, 2.5)) && player.buddy !== 'boomer', limit: 5 },
  { id: 'bramble', text: 'Thick thorny brambles. Something hot could burn them', when: () => OBSTACLES.some(o => !o.gone && o.type === 'bramble' && near(o, 2.5)) && player.buddy !== 'ember', limit: 5 },
  { id: 'nest',   text: 'A smog nest! Pee a loop around every nest on an island to clean it for good', when: () => NESTS.some(o => !nestClean(o) && near(o, 4)), limit: 8 },
  { id: 'outpost', text: 'A dry water bowl! Claim the turf around it to refill your pee here', when: () => OUTPOSTS.some(o => !isTurf(o.x, o.y) && near(o, 2.5)), limit: 6 },
  { id: 'bowltrade', text: 'A Shiny Bowl! Bring it to Fred', when: () => found.has('bowl') && !built.has('bowl'), done: () => built.has('bowl'), limit: 10 },
  { id: 'home',   text: 'Claiming land earns Home XP. The doghouse grows with your turf', when: () => homeXp > 0 && tut.built === 0, limit: 6 },
  { id: 'treasure', text: 'Something rare! Bring it home to upgrade the doghouse', when: () => [...found].some(f => f !== 'bowl' && !UPGRADES.some(u => u.needs === f && built.has(u.id))) && distC(player.x, player.y) > SAFE_R, done: () => tut.built > 0, limit: 8 },
  { id: 'lost',   text: 'Got hit! The pee trail washed away. Start over', when: () => time - trailLostT < 2.5, limit: 6 },
  { id: 'attack', text: 'CLICK  to attack toward the mouse', touch: 'Tap the big button to attack',                when: () => enemies.some(e => near(e, 3.5)),                        done: () => tut.strike > 0 },
  { id: 'bone',   text: 'Your dropped XP glows like a bone. Go get it back!', when: () => !!bloodstain,                                       done: () => !bloodstain, limit: 8 },
  { id: 'pee',    text: 'Hold P to pee. Walk a loop back to your turf to claim it', touch: 'Hold PEE and walk a loop back to your turf',
    when: () => tut.playT > 25 && !player.pee && distC(player.x, player.y) < 9, done: () => tut.claims > 0, limit: 12 },
  { id: 'peeing', text: 'Loop back to the yellow line to claim it. Don\'t get hit!', when: () => player.pee && trail.length > 3, done: () => tut.claims > 0, limit: 8 },
  { id: 'swim',   text: 'Splash loves water! Now Watson can swim too', when: () => hasPower('swim'), done: () => tut.swum > 1, limit: 8 },
  { id: 'palmove', text: () => `F for ${buddy().name}'s ${buddy().moveName}`, touch: () => `Tap ${buddy().verb} for ${buddy().name}'s ${buddy().moveName}`,
    when: () => { const b = buddy(); return !!b && b.kind === 'attack' && enemies.some(e => near(e, 4)); }, done: () => tut.pal > 0 },
  { id: 'swap',   text: 'Swap dog friends at the doghouse', when: () => saved.size >= 2 && distC(player.x, player.y) < 6, done: () => tut.swaps > 0, limit: 8 },
  { id: 'levelrest', text: 'Level bar full! Rest at the doghouse to level up', when: () => readyToLevel() && distC(player.x, player.y) > SAFE_R, done: () => player.level > 1, limit: 6 },
  { id: 'trinket', text: 'A shiny trinket! Save them up: Fred trades his best stuff for these', when: () => trinkets > 0 && tut.fred === 0, done: () => tut.fred > 0, limit: 8 },
  { id: 'fred',   text: 'Fred the cat sells gear, tricks and outfits. Walk up to Fred', touch: 'Fred the cat sells gear, tricks and outfits. Walk up to Fred',
    when: () => trinkets >= 1 && distC(player.x, player.y) < 5 && !nearFred(), done: () => tut.fred > 0, limit: 12 },
  { id: 'whirl',  text: '2  for Zoomies', touch: 'Tap ZOOM for Zoomies',                                  when: () => player.skills.has('whirl') && !paused,                  done: () => tut.whirl > 0 },
  { id: 'bark',   text: '3  for Mega Bark', touch: 'Tap BARK for Mega Bark',                                when: () => player.skills.has('fireball') && !paused,               done: () => tut.fireball > 0 },
  { id: 'run',    text: 'Hold SHIFT to run', touch: 'Push the stick all the way to run',                               when: () => tut.moved > 4 && tut.playT > 15,                         done: () => tut.ran > 0.4 },
  { id: 'move',   text: 'W A S D  to move', touch: 'Drag on the left side to move',                                when: () => tut.playT > 1.5,                                         done: () => tut.moved > 2 },
];
const hintDone = new Set(), hintShown = {};
let hint = null, hintFade = 0;
function updateHints(dt) {
  if (player.dead) return;
  for (const h of HINTS) if (!hintDone.has(h.id) && h.done && h.done()) hintDone.add(h.id);
  const now = HINTS.find(h => !hintDone.has(h.id) && h.when());
  if (now) {
    hintShown[now.id] = (hintShown[now.id] || 0) + dt;
    if (now.limit && hintShown[now.id] > now.limit) hintDone.add(now.id);
    if (hint !== now) { hint = now; hintFade = 0; }
  } else hint = null;
  hintFade = Math.min(1, hintFade + dt * 4);
}
function drawHint() {
  if (!hint || paused) return;
  const y = isTouch ? (W < 760 ? 178 : 90) : H - (interactTarget() ? 162 : 112);
  let text = isTouch && hint.touch ? hint.touch : hint.text;
  if (typeof text === 'function') text = text();
  ctx.font = 'bold 16px system-ui, sans-serif';
  const w = ctx.measureText(text).width + 36;
  ctx.globalAlpha = hintFade * (0.85 + Math.sin(performance.now() / 250) * 0.15);
  ctx.fillStyle = 'rgba(20,14,12,.85)';
  ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, y - 22, w, 34, 17); ctx.fill();
  ctx.strokeStyle = '#d08a45'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
  ctx.fillStyle = '#f2e6c8'; ctx.textAlign = 'center';
  ctx.fillText(text, W / 2, y);
  ctx.globalAlpha = 1;
}

// Title-screen logo: Watson trotting on the spot, drawn with the game's own art.
const logoCtx = document.getElementById('logoDog').getContext('2d');
function drawLogoDog() {
  const main = ctx;
  ctx = logoCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 720, 440);
  ctx.setTransform(6, 0, 0, 6, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(60, 68, 22, 4, 0, 0, Math.PI * 2); ctx.fill();
  drawDog(58, 68, { flip: false, walk: time * 7, moving: true, running: false, attack: -1, item: 'bone', color: '#cfe9b4', eating: false });
  ctx = main;
}

// ---------- Audio ----------
// All sounds and music are the owner's own recordings, in game/Audio/ (named "Watson Dog_<name>.mp3"). Each sound can have several
// takes that play in turn (take 1, then 2, then 3, then 1 again...). Missing files are just skipped.
const SOUNDS = {
  attack: ['SFX_Attack_01', 'SFX_Attack_02', 'SFX_Attack_03'],   // Watson's bite/swing lands on a plant
  death:  ['SFX_Attack_DeathSound_01'],                          // a plant is knocked out
  bark:   ['SFX_Bark_01', 'SFX_Bark_02', 'SFX_Bark_03'],         // Watson gets hit
  fred:   ['SFX_Fred_01', 'SFX_Fred_02', 'SFX_Fred_03'],         // walking up to Fred
  click:  ['SFX_InterfaceSFX_UI_01', 'SFX_InterfaceSFX_UI_02'],  // menu buttons
  swipe:  ['SFX_Swipe_01', 'SFX_Swipe_02', 'SFX_Swipe_03'],      // Watson attacks but misses
  special: ['SFX_Special Item_01'],                              // freeing a dog friend or finding a rare item
};
const MUSIC = 'MX_Theme_01';                                     // loops forever in the background
const audioFile = name => encodeURI(`Audio/Watson Dog_${name}.mp3`);
let actx = null, sfxGain = null, musicGain = null, muted = false;
const buffers = {}, nextTake = {};
try { muted = localStorage.getItem('watsonMute') === '1'; } catch (e) {}
function loadBuffer(name) {
  if (buffers[name] !== undefined) return;
  buffers[name] = null;
  fetch(audioFile(name)).then(r => r.ok ? r.arrayBuffer() : Promise.reject())
    .then(b => actx.decodeAudioData(b)).then(buf => { buffers[name] = buf; if (name === MUSIC) startMusic(); }).catch(() => {});
}
// Phones only allow sound after the player taps, so everything starts on the first tap or key.
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  sfxGain = actx.createGain(); sfxGain.connect(actx.destination);
  musicGain = actx.createGain(); musicGain.gain.value = 0.5; musicGain.connect(actx.destination);
  applyMute();
  loadBuffer(MUSIC);
  for (const list of Object.values(SOUNDS)) list.forEach(loadBuffer);
}
for (const ev of ['pointerdown', 'keydown', 'touchend']) addEventListener(ev, unlockAudio, { capture: true });
let musicSrc = null;
function startMusic() {
  if (!actx || musicSrc || !buffers[MUSIC]) return;
  musicSrc = actx.createBufferSource();
  musicSrc.buffer = buffers[MUSIC]; musicSrc.loop = true;
  musicSrc.connect(musicGain); musicSrc.start();
}
function sfx(kind) {
  const list = SOUNDS[kind];
  if (!actx || muted || !list) return;
  const k = nextTake[kind] || 0;
  nextTake[kind] = (k + 1) % list.length;
  const buf = buffers[list[k]];
  if (!buf) return;
  const src = actx.createBufferSource();
  src.buffer = buf; src.connect(sfxGain); src.start();
}
function applyMute() {
  if (sfxGain) sfxGain.gain.value = muted ? 0 : 1;
  if (musicGain) musicGain.gain.value = muted ? 0 : 0.5;
  overlay('mute').textContent = muted ? 'Sound: Off' : 'Sound: On';
}
overlay('mute').onclick = () => { muted = !muted; try { localStorage.setItem('watsonMute', muted ? '1' : '0'); } catch (e) {} applyMute(); };
applyMute();
// Menu buttons click.
document.addEventListener('click', e => { if (e.target.closest('.panel button, #newGame')) sfx('click'); }, true);
// Pause the music while the app is in the background.
document.addEventListener('visibilitychange', () => { if (actx) document.hidden ? actx.suspend() : actx.resume(); });

// ---------- Save game ----------
// Three save slots. The game autosaves into the slot you're playing every few seconds (and when the
// app is closed). The pause menu lets you save into another slot or load one. Loading puts Watson
// back at the doghouse with everything he's earned.
const SLOTS = 3, slotKey = n => `watsonDogSlot${n}`;
let activeSlot = 1;
try {
  activeSlot = +localStorage.getItem('watsonDogActive') || 1;
  const old = localStorage.getItem('watsonDogSave1');   // older single save -> slot 1
  if (old && !localStorage.getItem(slotKey(1))) localStorage.setItem(slotKey(1), old);
  if (old) localStorage.removeItem('watsonDogSave1');
} catch (e) {}
const setActive = n => { activeSlot = n; try { localStorage.setItem('watsonDogActive', n); } catch (e) {} };
function packTurf() {   // run lengths of 0s and 1s, so the save stays small
  const runs = []; let cur = 0, n = 0;
  for (let c = 0; c < N * N; c++) { if (turf[c] === cur) n++; else { runs.push(n); cur = turf[c]; n = 1; } }
  runs.push(n);
  return runs;
}
let noSave = false;
function saveGame(slot = activeSlot) {
  if (player.dead || noSave) return;
  const p = player;
  const data = { v: 1, when: Date.now(), summary: { level: p.level, xp: p.xp, home: homeXp, friends: saved.size, turf: Math.floor(turfFrac() * 100), finds: found.size },
    p: { level: p.level, stats: p.stats, xp: p.xp, weapon: p.weapon, skills: [...p.skills], outfits: [...p.outfits], wear: p.wear,
         buddy: p.buddy, maxFlasks: p.maxFlasks, bladder: p.bladder },
    saved: [...saved], bondKills, found: [...found], built: [...built], gone: OBSTACLES.filter(o => o.gone).map(o => o.hides),
    turf: packTurf(), bloodstain, tut, hints: [...hintDone], homeXp, trinkets, gotTrinket: [...gotTrinket], drops, bosses: [...bossesBeaten],
    stragglers: (noteStragglers(), stragglers) };
  try { localStorage.setItem(slotKey(slot), JSON.stringify(data)); } catch (e) {}
}
const readSlot = n => { try { const d = JSON.parse(localStorage.getItem(slotKey(n))); return d && d.v === 1 ? d : null; } catch (e) { return null; } };
function loadGame() {
  const d = readSlot(activeSlot);
  if (!d) return false;
  const p = player;
  Object.assign(p, { level: d.p.level, stats: { ...p.stats, ...d.p.stats }, xp: d.p.xp, weapon: d.p.weapon, skills: new Set(d.p.skills),
    outfits: new Set(d.p.outfits), wear: d.p.wear, buddy: d.p.buddy, maxFlasks: d.p.maxFlasks });
  d.saved.forEach(id => saved.add(id)); Object.assign(bondKills, d.bondKills);
  d.found.forEach(id => found.add(id)); d.built.forEach(id => built.add(id));
  for (const o of OBSTACLES) o.gone = d.gone.includes(o.hides);
  let c = 0, v = 0; turfCount = 0;
  for (const n of d.turf) { turf.fill(v, c, c + n); if (v) turfCount += n; c += n; v = 1 - v; }
  dirtyChunks();
  bloodstain = d.bloodstain; Object.assign(tut, d.tut); d.hints.forEach(h => hintDone.add(h));
  trinkets = d.trinkets || 0; drops = d.drops || []; (d.bosses || []).forEach(id => bossesBeaten.add(id)); enemies = []; stragglers = d.stragglers || []; (d.gotTrinket || []).forEach(id => gotTrinket.add(id));
  homeXp = Math.max(d.homeXp || 0, Math.round(Math.max(0, turfCount - 25) / (G * G)));   // a running total of land claimed (older saves spent it)
  Object.assign(p, { hp: maxHp(), sta: maxSta(), flasks: p.maxFlasks,
    bladder: peeRefills() || d.p.bladder === undefined ? maxPee() : Math.min(maxPee(), d.p.bladder) });
  for (const f of FRIENDS) if (saved.has(f.id)) { f.x = CENTER + f.home[0]; f.y = CENTER + f.home[1]; }
  ISLANDS.forEach((isl, k) => { if (islandClean(k)) cleanIslands.add(k); });
  populate();
  return true;
}
// Switching games reloads the page into the chosen slot, straight into play (no title screen).
function switchToSlot(n) {
  noSave = true;
  setActive(n);
  try { sessionStorage.setItem('watsonSkipTitle', '1'); } catch (e) {}
  location.reload();
}
if (loadGame()) overlay('newGame').classList.add('show');
try { if (sessionStorage.getItem('watsonSkipTitle')) { sessionStorage.removeItem('watsonSkipTitle'); closeOverlays(); } } catch (e) {}
setInterval(() => { if (!paused) saveGame(); }, 10000);
addEventListener('pagehide', () => saveGame());
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
overlay('newGame').addEventListener('click', e => {
  e.stopPropagation();
  if (!confirm(`Start a new game? Slot ${activeSlot} will be erased.`)) return;
  noSave = true;
  try { localStorage.removeItem(slotKey(activeSlot)); } catch (err) {}
  location.reload();
});

// Pause menu: resume, and save / load / start fresh in any of the slots.
let pauseOpenedAt = 0;
function openPause() {
  if (player.dead || player.scene) return;
  saveGame();
  openOverlay('pause');
  pauseOpenedAt = performance.now();
  renderSlots();
}
function renderSlots() {
  const box = overlay('slots');
  box.innerHTML = '';
  for (let n = 1; n <= SLOTS; n++) {
    const d = readSlot(n), cur = n === activeSlot, div = document.createElement('div');
    div.className = 'slot' + (cur ? ' cur' : '');
    const when = d ? new Date(d.when || 0).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
    const sm = d && d.summary;
    div.innerHTML = `<div class="info"><div class="name">Slot ${n}${cur ? ' · playing now' : ''}</div><div class="desc">${
      sm ? `Lv ${sm.level} · ${sm.home || 0} Home XP · ${sm.friends} friends · Turf ${sm.turf}% · ${when}` : 'Empty'}</div></div>`;
    const btn = (label, fn, alt) => {
      const b = document.createElement('button'); b.textContent = label; if (alt) b.className = 'alt';
      b.onclick = () => { if (performance.now() - pauseOpenedAt > 350) fn(); };
      div.appendChild(b);
    };
    if (cur) btn('Save', () => { saveGame(); renderSlots(); });
    else {
      btn('Save here', () => {
        if (d && !confirm(`Save over slot ${n}?`)) return;
        saveGame(n); setActive(n); renderSlots();
      }, true);
      if (d) btn('Load', () => { saveGame(); switchToSlot(n); });
      else btn('New', () => { saveGame(); try { localStorage.removeItem(slotKey(n)); } catch (e) {} switchToSlot(n); });
    }
    box.appendChild(div);
  }
}
overlay('resume').onclick = () => { if (performance.now() - pauseOpenedAt > 350) closeOverlays(); };

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  time += dt;
  if (!paused) { update(dt); updateHints(dt); }
  updateTouchButtons();
  if (overlay('title').classList.contains('open')) drawLogoDog();
  // Camera follows the player smoothly.
  const tx = (player.x - player.y) * TW / 2, ty = (player.x + player.y) * TH / 2;
  cam.x += (tx - cam.x) * Math.min(1, dt * 8);
  cam.y += (ty - cam.y) * Math.min(1, dt * 8);
  draw();
  requestAnimationFrame(frame);
}
cam.x = (player.x - player.y) * TW / 2;
cam.y = (player.x + player.y) * TH / 2;
requestAnimationFrame(frame);
</script>
</body>
