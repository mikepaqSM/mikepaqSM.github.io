<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watson Dog">
<meta name="theme-color" content="#0b0a0c">
<link rel="manifest" href="/game/manifest.webmanifest?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="/game/icon-180.png?v=3">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/game/icon-180.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/game/icon-192.png?v=3">
<meta name="mobile-web-app-capable" content="yes">
<title>Watson Dog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0a0c; overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #e8e4e0; }
  html, body, button, .overlay { touch-action: manipulation; }   /* no double-tap zoom */
  canvas { display: block; touch-action: none; }
  body.touch { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .panel, .panel * { touch-action: pan-y; }
  /* Phone controls: only shown on touch screens */
  #touch { display: none; }
  body.touch #touch { display: block; }
  /* Buttons: a carved wooden ring with a brass rim, an icon, and a small label */
  .tbtn { position: fixed; border-radius: 50%; border: 2px solid #c98a48; overflow: hidden;
    background: radial-gradient(circle at 38% 28%, rgba(122,84,54,.92), rgba(52,33,22,.92) 58%, rgba(24,15,10,.94) 100%);
    box-shadow: inset 0 2px 1px rgba(255,226,180,.35), inset 0 -4px 8px rgba(0,0,0,.55), 0 0 0 2px rgba(30,18,10,.75), 0 4px 10px rgba(0,0,0,.5);
    color: #f6e7c8; font: 13px 'Luckiest Guy', Impact, system-ui, sans-serif; letter-spacing: .06em; text-shadow: 0 1px 0 #2a170c, 0 0 4px rgba(0,0,0,.6);
    display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none;
    -webkit-tap-highlight-color: transparent; padding: 0; line-height: 1; transition: transform .06s; }
  .tbtn svg { width: 46%; height: 46%; fill: currentColor; filter: drop-shadow(0 1px 0 #2a170c); margin-bottom: 1px; }
  .tbtn b, .tbtn span { font-weight: normal; font-size: 10px; }
  .tbtn small { font: 700 9px system-ui, sans-serif; opacity: .85; text-shadow: none; }
  .tbtn::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(rgba(0,0,0,.6) calc(var(--cd, 0) * 1turn), transparent 0); }
  .tbtn.off { opacity: .4; filter: grayscale(.7); }
  .tbtn:active { transform: scale(.93); box-shadow: inset 0 3px 8px rgba(0,0,0,.6), 0 0 0 2px rgba(30,18,10,.75); }
  #tChomp b { font-size: 15px; }
  #tChomp.act { border-color: #ffd98a; color: #2a170c; text-shadow: 0 1px 0 rgba(255,240,200,.6);
    background: radial-gradient(circle at 38% 28%, #ffe7a8, #e0a24e 60%, #a8662a 100%); }
  #tChomp.act svg { filter: none; }
  #tPause svg { width: 40%; height: 40%; margin: 0; }
  #tChomp { width: 86px; height: 86px; right: calc(22px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); font-size: 14px; }
  #tRoll  { width: 64px; height: 64px; right: calc(120px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); }
  #tPee   { width: 54px; height: 54px; right: calc(194px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); }
  #tPee { color: #ffe27a; }
  #tPee.on { color: #2a170c; border-color: #fff0a0; text-shadow: none; background: radial-gradient(circle at 38% 28%, #fff4b8, #f2c94c 60%, #b98a1a 100%); }
  #tPal { color: #bfe6ff; }
  /* Ability slots: filled in order with whatever Watson can do right now (see layoutAbilityButtons) */
  #tZoom, #tBark, #tTreat, #tPal { width: 54px; height: 54px; }
  .tbtn.hide { display: none; }
  #tPause { width: 40px; height: 40px; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); font-size: 14px; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .7); }
  .overlay.open { display: flex; }
  .panel { background: #1a1517; border: 1px solid #4a3236; border-radius: 10px; padding: 20px 24px;
    width: min(640px, 92vw); max-height: 88vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .panel h1 { margin: 0 0 6px; font-size: 26px; font-family: Georgia, 'Times New Roman', serif; font-weight: normal; }
  .panel h2 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #a08a8c; }
  .panel p { color: #c4b8b6; line-height: 1.5; margin: 6px 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 6px; background: #241d20; margin-bottom: 6px; }
  .row .info { flex: 1; }
  .row .name { font-weight: 600; }
  .row .desc { font-size: 13px; color: #a89c9c; }
  .row .val { font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; font-weight: 600; }
  button { font: inherit; background: #9e2a2b; color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: #b83334; }
  button:disabled { background: #352b2d; color: #7d7072; cursor: default; }
  .xp { color: #f2c94c; font-weight: 600; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .shopHead { display: flex; align-items: center; gap: 12px; }
  kbd { background: #2c2427; border: 1px solid #54424a; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  .title { font-size: 34px !important; line-height: 1.15; color: #f0d9c8; }
  .died { font-family: Georgia, 'Times New Roman', serif; font-size: 64px; color: #b3191c; letter-spacing: .12em; margin: 0 0 10px; }
  #pause .panel { width: min(520px, 92vw); }
  .slot { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #241d20; margin-top: 8px; border: 1px solid transparent; }
  .slot.cur { border-color: #c98a48; }
  .slot .info { flex: 1; min-width: 0; }
  .slot .name { font-weight: 600; }
  .slot .desc { font-size: 12px; color: #a89c9c; }
  .slot button { padding: 6px 12px; }
  .slot button.alt, #mute { background: #3a2f33; }
  @media (max-height: 520px) { #pause .panel { padding: 10px 14px; } #pause h1 { font-size: 20px; margin: 0; } .slot { padding: 6px 10px; margin-top: 6px; } }
  #death .panel { background: none; border: 0; box-shadow: none; text-align: center; }
  /* Shop menus: compact on small screens so everything fits and stays readable */
  #shop .panel { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .tabs { display: flex; gap: 6px; margin: 10px 0 8px; flex-wrap: wrap; }
  .tabs button { background: #2c2427; color: #c4b8b6; border-radius: 16px; padding: 5px 14px; }
  .tabs button.on { background: #c98a48; color: #1a120e; }
  .row .desc:empty { display: none; }
  .row.dim { opacity: .55; }
  @media (max-width: 760px), (max-height: 520px) {
    #shop .panel { width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)); max-height: calc(100vh - 16px);
      padding: 10px 12px; border-radius: 8px; box-sizing: border-box; }
    #shop .panel h1 { font-size: 18px; margin: 0; }
    #shop .panel h2 { margin: 5px 0 3px; font-size: 10px; }
    #shop .xp { font-size: 13px; }
    #shop .row { padding: 4px 8px; gap: 8px; margin-bottom: 4px; }
    #shop .row .name { font-size: 13px; }
    #shop .row .desc { font-size: 11px; line-height: 1.25; }
    #shop .row .val { font-size: 12px; min-width: 18px; }
    #shop button { font-size: 12px; padding: 5px 10px; }
    #shop kbd { font-size: 10px; padding: 0 4px; }
  }
  /* Phones held sideways: two columns of items so you scroll less */
  @media (max-height: 520px) and (orientation: landscape) {
    #shopBody { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; align-items: start; }
    #shopBody h2 { grid-column: 1 / -1; }
    #shopBody .row { margin-bottom: 3px; padding: 3px 8px; }
    #shop .row .desc { font-size: 10.5px; }
    #shop .panel h2 { margin: 4px 0 2px; }
    #shop .panel { padding: 8px 12px; }
  }
  #title { background: radial-gradient(ellipse at center, rgba(20,12,8,.55) 0%, rgba(8,6,6,.92) 75%); cursor: pointer; }
  .logo { display: flex; flex-direction: column; align-items: center; user-select: none; }
  #logoDog { width: min(360px, 70vw); height: auto; margin-bottom: -18px; }
  .logo-text { font-family: 'Luckiest Guy', Impact, 'Arial Black', sans-serif; font-size: clamp(64px, 13vw, 132px); line-height: .9;
    color: #d08a45; -webkit-text-stroke: 4px #3a2210; paint-order: stroke fill; letter-spacing: .03em;
    text-shadow: 0 7px 0 #3a2210, 0 14px 30px rgba(0,0,0,.6); transform: rotate(-3deg); text-align: center; }
  .logo-text span { display: block; color: #c0392b; font-size: .82em; margin-top: 4px; }
  .press { margin-top: 34px; font-family: 'Luckiest Guy', Impact, sans-serif; font-size: 20px; letter-spacing: .14em;
    color: #f2e6c8; opacity: .8; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .iosTip { display: none; margin-top: 18px; font: 13px system-ui, sans-serif; color: #c4b8b6; text-align: center; max-width: 80vw; }
  .iosTip.show { display: block; }
  .newGame { display: none; margin-top: 22px; background: none; border: 1px solid rgba(242,230,200,.35); color: rgba(242,230,200,.7); font-size: 12px; padding: 5px 12px; }
  .newGame.show { display: inline-block; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="touch">
  <button class="tbtn" id="tChomp"><svg viewBox="0 0 24 24"></svg><b></b></button>
  <button class="tbtn" id="tRoll"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.4 5H2l3.5-4.5L9 9H6.8A6 6 0 1 0 12 6z"/></svg><b>ROLL</b></button>
  <button class="tbtn hide" id="tZoom"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1-9 9h2.5A6.5 6.5 0 1 0 12 5.5zM12 8a4 4 0 1 1-4 4h2.2A1.8 1.8 0 1 0 12 10.2z"/></svg><b>ZOOM</b><small></small></button>
  <button class="tbtn hide" id="tBark"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><path d="M10 7.5a6 6 0 0 1 0 9l-1.4-1.4a4 4 0 0 0 0-6.2zM14 4a10.5 10.5 0 0 1 0 16l-1.4-1.4a8.5 8.5 0 0 0 0-13.2zM18 1a14.5 14.5 0 0 1 0 22l-1.4-1.4a12.5 12.5 0 0 0 0-19.2z"/></svg><b>BARK</b><small></small></button>
  <button class="tbtn" id="tTreat"><svg viewBox="0 0 24 24"><path d="M7 9.5h10a2.6 2.6 0 1 1 2.5 3.3V13a2.6 2.6 0 1 1-2.5 2.5H7A2.6 2.6 0 1 1 4.5 13v-.2A2.6 2.6 0 1 1 7 9.5z"/></svg><b>TREAT</b><small></small></button>
  <button class="tbtn" id="tPee"><svg viewBox="0 0 24 24"><path d="M12 2.5S5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-7-12.5-7-12.5zm-3 12.5a1.2 1.2 0 0 1 1.2 1.2 2.2 2.2 0 0 0 2.2 2.2 1.2 1.2 0 0 1 0 2.4 4.6 4.6 0 0 1-4.6-4.6A1.2 1.2 0 0 1 9 15z"/></svg><b>PEE</b><small></small></button>
  <button class="tbtn hide" id="tPal"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><ellipse cx="5.5" cy="10.5" rx="2.2" ry="2.8"/><ellipse cx="18.5" cy="10.5" rx="2.2" ry="2.8"/><ellipse cx="9" cy="5.8" rx="2.1" ry="2.7"/><ellipse cx="15" cy="5.8" rx="2.1" ry="2.7"/></svg><span>PAL</span><small></small></button>
  <button class="tbtn" id="tPause"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
</div>

<div class="overlay open" id="title">
  <div class="logo">
    <canvas id="logoDog" width="720" height="440"></canvas>
    <div class="logo-text">Watson<span>Dog</span></div>
    <div class="press">press any key</div>
    <div class="iosTip" id="iosTip"></div>
    <button class="newGame" id="newGame">New game</button>
  </div>
</div>

<div class="overlay" id="shop">
  <div class="panel">
    <div class="top"><h1 id="shopTitle">Watson's Doghouse</h1><span class="shopHead"><span class="xp" id="shopXp"></span><button id="closeShop">Leave</button></span></div>
    <div class="tabs" id="shopTabs"></div>
    <div id="shopBody"></div>
  </div>
</div>

<div class="overlay" id="pause">
  <div class="panel">
    <div class="top"><h1>Paused</h1><span class="shopHead"><button id="mute" class="alt">Sound: On</button><button id="resume">Resume</button></span></div>
    <div id="slots"></div>
  </div>
</div>

<div class="overlay" id="death">
  <div class="panel">
    <div class="died">KNOCKED OUT</div>
    <p id="deathMsg"></p>
    <p style="margin-top:18px"><button id="respawn">Back to the doghouse (R)</button></p>
  </div>
</div>

<script>
// ---------- Setup ----------
const TW = 64, TH = 32;        // isometric tile size in pixels
const MAP = 120;               // map is MAP x MAP tiles (mostly sea, with islands)
const CENTER = MAP / 2;
const SAFE_R = 2.5;            // radius of the safe area around the doghouse (tiles)
const MAX_ENEMIES = 70;
const LOCK_RANGE = 7;          // how far away auto lock-on reaches (tiles)

const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');   // swapped briefly to draw the title-screen logo
let W, H;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let VIEW = 1;   // < 1 zooms out on small (phone) screens
// Notch / rounded-corner insets, so the HUD isn't hidden in landscape full screen.
const safeProbe = document.createElement('div');
safeProbe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
document.body.appendChild(safeProbe);
const SAFE = { l: 0, t: 0, r: 0 };
function resize() {
  const cs = getComputedStyle(safeProbe);
  SAFE.l = parseFloat(cs.paddingLeft) || 0; SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0;
  VIEW = clamp(Math.min(innerWidth, innerHeight * 1.6) / 950, 0.62, 1);
  W = canvas.width = Math.round(innerWidth / VIEW); H = canvas.height = Math.round(innerHeight / VIEW);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
}
addEventListener('resize', resize);
resize();

const distC = (x, y) => Math.hypot(x - CENTER, y - CENTER);

// ---------- Game data (tweak these to balance the game) ----------
const WEAPONS = [
  { name: 'Puppy Teeth',   dmg: 10, cost: 0,    color: '#ffffff', verb: 'BITE', type: 'bite',      desc: 'Just your own chompers' },
  { name: 'Fetch Stick', tk: 2,   dmg: 18, cost: 40,   color: '#8a5a2e', verb: 'WHACK', type: 'stick',     desc: 'A really good stick' },
  { name: 'Iron Bone', tk: 3,     dmg: 28, cost: 150,  color: '#a9cc9c', verb: 'BONK', type: 'bone',      desc: 'Heavy, shiny, and great for bonking' },
  { name: 'Razor Frisbee', tk: 5, dmg: 44, cost: 450,  color: '#2ec4b6', verb: 'SLASH', type: 'frisbee',   shop: 'stall', desc: 'A frisbee with a serrated edge' },
  { name: 'Inferno Bone', tk: 5,  dmg: 68, cost: 1200, color: '#ff7a3a', verb: 'SCORCH', type: 'flamebone', shop: 'fire', desc: 'A legendary bone that never stops burning' },
  { name: 'Moon Bone', tk: 5,     dmg: 95, cost: 2500, color: '#cfe8ff', verb: 'SMITE', type: 'moonbone',  shop: 'fire', desc: 'A glowing bone from Fred\'s secret stash' },
];

const SKILLS = [
  { id: 'strike',   key: '1', name: 'Attack',    cost: 0,   cd: 0.7,  sta: 16, lock: 0.32, desc: 'Bite, or swing your fetch gear, toward the mouse (click) or at the locked-on enemy (1 / J).' },
  { id: 'whirl', tk: 3,    key: '2', name: 'Zoomies',   cost: 80,  cd: 4,    sta: 35, lock: 0.5,  short: 'Spin attack that hits everyone around you', tip: 'Spin attack', desc: 'Tear around in a circle, hitting everyone nearby for 1.3x gear damage.' },
  { id: 'fireball', tk: 5, key: '3', name: 'Mega Bark', cost: 200, shop: 'stall', cd: 1.6,  sta: 25, lock: 0.4,  short: 'Flying bark blast, 35 damage', tip: 'Long-range blast', desc: 'A bark so loud it flies. Blasts an area for 35 damage (scales with Bark Power).' },
];
const CRIT_MULT = 2;   // damage bonus for hitting an enemy right after it attacks
const ROLL_STA = 22;
const RUN_MULT = 1.75;   // run speed multiplier (running costs no stamina)

// Stats you raise when you level up.
const STATS = [
  { id: 'vig', name: 'Vigor',     desc: '+12 HP' },
  { id: 'end', name: 'Endurance', desc: '+10 stamina' },
  { id: 'str', name: 'Jaw Strength', desc: '+7% damage' },
  { id: 'arc', name: 'Bark Power',   desc: '+10% bark damage' },
  { id: 'bla', name: 'Bladder',      desc: '+8 pee' },
];
const levelCost = lvl => Math.floor(40 * 1.2 ** (lvl - 1));

// Regular enemies: friendly plant folk turned mean by pollution.
// windup = seconds of warning before the hit, reach = size of the red danger circle,
// staggers = whether your hits interrupt their attack. s = drawing scale, look = how they're drawn.
const ENEMY_TYPES = [
  { name: 'Sproutling',       lvl: 1,  hp: 10,  dmg: 14, speed: 1.6, xp: 3,   r: 0.26, h: 30, s: 1,    look: 'sprout',    color: '#8fbf4f', tier: 0,  windup: 0.66, reach: 0.45, recover: 0.7, staggers: true,  aggro: 4.0 },
  { name: 'Thornbush',        lvl: 3,  hp: 30,  dmg: 20, speed: 2.1, xp: 10,  r: 0.3,  h: 32, s: 1,    look: 'thorn',     color: '#3f6e2e', tier: 1,  windup: 0.54, reach: 0.6,  recover: 0.55, staggers: true, aggro: 5.0 },
  { name: 'Toxic Toadstool',  lvl: 6,  hp: 55,  dmg: 30, speed: 1.8, xp: 30,  r: 0.34, h: 46, s: 1.1,  look: 'toadstool', color: '#8e3b9e', tier: 2,  windup: 0.84,  reach: 0.85, recover: 0.8, staggers: false, aggro: 5.5 },
  { name: 'Smog Oak',         lvl: 10, hp: 110, dmg: 50, speed: 1.3, xp: 90,  r: 0.45, h: 72, s: 1.1,  look: 'oak',       color: '#6b4a2e', tier: 3,  windup: 1.2,  reach: 1.1,  recover: 1.2, staggers: false, aggro: 6.0 },
];

// Dog friends: lost pups tangled in polluted vines around town. Free one and it joins you.
// Watson brings one friend along at a time (swap at the doghouse). kind 'ability' = a passive power,
// kind 'attack' = a special move on its own button. ox/oy = where it's found (tiles from the doghouse),
// home = where it lounges in the yard once saved. Bond grows as you knock out plants together (3 levels).
const FRIENDS = [
  { id: 'splash', name: 'Splash', breed: 'Labrador', tip: 'Swims', ox: -12, oy: 8, home: [0.9, -1.7], kind: 'ability', power: 'swim',
    short: 'Loves water, so Watson can swim too', thanks: 'Woof! Thanks! Ooh, is that a pond?',
    look: { fur: '#e3b968', light: '#f3d9a4', dark: '#c2954a', saddle: null, collar: '#2e86de', s: 1 } },
  { id: 'boomer', name: 'Boomer', breed: 'Bulldog', tip: 'Smashes boulders', ox: 40, oy: -10, home: [-0.9, -1.8], kind: 'attack', move: 'pound', verb: 'POUND',
    moveName: 'Ground Pound', cd: 6, dmg: 40, short: 'Belly-flops on plants and knocks them off balance', thanks: "Hrmph. Thanks, pal. I'll wait at your place.",
    look: { fur: '#b98a5e', light: '#f2ead8', dark: '#6e4c30', saddle: null, bw: 1.15, leg: 0.75, collar: '#8e44ad', s: 0.95 } },
  { id: 'scout', name: 'Scout', breed: 'German Shepherd', tip: 'Guards you while you pee', ox: 31, oy: 0, home: [1.9, 0.9], kind: 'ability', power: 'lookout',
    short: 'Keeps watch while you pee. Plants back off', thanks: "Thanks! I'll keep an eye out for you.",
    look: { fur: '#c08038', light: '#d9a462', dark: '#2a2018', saddle: '#2a2018', earUp: true, collar: '#27ae60', s: 1.08 } },
  { id: 'frost', name: 'Frost', breed: 'Husky', tip: 'Freezes plants', ox: -23, oy: 37, home: [-1.7, -0.5], kind: 'attack', move: 'howl', verb: 'HOWL',
    moveName: 'Frost Howl', cd: 9, dmg: 12, short: 'A chilly howl that freezes nearby plants (free critical hits)', thanks: 'Awooo! You found me!',
